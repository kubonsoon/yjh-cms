<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ========================================================
1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인
======================================================== */
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* 📱 html과 body의 실제 가용 면적을 모바일 스크린 비율과 100% 동기화 (주소창 밀림 방어) */
        html,
        body {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            letter-spacing: -0.3px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px 10px !important;
            /* 📱 좁은 모바일 화면 공간 극대화를 위한 슬림 패딩 */
            display: flex;
            flex-direction: column;
        }

        /* ========================================================
         2. 상단 타이틀 및 모바일 최적화 툴바 구역
        ======================================================== */
        .header-container {
            display: flex;
            flex-direction: column;
            /* 📱 세로 배치 정렬로 뷰포트 횡공간 확장 방어 */
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .calendar-title-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .user-cert-badge-zone {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .gender-badge-pink {
            background: rgba(244, 114, 182, 0.15) !important;
            border: 1px solid #f472b6 !important;
            color: #f472b6 !important;
            font-size: 11px !important;
            padding: 2px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .calendar-title {
            font-size: 16px !important;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            /* 글자 튕김 현상 방지 속성 보강 */
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            /* 📱 3대 버튼 균등 분할 터치 레이아웃 */
            text-align: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px !important;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #0b0f19;
            border-color: var(--secondary-color);
        }

        /* ========================================================
3. [구조 대혁명] 단일행 주간(7일) 타임라인 바 시스템
======================================================== */
        .weekly-timeline-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            /* 📱 일~토 7일간의 날짜 칸만 한 줄 고정 사출 */
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        /* 주간 날짜 개별 단추 디자인 */
        .weekly-day-btn {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .weekly-day-btn .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .weekly-day-btn .day-date {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 📱 오늘 일자 혹은 실실시간 대상자가 터치해 선택한 요일 활성화 스킨 */
        .weekly-day-btn.active {
            background: rgba(14, 165, 233, 0.15) !important;
            border-color: var(--secondary-color) !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .weekly-day-btn.active .day-name,
        .weekly-day-btn.active .day-date {
            color: var(--secondary-color) !important;
        }

        /* 일요일(레드) 및 토요일(블루) 모바일 컬러 아이덴티티 보존 */
        .weekly-day-btn:nth-child(1) .day-date {
            color: #f87171;
        }

        .weekly-day-btn:nth-child(7) .day-date {
            color: #60a5fa;
        }

        /* ========================================================
4. [구조 대혁명] 당일 소집 과제 대형 세로 스크롤 카드 레일 존
======================================================== */
        .daily-card-scroll-zone {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            /* 📱 모바일 가속 터치 부드러운 스크롤 탑재 */
        }

        /* 📱 하루 최대 5개 이상 과제 중첩 시에도 시원시원하게 스크롤되는 대형 카드 컴포넌트 */
        .trial-manifest-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .card-title-text {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
            flex: 1;
            padding-right: 8px;
        }

        /* 📱 모집공고 고대비 4색 라벨 배지 모바일화 계승 */
        .card-th-badge {
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .th-color-1기 {
            background: rgba(148, 163, 184, 0.12) !important;
            border: 1px solid #94a3b8 !important;
            color: #f8fafc !important;
        }

        .th-color-2기 {
            background: rgba(14, 165, 233, 0.15) !important;
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
        }

        .th-color-3기 {
            background: rgba(74, 222, 128, 0.15) !important;
            border: 1px solid #22c55e !important;
            color: #4ade80 !important;
        }

        .th-color-4기 {
            background: rgba(245, 158, 11, 0.15) !important;
            border: 1px solid #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* 메타 정보 2열 격자 배치 */
        .card-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .card-meta-grid span {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* 카드 하단 직장 일체형 터치 액션 버튼 바 레일 */
        .card-action-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .card-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .card-btn.join {
            background: var(--success-color);
            color: #070a12;
        }

        .card-btn.reject {
            background: var(--danger-color);
            color: #ffffff;
        }

        .card-btn.close {
            background: #334155;
            color: #ffffff;
        }

        /* ========================================================
5. 하단 고정 모바일 가이드 라벨 패널 스킨
======================================================== */
        .bottom-guide-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            height: 95px;
            /* 📱 소프트 키보드 유입 시 터짐 방지 압축 스킨 */
            flex-shrink: 0;
        }

        .white-dictionary-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .notice-list-wrapper {
            font-size: 10px !important;
            color: var(--text-muted);
            line-height: 1.3;
            padding-left: 12px;
        }

        /* ========================================================
6. 모바일 대상자 마스터 누적 이력조회 대형 모달 (100% 보존 수리)
======================================================== */
        .calendar-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .calendar-modal-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 94%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-history-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--warning-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-history-scroll-zone {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-mini-card {
            background: #161e30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .history-mini-card.current-job {
            border-left-color: var(--secondary-color);
            background: rgba(14, 165, 233, 0.04);
        }

        .daily-card-scroll-zone::-webkit-scrollbar,
        .modal-history-scroll-zone::-webkit-scrollbar {
            width: 3px;
        }

        .daily-card-scroll-zone::-webkit-scrollbar-thumb,
        .modal-history-scroll-zone::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }



        /* ========================================================
   . 과거 참여 이력조회 독립 모달 하단 버튼 전용 스킨
   ======================================================== */
        .modal-btn-group-row {
            display: flex !important;
            width: 100% !important;
            margin-top: 14px !important;
            gap: 8px !important;
            box-sizing: border-box !important;
        }

        .modal-act-btn {
            width: 100% !important;
            padding: 12px 10px !important;
            /* 📱 모바일 터치 반경 최적화를 위한 넉넉한 세로폭 배정 */
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            text-align: center !important;
            cursor: pointer !important;
            transition: background 0.15s ease;
        }

        .modal-act-btn.btn-close {
            background: #334155 !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }

        .modal-act-btn.btn-close:active {
            background: #1e293b !important;
        }


        /* ========================================================
   [교정 추가] 2. 연월 가이드 바 컨트롤러 모바일 플렉스 정렬 스킨
   ======================================================== */
        .month-controller {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px !important;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .month-btn {
            background: none !important;
            border: none !important;
            color: var(--secondary-color) !important;
            font-size: 15px !important;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 8px !important;
            transition: transform 0.1s ease;
        }

        .month-btn:active {
            transform: scale(0.85);
        }

        .month-label {
            font-size: 14px !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }
    </style>

</head>

<body>
    <!-- 1. 상단 모바일 기수 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <!-- [요구사항 반영 ⓐ] 성별 배지 정렬 및 독립 격리를 위한 wrapper 프레임 결합 -->
        <div class="calendar-title-wrapper">
            <div class="calendar-title">
                <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄러 (주간 관제)
            </div>
            <!-- 자바스크립트 엔진과 실시간 동기화되어 진재영 (생년월일) 여 배지가 출력될 세션 구역 -->
            <div class="user-cert-badge-zone" id="userCertBadgeZone">
                <span id="txtUserInfo">확인중..</span>
                <span class="gender-badge-pink" id="badgeGender" style="display:none;">여</span>
            </div>
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()"><i
                    class="fa-solid fa-file-arrow-down"></i> 시험현황</button>
            <button type="button" class="tool-btn" onclick="window.print()"><i class="fa-solid fa-print"></i>
                인쇄/PDF저장</button>
        </div>
    </div>

    <!-- 2. 월 및 연도 가이드 바 컨트롤러 (모바일 양 끝단 배치 구조 및 원본 문자 100% 사수) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. [대개혁 핵심] 상단 1행 고정형 주간(7일) 단일 날짜 선택 타임라인 레일 바 -->
    <!-- 자바스크립트 엔진에 의해 일요일부터 토요일까지 7일간의 날짜 조각이 주입됩니다 -->
    <div class="weekly-timeline-bar" id="weeklyTimelineBoard"></div>

    <!-- 4. [대개혁 핵심] 하루 최대 5개 이상의 복잡 과제가 겹쳐도 완벽히 분사하는 세로 스크롤 카드 레일 랙 -->
    <!-- 상단 주간 바에서 선택한 날짜와 실시간 매칭되는 당일 시험 공고 카드들이 세로로 대형 사출됩니다 -->
    <div class="daily-card-scroll-zone" id="dailyCardBoard"></div>

    <!-- 5. 하단 고정 가이드라인 패널 (모바일 10px 슬림 가이드 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 주간 모바일 안내 센터
        </div>
        <ol class="notice-list-wrapper">
            <li>상단 7일 주간 바에서 날짜를 선택하시면 당일 진행 과제 카드가 아래에 정밀 정렬됩니다.</li>
            <li>[과거 참여 이력] 배지 선택 시 대상자의 참여 마스터 누적 내역이 실시간 자동 추적 사출됩니다.</li>
        </ol>
    </div>

    <!-- 6. [대수술 완수] 과거 참여 이력조회 대형 누적 모달 프레임 구역 (원본 ✕ 닫기 버튼 기믹 결합) -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-clock-history"></i> 대상자 마스터 참여 이력 관제탑
                </div>
                <button type="button" class="modal-close-x"
                    onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-folder-tree"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트 팩토리에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 단독 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경 최적화 닫기 단추 레일 -->
            <div class="modal-btn-group-row" style="grid-template-columns: 1fr;">
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()"
                    style="background: #334155; color: #ffffff; width: 100%;">이력 화면 닫기</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 1. 달력 주간 변수 및 선택 날짜 정밀 추적 포인터 [순정 원본 족보 100% 무결 상속 수호] =====
        let currentDate = new Date(); // 실시간 시스템 원격 오늘 날짜 자동 추적 마운트 완료

        // 고정 데이터 검사 방어 및 기준일 빌드 (2026-12-04 스크리닝 시점 기준 동기화 지원)
        if (currentDate.getFullYear() < 2026) {
            currentDate = new Date("2026-12-04");
        }

        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');
        let selectedDateStr = `${yyyy}-${mm}-${dd}`;
        let currentFilter = 'ALL';
        let currentCertifiedUser = sessionStorage.getItem('certifiedUserName') || "진재영";
        if (!sessionStorage.getItem('certifiedUserName')) {
            sessionStorage.setItem('certifiedUserName', "진재영");
        }

        /**
         * 2. 메인 대시보드(admin.html)의 로컬스토리지 임상시험 마스터 레코드 스트림 연동
         */
        function getMasterData() {
            return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
        }

        /**
         * 3. 대상자 관리 탭(applicantView)의 가상 데이터베이스 동기화 스트림 로드
         */
        function getApplicantData() {
            return JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
        }

        /**
         * 4. 주간 선택 컨트롤러 네비게이터 작동기
         */
        function moveMonth(v) {
            currentDate.setDate(currentDate.getDate() + (v * 7));
            renderCalendar();
        }

        /**
         * 5. [시험현황] 부모창 연동 엔진
         */
        function executeDownload() {
            console.log("[원격 인터록 작동] 모바일 관제탑 부모창 m-login 4단계 나의 시험현황 화면으로 강제 이송 패킷 발행.");
            if (window.parent) {
                window.parent.postMessage({ action: "GOTO_STEP_4", timestamp: Date.now() }, "*");
            } else if (window.opener && !window.opener.closed) {
                if (typeof window.opener.navigateToStep === "function") window.opener.navigateToStep(4);
            }
        }

        let currentActiveModalJob = null;
        let currentTemporaryUid = "";
        window.currentWeeklyDateKeys = [];

        /**
         * 6. 행정 일자 동적 역산 공식 함수
         */
        function calculateSubtractedDate(baseStr, minusDays) {
            if (!baseStr || baseStr.includes("추후")) return null;
            const dObj = new Date(baseStr.trim());
            if (isNaN(dObj.getTime())) return null;
            dObj.setDate(dObj.getDate() - minusDays);
            return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
        }

        function renderCalendar() {
            const timelineBoard = document.getElementById('weeklyTimelineBoard');
            const label = document.getElementById('currentMonthLabel');
            if (!timelineBoard) return;

            timelineBoard.innerHTML = '';

            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            if (label) label.innerText = `${currentYear}년 ${(currentMonth + 1).toString().padStart(2, '0')}월`;

            const currentDayOfWeek = currentDate.getDay();
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDayOfWeek);

            const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
            window.currentWeeklyDateKeys = [];

            // ────────────────────────────────────────────────────────
            // ⓐ [정밀 주입 구역] 성별 배지 실시간 동적 매핑 엔진 수형 완착
            // ────────────────────────────────────────────────────────
            const applicantDB = getApplicantData();
            const cleanSessionName = currentCertifiedUser.replace(/\s/g, "");
            const myLiveJobRecord = applicantDB.find(app => (app.name || "").toString().replace(/\s/g, "") === cleanSessionName);

            if (myLiveJobRecord) {
                // 주민등록번호 앞 6자리 추출 기믹 작동
                const ssnBirth = myLiveJobRecord.ssn ? myLiveJobRecord.ssn.substring(0, 6) : "050607";
                const targetGender = myLiveJobRecord.gender || "여";

                const profileSlot = document.getElementById('txtDynamicProfile');
                const scheduleSlot = document.getElementById('txtDynamicSchedule');

                // [요구사항 1] 1번째 라인에 대상자 정보 마스터 동적 주입 완착
                if (profileSlot) {
                    profileSlot.innerText = `${myLiveJobRecord.name} (${ssnBirth}) ${targetGender} ---> 최초 인증 대상자 가상 스케줄러 연동 완료`;
                }
                // [요구사항 2] 2번째 라인에 요청하신 고정 텍스트 마운트 완착
                if (scheduleSlot) {
                    scheduleSlot.innerText = "임상시험 스케줄(주간)";
                }
            }
            // ────────────────────────────────────────────────────────

            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(startOfWeek);
                loopDate.setDate(startOfWeek.getDate() + i);

                const kstOffset = loopDate.getTime() - (loopDate.getTimezoneOffset() * 60000);
                const formattedDateKey = new Date(kstOffset).toISOString().split('T').toString().trim();
                window.currentWeeklyDateKeys.push(formattedDateKey);

                if (!selectedDateStr && i === currentDayOfWeek) {
                    selectedDateStr = formattedDateKey;
                }

                const dayBtn = document.createElement('div');
                dayBtn.className = `weekly-day-btn ${selectedDateStr === formattedDateKey ? 'active' : ''}`;

                dayBtn.innerHTML = `
                <div class="day-name">${dayNamesShort[i]}</div>
                <div class="day-date">${loopDate.getDate()}</div>
            `;

                dayBtn.onclick = function () {
                    selectedDateStr = formattedDateKey;
                    document.querySelectorAll('.weekly-day-btn').forEach(btn => btn.classList.remove('active'));
                    dayBtn.classList.add('active');
                    renderDailyCards();
                };

                timelineBoard.appendChild(dayBtn);
            }

            renderDailyCards();
        }

        function renderDailyCards() {
            const cardBoard = document.getElementById('dailyCardBoard');
            if (!cardBoard) return;
            cardBoard.innerHTML = '';

            const records = getMasterData();
            let applicantDB = getApplicantData();

            const cleanSessionName = currentCertifiedUser.replace(/\s/g, "");
            const myLiveJobRecord = applicantDB.find(app =>
                (app.name || "").toString().replace(/\s/g, "") === cleanSessionName &&
                app.stage && !["종료", "탈락"].includes(app.stage)
            );

            const isLockInUser = !!myLiveJobRecord;

            if (!myLiveJobRecord) {
                cardBoard.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:30px 10px;">참여 중인 유효 임상 과제 정보가 감지되지 않았습니다.</div>';
                return;
            }

            const targetRecords = records.filter(item => {
                if (!item.recDate) return false;

                const cleanMyTitle = myLiveJobRecord.title.toString().replace(/\s/g, "").toLowerCase();
                const cleanItemTitle = item.title.toString().replace(/\s/g, "").toLowerCase();
                if (cleanMyTitle !== cleanItemTitle) return false;

                if (myLiveJobRecord.th && item.th) {
                    const cleanMyTh = myLiveJobRecord.th.toString().replace(/[^0-9]/g, "");
                    const cleanItemTh = item.th.toString().replace(/[^0-9]/g, "");
                    if (cleanMyTh !== cleanItemTh) return false;
                }

                let itemScheduleMap = {};
                if (item.recDate) { const k = item.recDate.trim(); itemScheduleMap[k] = `스크리닝`; }

                if (myLiveJobRecord.ssn && myLiveJobRecord.ssn.includes("소집: ")) {
                    const parsedSojib = myLiveJobRecord.ssn.match(/\d{4}-\d{2}-\d{2}/);
                    if (parsedSojib) { const k = parsedSojib.trim(); itemScheduleMap[k] = `소집`; }
                }

                if (item.payDate1) { const d = calculateSubtractedDate(item.payDate1, 7); if (d) itemScheduleMap[d.trim()] = `1차 방문채혈`; }
                if (item.payDate2) { const d = calculateSubtractedDate(item.payDate2, 7); if (d) itemScheduleMap[d.trim()] = `2차 방문채혈`; }
                if (item.payDate3) { const d = calculateSubtractedDate(item.payDate3, 7); if (d) itemScheduleMap[d.trim()] = `3차 방문채혈`; }
                if (item.payDate4) { const d = calculateSubtractedDate(item.payDate4, 7); if (d) itemScheduleMap[d.trim()] = `4차 방문채혈`; }

                if (item.paySchedule) {
                    const matchedDates = item.paySchedule.toString().match(/\d{4}-\d{2}-\d{2}/g);
                    if (matchedDates && matchedDates.length >= 5) {
                        const d = calculateSubtractedDate(matchedDates, 14); if (d) itemScheduleMap[d.trim()] = `종료검사`;
                    }
                } else if (item.payDate5) {
                    const d = calculateSubtractedDate(item.payDate5, 14); if (d) itemScheduleMap[d.trim()] = `종료검사`;
                }

                // ────────────────────────────────────────────────────────
                // ⓑ [정밀 개정 구역] 선택 날짜 일치 텍스트 빌더 포맷 정밀 주입
                // ────────────────────────────────────────────────────────
                let weeklyMatchedList = [];
                if (itemScheduleMap[selectedDateStr]) {
                    const dayObj = new Date(selectedDateStr);
                    const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
                    const formattedDateString = `${dayObj.getFullYear()}년 ${String(dayObj.getMonth() + 1).padStart(2, '0')}월 ${String(dayObj.getDate()).padStart(2, '0')}일 (${dayNamesShort[dayObj.getDay()]})`;

                    weeklyMatchedList.push({
                        dateKey: selectedDateStr,
                        labelText: `${formattedDateString} : ${itemScheduleMap[selectedDateStr]}`
                    });
                }

                if (weeklyMatchedList.length > 0) {
                    item._computedWeeklyList = weeklyMatchedList;
                    return true;
                }
                return false;
            });

            if (targetRecords.length === 0) {
                cardBoard.innerHTML = `
                <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px;">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 24px; color: var(--text-muted); margin-bottom: 8px; display: block;"></i>
                    선택하신 일자에는 배정된 임상시험 세부 일정이 없습니다.
                </div>
            `;
                return;
            }

            targetRecords.forEach(item => {
                const thText = (item.th || "1기").trim();
                const clickUid = item.uid ? item.uid : item.title;
                const dynamicColorClass = `th-color-${thText}`;
                const weeklyList = item._computedWeeklyList || [];

                weeklyList.forEach((schedule, idx) => {
                    const currentStageText = schedule.labelText || "";
                    const uniqueSubKey = `${clickUid}_${idx}`;

                    const card = document.createElement('div');
                    card.className = 'trial-manifest-card';
                    card.setAttribute("style", "margin-bottom: 10px; border: 1px solid var(--border-color);");

                    card.innerHTML = `
                    <div class="card-top-row">
                        <div class="card-title-text" style="color: #ffffff; font-weight:800; font-size: 14.5px;">${currentStageText}</div>
                        <div class="card-th-badge ${dynamicColorClass}">[${thText}]</div>
                    </div>
                    <div class="card-meta-grid" style="margin-top:6px;">
                        <div>연계 과제: <span style="color:#38bdf8; font-weight:700;">${item.title || '임상 과제명 미지정'}</span></div>
                        <div>배정 정원: <span>${item.count ? item.count + '명' : '-'}</span></div>
                        <div>임상 기간: <span>${item.period ? item.period + '시간' : ''}</span></div>
                    </div>
                    <div class="card-action-bar" id="ui_action_bar_${uniqueSubKey}" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px;">
                        <button type="button" class="card-btn join" id="btn_card_join_${uniqueSubKey}" style="height:32px; font-size: 12.5px;">참여</button>
                        <button type="button" class="card-btn reject" id="btn_card_reject_${uniqueSubKey}" style="height:32px; font-size:12.5px; background:#475569;">미참여</button>
                        <button type="button" class="card-btn close" id="btn_card_hist_${uniqueSubKey}" style="height:32px; font-size:12.5px; background:#1e293b;">
                            <i class="fa-solid fa-clock-history"></i> 이력
                        </button>
                    </div>
                `;

                    const liveStatusText = myLiveJobRecord.status || myLiveJobRecord.stage || "신검대기";
                    if (liveStatusText === "신검대기" || liveStatusText === "신검통과") {
                        if (!currentStageText.includes("스크리닝")) { card.classList.add('mobile-future-lock'); }
                    }

                    cardBoard.appendChild(card);

                    // ⭐ [순정 정품 파이프라인 무결성 사수 수호 구역] ⭐
                    document.getElementById(`btn_card_join_${uniqueSubKey}`).onclick = function (e) {
                        e.preventDefault();
                        let appDB = getApplicantData();

                        const activeJobRecord = appDB.find(app => {
                            const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                            const dbTitle = (app.title || '').toString().trim();
                            return cleanDbName === cleanSessionName && app.stage !== "종료" && dbTitle !== "신규 방문 과제 미배정";
                        });

                        if (activeJobRecord && !isLockInUser) {
                            alert("중복 신청 불가 안내\n\n대상자님은 현재 참여 중이거나 전산 심사 대기 중인 임상시험 과제가 존재합니다.");
                            return;
                        }

                        const finishedJobs = appDB.filter(app => {
                            const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                            return cleanDbName === cleanSessionName && app.stage === "종료" && app.recDate;
                        });

                        if (finishedJobs.length > 0 && !isLockInUser) {
                            finishedJobs.sort((a, b) => new Date(b.recDate) - new Date(a.recDate));
                            const lastFinishedJob = finishedJobs[0];
                            const systemCurrentTime = new Date("2026-12-04");
                            const lastExamDate = new Date(lastFinishedJob.recDate);
                            const dayDiff = Math.floor((systemCurrentTime.getTime() - lastExamDate.getTime()) / (1000 * 60 * 60 * 24));

                            if (dayDiff < 180) {
                                alert(`전산망 보안 안내\n\n대상자님은 마지막 시험 참여 후 아직 6개월이 경과하지 않았습니다.`);
                                return;
                            }
                        }

                        const isAlreadyClickedThisJob = appDB.some(app =>
                            (app.name || '').toString().trim() === currentCertifiedUser &&
                            (app.title || '').toString().trim() === (item.title || '').toString().trim() &&
                            (app.th || '').toString().trim() === thText
                        );

                        let targetIdx = appDB.findIndex(u => (u.name || '').toString().trim().replace(/\s/g, "") === cleanSessionName);

                        if (targetIdx !== -1 && isAlreadyClickedThisJob) {
                            let cleanFriendlyStage = "소집";
                            if (currentStageText.includes("1차")) cleanFriendlyStage = "1차방문";
                            else if (currentStageText.includes("2차")) cleanFriendlyStage = "2차방문";
                            else if (currentStageText.includes("3차")) cleanFriendlyStage = "3차방문";
                            else if (currentStageText.includes("4차")) cleanFriendlyStage = "4차방문";
                            else if (currentStageText.includes("종료검사")) cleanFriendlyStage = "종료방문";

                            appDB[targetIdx].status = cleanFriendlyStage;
                            appDB[targetIdx].stage = cleanFriendlyStage;

                            localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                            alert(`인증 성공\n\n대상자님의 참여 상태가 출석 [${appDB[targetIdx].status}] 단계로 정상 전진 업데이트 커밋되었습니다.`);

                            if (window.opener && !window.opener.closed && typeof window.opener.refreshApplicantView === "function") {
                                window.opener.refreshApplicantView();
                            }
                            renderCalendar();
                            return;
                        }

                        let targetIdxNew = appDB.findIndex(u => (u.name || '').toString().trim().replace(/\s/g, "") === cleanSessionName && (u.title || '').toString().trim() === "신규 방문 과제 미배정");
                        const liveQuotaCount = appDB.filter(u =>
                            (u.title || '').toString().replace(/\s/g, "") === item.title.toString().replace(/\s/g, "") &&
                            (u.th || '').toString().replace(/\s/g, "") === thText.toString().replace(/\s/g, "")
                        ).length;

                        const nextLineNumber = liveQuotaCount + 1;
                        const liveProgressFormat = nextLineNumber + "/60";

                        const newApplicantRecord = {
                            uid: (targetIdxNew !== -1 ? appDB[targetIdxNew].uid : ("NEW_" + Date.now() + "_" + Math.floor(Math.random() * 1000))),
                            name: currentCertifiedUser,
                            title: item.title,
                            th: thText,
                            count: liveProgressFormat,
                            nCount: 60,
                            period: item.period || "0",
                            ssn: activeJobRecord && activeJobRecord.ssn ? activeJobRecord.ssn : "050607-2",
                            phone: activeJobRecord && activeJobRecord.phone ? activeJobRecord.phone : "010-0000-0000",
                            gender: myLiveJobRecord.gender || "여",
                            payStatus1: "대기", payStatus2: "대기", payStatus3: "대기", payStatus4: "대기",
                            result: "대기", isDutyAgreed: "대기", isCallAgreed: "대기",
                            category: "M인증", stage: "신검대기", regDate: new Date().toISOString().split('T')[0]
                        };

                        if (targetIdxNew !== -1) {
                            appDB[targetIdxNew] = Object.assign({}, appDB[targetIdxNew], newApplicantRecord);
                        } else if (targetIdx !== -1) {
                            appDB[targetIdx] = Object.assign({}, appDB[targetIdx], newApplicantRecord);
                        } else {
                            appDB.push(newApplicantRecord);
                        }

                        localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                        alert(`[신청 접수 완료]\n\n${currentCertifiedUser} 대상자님, 선택하신 임상시험 [${item.title}] 과제 참여 신청이 정상 접수되었습니다.`);
                        renderDailyCards();
                    };

                    // 미참여 및 이력조회 버튼 핸들러 (원본 무결 보존)
                    document.getElementById(`btn_card_reject_${uniqueSubKey}`).onclick = function (e) { e.preventDefault(); alert('미참여 신청 되었습니다.'); };
                    document.getElementById(`btn_card_hist_${uniqueSubKey}`).onclick = function (e) { e.preventDefault(); openIndividualHistoryModalInMobile(cleanSessionName, item.title, thText); };
                });
            });
        }

        /**
         * 8. 모바일 전용 참여 마스터 이력조회 모달 강제 렌더러 (원본 순정 유지)
         */
        function openIndividualHistoryModalInMobile(currentSessionName, targetTitle, targetTh) {
            let applicantDB = getApplicantData();
            const scrollZone = document.getElementById("modal-history-scroll-zone");
            if (!scrollZone) return;
            scrollZone.innerHTML = "";

            const rawHistoryRecords = applicantDB.filter(item => (item.name || "").toString().trim() === currentSessionName);
            document.getElementById("m-history-count-title").innerText = `참여 누적 내역 (${rawHistoryRecords.length}건)`;

            if (rawHistoryRecords.length === 0) {
                scrollZone.innerHTML = '<div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding: 20px 0;">연동된 대상자 이력 내역이 존재하지 않습니다.</div>';
            } else {
                rawHistoryRecords.forEach(row => {
                    const isCurrentJob = ((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
                    const miniCard = document.createElement("div");
                    miniCard.className = isCurrentJob ? "history-mini-card current-job" : "history-mini-card";

                    let prefixTag = isCurrentJob ? `<span style="color:var(--secondary-color); font-weight: 800; margin-right:4px;">[현재시험]</span>` : `<span style="color:var(--text-muted); font-weight:700; margin-right: 4px;">[과거시험]</span>`;
                    let currentPayStatus = row.status || "대기";

                    miniCard.innerHTML = `
                    <div style="text-align:left;">
                        <div style="font-size:12px; font-weight:700; color:#ffffff; margin-bottom:2px;">
                            ${prefixTag}${row.name || '대상자'} ${row.title || '미지정 과제'}
                        </div>
                        <div style="font-size:11px; color:var(--text-muted);">
                            진행기수: <span style="color:#fff;">${row.th || '-'}</span> | 현재단계: <span style="color:#38bdf8; font-weight:700;">${currentPayStatus}</span>
                        </div>
                    </div>
                `;
                    scrollZone.appendChild(miniCard);
                });
            }
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: flex !important;');
        }

        window.closeDetailModal = function () {
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: none !important;');
        };

        window.onload = renderCalendar;

    </script>
</body>

</html>
