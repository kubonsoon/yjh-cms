<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일용 관리자 제어 화면</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #07132B;
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .panel-box {
            background-color: #112240;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #1E293B;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            color: #06B6D4;
            margin-bottom: 20px;
            border-bottom: 2px solid #1E293B;
            padding-bottom: 10px;
        }

        h3 {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13.5px;
            color: #E2E8F0;
            cursor: pointer;
        }

        .check-item input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0 20px 0;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #FFF;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-pass {
            background-color: #10B981;
        }

        .btn-pass:hover {
            background-color: #059669;
        }

        .btn-fail {
            background-color: #F43F5E;
        }

        .btn-fail:hover {
            background-color: #E11D48;
        }

        .btn-allow {
            background-color: #0284c7;
        }

        .btn-allow:hover {
            background-color: #0369a1;
        }

        .btn-block {
            background-color: #475569;
        }

        .btn-block:hover {
            background-color: #334155;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed !important;
        }

        /* 1) 관리자 수동 제어용 행정 단계 스위칭 셀렉트 박스 전용 핏 */
        .adm-status-select {
            background-color: #07132b !important;
            border: 1px solid #1e293b !important;
            border-radius: 6px !important;
            color: #ffffff !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            padding: 4px 6px !important;
            outline: none !important;
            cursor: pointer !important;
            width: 100% !important;
            margin-top: 5px !important;
        }

        /* 2) 대상자 상태별 모바일 제어반 라벨 스킨 (m-login 배지와 연동 시각화) */
        .adm-badge-purple {
            background: #7c3aed !important;
            color: #ffffff !important;
        }

        /* 신검대기 */
        .adm-badge-green {
            background: #10b981 !important;
            color: #ffffff !important;
        }

        /* 신검통과 */
        .adm-badge-blue {
            background: #2563eb !important;
            color: #ffffff !important;
        }

        /* 소집/투약 */
        .adm-badge-rose {
            background: #f43f5e !important;
            color: #ffffff !important;
        }

        /* 심사탈락 */

        /* 3) 원격 무선 패킷 개방(toggleAuth) 인가 활성화 상태 야광 테두리 */
        .adm-btn-pulse {
            position: relative !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6) !important;
            border: 1px solid #10b981 !important;
            animation: admPulse 2s infinite !important;
        }

        @keyframes admPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>

<body>
    <div class="panel-box">
        <div class="panel-title">📱 실시간 심사 처리 </div>

        <h3>1단계: 기본 심사 처리 여부</h3>
        <div style="margin-bottom: 12px;">
            <label class="check-item" style="display:inline-flex; margin-right:15px;">
                <input type="radio" name="user_type" id="r_normal" checked onclick="switchUserType()">
                <span>정규 대상자</span></label>
            <label class="check-item" style="display:inline-flex;"><input type="radio" name="user_type" id="r_backup"
                    onclick="switchUserType()"> <span>시험 예비자</span></label>
        </div>
        <div class="btn-grid">
            <button onclick="sendSignal('PASS')" class="btn btn-pass">통과 처리</button>
            <button onclick="sendSignal('FAIL')" class="btn btn-fail">탈락 처리</button>
        </div>

        <div id="ui_attendance_section" style="display: none; border-top: 1px solid #1E293B; padding-top: 15px;">
            <h3>2단계: 참여상태 및 탈락 사유 체크</h3>

            <!-- 🚀 [지능형 동적 렌더러 슬롯]: 기존 하드코딩 라벨 5줄을 완전히 철거 소독하고,
                 PC 대장에서 변경된 진짜 19대 실시간 status 밸류와 매칭되어 실시간 동적 빌드업됩니다. -->
            <div id="dynamic-stage-check-container"
                style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.01); border: 1px solid #1e293b; border-radius: 6px;">
                <!-- 자바스크립트 엔진에 의해 실시간 네온 스킨과 paySchedule 날짜 파싱본이 주입되는 구역 -->
            </div>

            <h3 style="margin-top:15px;">3단계: 모바일 지급 신청 인가</h3>
            <div class="btn-grid" style="margin-bottom:0;">
                <button id="btn_allow" onclick="toggleAuth(true)" class="btn btn-allow" disabled>신청가능 개방</button>
                <button id="btn_block" onclick="toggleAuth(false)" class="btn btn-block" disabled>신청불가 차단</button>
            </div>

            <!-- ⚙️ 2단계 동적 레이아웃 주입 및 paySchedule 마스터 예정일 분할 추출 수혈 유틸리티 -->
            <script>
                function updateMobileStageUI(row) {
                    const container = document.getElementById('dynamic-stage-check-container');
                    if (!container) return;

                    // 단일화 대원칙에 따라 진짜 참여상태 방인 status (또는 stage 디펜스)를 가로채기 스캔
                    const currentStage = (row.status || row.stage || "신검대기").toString().trim();

                    // 대표님이 정돈 완료하신 모집공고 원장의 3단 통합 paySchedule 문자열 확보
                    const payScheduleStr = row.paySchedule || "추후공지";
                    const tokens = payScheduleStr.split('/');

                    let p1Date = "추후공지", p2Date = "추후공지", p3Date = "추후공지";

                    // 슬래시(/) 기준으로 1차, 2차, 3차 날짜 알맹이 정밀 분할 추출
                    if (tokens[0]) p1Date = tokens[0].replace("1차:", "").trim();
                    if (tokens[1]) p2Date = tokens[1].replace("2차:", "").trim();
                    if (tokens[2]) p3Date = tokens[2].replace("3차:", "").trim();

                    let htmlBuffer = "";

                    // A. 정상 진행 및 차수별 외래방문 공정군 (보라색/청색/하늘색/녹색 스킨 분기)
                    if (["신검대기", "신검통과", "신검탈락", "신검동철", "소집", "투약", "1차방문", "2차방문", "3차방문", "4차방문", "종료방문", "1기종료", "2기종료", "3기종료", "4기종료"].includes(currentStage)) {

                        let badgeColor = "#7c3aed"; // 신검대기 디폴트
                        if (currentStage === "소집" || currentStage === "신검통과") badgeColor = "#0ea5e9";
                        else if (currentStage === "투약" || currentStage.includes("방문")) badgeColor = "#06b6d4";
                        else if (currentStage.includes("종료")) badgeColor = "#10b981";

                        htmlBuffer += "<div style='display:flex; align-items:center; color:#ffffff; font-size:13px; font-weight:700;'>";
                        htmlBuffer += "<input type='checkbox' checked disabled style='margin-right:8px; width:16px; height:16px; accent-color:" + badgeColor + ";'>";
                        htmlBuffer += "<span>현재 진행 상태: <span style='color:" + badgeColor + ";'>[" + currentStage + "]</span></span></div>";

                        // 1차, 2차, 3차 지급일정 세로 바인딩 출력 (해당 차수인 경우 골드색 야광 강조)
                        htmlBuffer += "<div style='margin-left:24px; font-size:12px; color:#94a3b8; line-height:1.6; margin-top:4px;'>";
                        htmlBuffer += "<div style='" + (currentStage === '1차방문' ? "color:#fbbf24; font-weight:800;" : "") + "'>• 1차 예정일: " + p1Date + "</div>";
                        htmlBuffer += "<div style='" + (currentStage === '2차방문' ? "color:#fbbf24; font-weight:800;" : "") + "'>• 2차 예정일: " + p2Date + "</div>";
                        htmlBuffer += "<div style='" + (currentStage === '종료방문' || currentStage.includes('종료') ? "color:#fbbf24; font-weight:800;" : "") + "'>• 3차(종료) 예정일: " + p3Date + "</div>";
                        htmlBuffer += "</div>";
                    }
                    // B. 중도 탈락 및 위반/사고군 7형제 매칭 (감액 정산 사유 다이렉트 긴급 출력)
                    else {
                        htmlBuffer += "<div style='display:flex; align-items:center; color:#f87171; font-size:13px; font-weight:700;'>";
                        htmlBuffer += "<input type='checkbox' checked disabled style='margin-right:8px; width:16px; height:16px; accent-color:#ef4444;'>";
                        htmlBuffer += "<span>중도 탈락 감지: <span style='color:#f87171; text-decoration:underline;'>[" + currentStage + "]</span></span></div>";
                        htmlBuffer += "<div style='margin-left:24px; margin-top:6px; font-size:12px; color:#cbd5e1; background:rgba(239,68,68,0.06); padding:8px; border:1px dashed #ef4444; border-radius:4px; line-height:1.5;'>";
                        htmlBuffer += "⚠️ <b>[정산 패널티 분류]</b> 해당 대상자는 관리자가 마스터 원장에 지정한 사유 <b>\"" + currentStage + "\"</b>로 인해 단계별 일정비율 자동 감액 정산 처리반 대상자로 강제 분류 홀딩되었습니다.</div>";
                    }

                    container.innerHTML = htmlBuffer;

                    // 🚀 [자물쇠 인터록 락킹 연동]: 19대 공정에 맞춘 3단계 버튼 자동 활성화/비활성화 가동
                    const btnAllow = document.getElementById('btn_allow');
                    const btnBlock = document.getElementById('btn_block');
                    if (btnAllow && btnBlock) {
                        if (["소집", "투약", "1차방문", "2차방문", "3차방문", "4차방문", "종료방문"].includes(currentStage)) {
                            btnAllow.removeAttribute('disabled');
                            btnBlock.removeAttribute('disabled');
                        } else {
                            // 신검대기, 기종료, 규정위반 등은 원격 개방을 원천 잠금 처리
                            btnAllow.setAttribute('disabled', 'true');
                            btnBlock.removeAttribute('disabled');
                        }
                    }
                }
            </script>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🟢 [정밀 교정 완결]: 변수명 주파수를 단일화하여 무한 다중 유저 실시간 인터셉터 안테나 이식
        // =========================================================================
        let targetName = "";

        // 글로벌 공유 메모리 장치(localStorage)를 초당 상시 정밀 체킹하는 실시간 관제 리프레시 가드 (새로고침 먹통 방지)
        function syncTargetSession() {
            const globalActiveLoginPacket = JSON.parse(localStorage.getItem('loggedInUser'));
            const displaySlot = document.getElementById('ui_active_target_display');

            // 돔 내부에 실시간 날짜 가이드를 사출할 슬롯 가선 전산 확보
            const step1Label = document.querySelector("label[for='chk_step1'] span") || document.getElementById('chk_step1')?.nextElementSibling;
            const step2Label = document.querySelector("label[for='chk_step2'] span") || document.getElementById('chk_step2')?.nextElementSibling;

            if (globalActiveLoginPacket && globalActiveLoginPacket.name) {
                targetName = globalActiveLoginPacket.name.trim();
                if (displaySlot) {
                    displaySlot.innerText = `${targetName} 대상자 실시간 관제중`;
                    displaySlot.style.color = "#06B6D4";
                }

                /* =================================================================
                   ⚡ [신설]: 모집공고 마스터 대장 가변 차수별 지급일자 실시간 역추적 릴레이
                   ================================================================= */
                let applicantDB = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
                let recruitmentDB = JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];

                const userRec = applicantDB.find(u => (u.name || '').toString().replace(/\s/g, "") === targetName.replace(/\s/g, ""));

                if (userRec) {
                    // 모바일 제어반 인라인 자동화 관제 디스플레이 엔진과 실시간 라이브 연동 수혈
                    if (typeof updateMobileStageUI === "function") {
                        updateMobileStageUI(userRec);
                    }

                    if (userRec.title) {
                        const cleanAppTitle = userRec.title.toString().toLowerCase().replace(/[^a-zA-Z0-9가-힣]/g, "").trim();
                        const cleanAppTh = (userRec.th || "").replace(/[^0-9]/g, "");

                        // 대상자의 과제명과 기수가 100% 매칭되는 진짜 모집공고 원본 색인
                        const matchedRec = recruitmentDB.find(r => {
                            const cleanRecTitle = (r.title || "").toString().toLowerCase().replace(/[^a-zA-Z0-9가-힣]/g, "").trim();
                            const cleanRecTh = (r.th || "").replace(/[^0-9]/g, "");
                            return cleanRecTitle === cleanAppTitle && cleanRecTh === cleanAppTh;
                        });

                        if (matchedRec) {
                            // 1기/2기 등 어떤 스펙이 들어오든 인라인 피커 날짜(payDate1~3)를 우선 상속
                            const d1 = matchedRec.payDate1 || matchedRec.recDate || "추후공지";
                            const d2 = matchedRec.payDate2 || "추후공지";

                            if (step1Label) step1Label.innerHTML = `1차 일정 이수 완료 <b style="color:#fbbf24; margin-left:4px;">[지급일: ${d1}]</b>`;
                            if (step2Label) step2Label.innerHTML = `2차 일정 최종 완료 <b style="color:#fbbf24; margin-left:4px;">[지급일: ${d2}]</b>`;
                        }
                    }
                }

            } else {
                targetName = "";
                if (displaySlot) {
                    displaySlot.innerText = "대기 대상자 없음";
                    displaySlot.style.color = "#94A3B8";
                }
                if (step1Label) step1Label.innerText = "1차 일정 100% 이수 완료";
                if (step2Label) step2Label.innerText = "2차 일정 100% 최종 완료";
            }
        }

        // 최초 1회 즉시 스캔 가동 후 1초 자동 폴링 인터리브 가동
        syncTargetSession();
        setInterval(syncTargetSession, 1000);

        // 체크박스 제어용 비활성화 래퍼 유틸리티 보존
        function setBoxesDisabled(isD) {
            ['chk_step1', 'chk_step2', 'chk_first_fail', 'chk_self_out', 'chk_backup_out'].forEach(id => {
                if (document.getElementById(id)) document.getElementById(id).disabled = isD;
            });
        }

        // ❷ 원격 통과/반려 심사 패킷 단독 분사 처리기 (순정 참여상태 완벽 보존 격리 가드)
        function sendSignal(status) {
            syncTargetSession();

            if (!targetName || targetName === "") {
                return alert("알림: 현재 모바일 화면에서 본인인증서 로그인을 진행하여 대기 중인 대상자가 없습니다.");
            }

            const cleanTargetName = targetName.replace(/\s/g, "");
            let db = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

            let user = db.find(u => {
                const cleanDbName = (u.name || '').toString().replace(/\s/g, "");
                return cleanDbName === cleanTargetName;
            });

            if (user) {
                // 🔒 [순정 참여상태 철통 사수 및 행정 상태 코드 동치화]: 파일 일괄 등록 시스템 규격 반영
                if (status === 'PASS') {
                    user.status = "신검통과";
                    user.stage = "신검통과";
                } else if (status === 'FAIL') {
                    user.status = "신검탈락";
                    user.stage = "신검탈락";
                }

                user.payStatus = "대기"; // 정산 스코어보드 연동 레이어만 세팅
                localStorage.setItem('dataStoreApplicant', JSON.stringify(db));

                // 📱 모바일 화면 실시간 리스킨 피드백용 무선 심사 패킷만 순수 독립 사출
                localStorage.setItem('msg_push_signal', JSON.stringify({
                    name: user.name,
                    status: status, // 'PASS' / 'FAIL' 릴레이
                    time: Date.now()
                }));

                if (document.getElementById('ui_attendance_section')) {
                    document.getElementById('ui_attendance_section').style.display = (status === 'PASS') ? 'block' : 'none';
                }
                if (status === 'PASS') {
                    setBoxesDisabled(false);
                    switchUserType();
                }

                console.log(`[원격 관제탑] 무선 심사 완료 ➡️ 대상자: ${user.name} / 신호: ${status} (순정상태 [${user.stage}] 격리 보호완료)`);
                alert(`📱 원격 심사 신호 [${status === 'PASS' ? '통과 승인' : '탈락 반려'}] 패킷이 대상자 모바일 화면으로 실시간 사출되었습니다.`);

                syncTargetSession(); // 안테나 리렌더링 인터록 호출 동기화
            } else {
                console.log(`[전산 경고] 명단 매칭 거절: 현재 관제 대상자 명의(${targetName})가 dataStoreApplicant 마스터 대장에 존재하지 않습니다.`);
            }
        }

        // ❸ 2단계 체크박스 배타적 연산선 핸들러 [순정 흐름 100% 무결 보존]
        function handleRules(id) {
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2');
            let cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');

            if (!c1 || !c2 || !cF || !cB || !cS) return;

            if ((id === 'chk_first_fail' && cF.checked) || (id === 'chk_self_out' && cS.checked)) {
                c1.checked = false; c2.checked = false; cB.checked = false;
                if (id === 'chk_first_fail') cS.checked = false; else cF.checked = false;
            } else if (id === 'chk_backup_out' && cB.checked) {
                c1.checked = false; c2.checked = false; cF.checked = false; cS.checked = false;
            } else if (id === 'chk_step2' && c2.checked) {
                c1.checked = true; cF.checked = false; cB.checked = false; cS.checked = false;
            } else if (id === 'chk_step1' && !c1.checked) {
                c2.checked = false;
            }

            let anyChecked = c1.checked || c2.checked || cF.checked || cB.checked || cS.checked;

            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = !anyChecked;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = !anyChecked;
        }

        function switchUserType() {
            let isN = document.getElementById('r_normal').checked;
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2');
            let cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');

            if (!c1 || !c2 || !cF || !cB || !cS) return;

            c1.checked = c2.checked = cF.checked = cB.checked = cS.checked = false;
            c1.disabled = false; cF.disabled = !isN; cS.disabled = !isN; cB.disabled = isN; c2.disabled = true;

            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = true;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = true;
        }

        // ❹ 3단계: 가변 체크박스 선택 사항을 무선 패킷에 안착시켜 대상자 스마트 정산 양식 개방 처리 [index: 0.1.300]
        function toggleAuth(isAllow) {
            syncTargetSession(); // 송신 버튼 터치 시점 마스터 세션 명의 강제 동기화

            if (!targetName || targetName === "") {
                return alert("알림: 현재 권한을 개방할 활성화 대상자가 잡히지 않았습니다.");
            }

            const cleanTargetName = targetName.replace(/\s/g, "");
            let db = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

            let user = db.find(u => {
                const cleanDbName = (u.name || '').toString().replace(/\s/g, "");
                return cleanDbName === cleanTargetName;
            });

            if (user) {
                let code = 0;
                if (document.getElementById('chk_step2').checked) code = 2; // 2차 최종 완료 스펙
                else if (document.getElementById('chk_step1').checked) code = 1; // 1차 일정 완료 스펙
                else if (document.getElementById('chk_first_fail').checked) code = 3; // 소집일 탈락 스펙
                else if (document.getElementById('chk_backup_out').checked) code = 4; // 시험 예비자 귀가 스펙
                else if (document.getElementById('chk_self_out').checked) code = 5; // 중도 동의철회 자진귀가 스펙

                // 원자적 가상 DB 업데이트 동시 커밋 처리 결합
                if (isAllow) {
                    user.payStatus = "신청가능";
                } else {
                    user.payStatus = "대기";
                }
                localStorage.setItem('dataStoreApplicant', JSON.stringify(db));

                // ⚡ [최종 무결성 연동 패킷 완착]: 진짜 가변 차수별 날짜 데이터를 릴레이 패킷에 적재하여 사출 [index: 0.1.300]
                localStorage.setItem('msg_auth_signal', JSON.stringify({
                    name: user.name,
                    isAllow: isAllow,
                    stageCode: code, // 1~5번 실무 식별자 코드 바이패스
                    time: Date.now()
                }));

                // 🎯 [시각적 피드백 수혈]: 무선 개통 신호 개방 시 단추 디자인에 야광 펄스 테두리 동적 주입 및 리셋
                const btnAllow = document.getElementById('btn_allow');
                const btnBlock = document.getElementById('btn_block');
                if (btnAllow && btnBlock) {
                    if (isAllow) {
                        btnAllow.classList.add('adm-btn-pulse');
                        btnBlock.classList.remove('adm-btn-pulse');
                    } else {
                        btnBlock.classList.add('adm-btn-pulse');
                        btnAllow.classList.remove('adm-btn-pulse');
                    }
                }

                alert(isAllow ? "👍 선택하신 가변 차수별 참여비 청구서가 대상자 화면에 실시간 승인 개방되었습니다." : "🔒 참여비 청구 권한을 홀딩 잠금 처리했습니다.");
                console.log(`[원격 관제탑] 지급 권한 조율 완료 ➡️ 대상자명: ${user.name} / 식별코드: ${code} / 상태명세: ${user.payStatus}`);

                // 내장 동적 디스플레이 새로고침 인터록 구동
                if (typeof updateMobileStageUI === "function") {
                    updateMobileStageUI(user);
                }
            } else {
                alert("알림: 현재 심사 중인 대상자의 명의를 dataStoreApplicant 마스터 대장에서 찾을 수 없습니다.");
            }
        }

    </script>
</body>
