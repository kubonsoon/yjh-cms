<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일용 관리자 제어 화면</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #07132B;
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .panel-box {
            background-color: #112240;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #1E293B;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            color: #06B6D4;
            margin-bottom: 20px;
            border-bottom: 2px solid #1E293B;
            padding-bottom: 10px;
        }

        h3 {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13.5px;
            color: #E2E8F0;
            cursor: pointer;
        }

        .check-item input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0 20px 0;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #FFF;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-pass {
            background-color: #10B981;
        }

        .btn-pass:hover {
            background-color: #059669;
        }

        .btn-fail {
            background-color: #F43F5E;
        }

        .btn-fail:hover {
            background-color: #E11D48;
        }

        .btn-allow {
            background-color: #0284c7;
        }

        .btn-allow:hover {
            background-color: #0369a1;
        }

        .btn-block {
            background-color: #475569;
        }

        .btn-block:hover {
            background-color: #334155;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed !important;
        }
    </style>
</head>

<body>
    <div class="panel-box">
        <div class="panel-title">📱 실시간 심사 처리 </div>

        <h3>1단계: 기본 심사 처리 여부</h3>
        <div style="margin-bottom: 12px;">
            <label class="check-item" style="display:inline-flex; margin-right:15px;">
                <input type="radio" name="user_type" id="r_normal" checked onclick="switchUserType()">
                <span>정규 대상자</span></label>
            <label class="check-item" style="display:inline-flex;"><input type="radio" name="user_type" id="r_backup"
                    onclick="switchUserType()"> <span>시험 예비자</span></label>
        </div>
        <div class="btn-grid">
            <button onclick="sendSignal('PASS')" class="btn btn-pass">통과 처리</button>
            <button onclick="sendSignal('FAIL')" class="btn btn-fail">탈락 처리</button>
        </div>

        <div id="ui_attendance_section" style="display: none; border-top: 1px solid #1E293B; padding-top: 15px;">
            <h3>2단계: 참여완료 및 탈락 사유 체크</h3>
            <label class="check-item"><input type="checkbox" id="chk_step1" onclick="handleRules('chk_step1')"> <span>1차
                    일정 100% 이수 완료</span></label>
            <label class="check-item"><input type="checkbox" id="chk_step2" onclick="handleRules('chk_step2')"> <span>2차
                    일정 100% 최종 완료</span></label>
            <label class="check-item" style="color:#FFD700;"><input type="checkbox" id="chk_first_fail"
                    onclick="handleRules('chk_first_fail')"> <span>소집일(입원) 탈락</span> </label>
            <label class="check-item" style="color:#FB923C;"><input type="checkbox" id="chk_self_out"
                    onclick="handleRules('chk_self_out')"> <span>동의철회 (개인사정)</span> </label>
            <label class="check-item" style="color:#06B6D4;"><input type="checkbox" id="chk_backup_out"
                    onclick="handleRules('chk_backup_out')"> <span>시험 예비자 퇴원 귀가 </span></label>

            <h3 style="margin-top:15px;">3단계: 모바일 지급 신청 인가</h3>
            <div class="btn-grid" style="margin-bottom:0;">
                <button id="btn_allow" onclick="toggleAuth(true)" class="btn btn-allow" disabled>신청가능 개방</button>
                <button id="btn_block" onclick="toggleAuth(false)" class="btn btn-block" disabled>신청불가 차단</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🟢 [정밀 교정 완결]: 진재영 하드코딩 독점 버그를 철거하고, 무한 다중 유저 실시간 인터셉터 안테나 이식
        // =========================================================================
        let targetName = "";

        // 글로벌 공유 메모리 장치(localStorage)를 초당 상시 정밀 체킹하는 실시간 관제 리프레시 가드 (새로고침 먹통 방지)
        function syncTargetSession() {
            const globalActiveLoginPacket = JSON.parse(localStorage.getItem('loggedInUser'));
            const displaySlot = document.getElementById('ui_active_target_display');

            // 돔 내부에 실시간 날짜 가이드를 사출할 슬롯 가선 전산 확보
            const step1Label = document.querySelector("label[for='chk_step1'] span") || document.getElementById('chk_step1')?.nextElementSibling;
            const step2Label = document.querySelector("label[for='chk_step2'] span") || document.getElementById('chk_step2')?.nextElementSibling;

            if (globalActiveLoginPacket && globalActiveLoginPacket.name) {
                targetName = globalActiveLoginPacket.name.trim();
                if (displaySlot) {
                    displaySlot.innerText = `${targetName} 대상자 실시간 관제중`;
                    displaySlot.style.color = "#06B6D4";
                }

                /* =================================================================
                   ⚡ [신설]: 모집공고 마스터 대장 가변 차수별 지급일자 실시간 역추적 릴레이
                   ================================================================= */
                let applicantDB = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
                let recruitmentDB = JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];

                const userRec = applicantDB.find(u => (u.name || '').toString().replace(/\s/g, "") === targetName.replace(/\s/g, ""));

                if (userRec && userRec.title) {
                    const cleanAppTitle = userRec.title.toString().toLowerCase().replace(/[^a-zA-Z0-9가-힣]/g, "").trim();
                    const cleanAppTh = (userRec.th || "").replace(/[^0-9]/g, "");

                    // 대상자의 과제명과 기수가 100% 매칭되는 진짜 모집공고 원본 색인 [index: 0.1.122]
                    const matchedRec = recruitmentDB.find(r => {
                        const cleanRecTitle = (r.title || "").toString().toLowerCase().replace(/[^a-zA-Z0-9가-힣]/g, "").trim();
                        const cleanRecTh = (r.th || "").replace(/[^0-9]/g, "");
                        return cleanRecTitle === cleanAppTitle && cleanRecTh === cleanAppTh;
                    });

                    if (matchedRec) {
                        // 1기/2기 등 어떤 스펙이 들어오든 인라인 피커 날짜(payDate1~3)를 우선 상속 [index: 0.1.107, 0.1.122]
                        const d1 = matchedRec.payDate1 || matchedRec.recDate || "추후공지";
                        const d2 = matchedRec.payDate2 || "추후공지";

                        if (step1Label) step1Label.innerHTML = `1차 일정 이수 완료 <b style="color:#fbbf24; margin-left:4px;">[지급일: ${d1}]</b>`;
                        if (step2Label) step2Label.innerHTML = `2차 일정 최종 완료 <b style="color:#fbbf24; margin-left:4px;">[지급일: ${d2}]</b>`;
                    }
                }

            } else {
                targetName = "";
                if (displaySlot) {
                    displaySlot.innerText = "대기 대상자 없음";
                    displaySlot.style.color = "#94A3B8";
                }
                if (step1Label) step1Label.innerText = "1차 일정 100% 이수 완료";
                if (step2Label) step2Label.innerText = "2차 일정 100% 최종 완료";
            }
        }

        // 최초 1회 즉시 스캔 가동 후 1초 자동 폴링 인터리브 가동
        syncTargetSession();
        setInterval(syncTargetSession, 1000);

        function setBoxesDisabled(isD) {
            ['chk_step1', 'chk_step2', 'chk_first_fail', 'chk_self_out', 'chk_backup_out'].forEach(id => {
                if (document.getElementById(id)) document.getElementById(id).disabled = isD;
            });
        }

        // ❷ 원격 통과/반려 심사 패킷 단독 분사 처리기 (순정 참여상태 완벽 보존 격리 가드)
        function sendSignal(status) {
            syncTargetSession();

            if (!targetName || targetName === "") {
                return alert("알림: 현재 모바일 화면에서 본인인증서 로그인을 진행하여 대기 중인 대상자가 없습니다.");
            }

            const cleanTargetName = targetName.replace(/\s/g, "");
            let db = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

            let user = db.find(u => {
                const cleanDbName = (u.name || '').toString().replace(/\s/g, "");
                return cleanDbName === cleanTargetName;
            });

            if (user) {
                // 🔒 [순정 참여상태 철통 사수]: 대장의 진짜 상태값(user.stage)은 변조 없이 그대로 유지 보존합니다.
                user.payStatus = "대기"; // 정산 스코어보드 연동 레이어만 세팅
                localStorage.setItem('dataStoreApplicant', JSON.stringify(db));

                // 📱 모바일 화면 실시간 리스킨 피드백용 무선 심사 패킷만 순수 독립 사출
                localStorage.setItem('msg_push_signal', JSON.stringify({
                    name: user.name,
                    status: status, // 'PASS' / 'FAIL' 릴레이
                    time: Date.now()
                }));

                if (document.getElementById('ui_attendance_section')) {
                    document.getElementById('ui_attendance_section').style.display = (status === 'PASS') ? 'block' : 'none';
                }
                if (status === 'PASS') {
                    setBoxesDisabled(false);
                    switchUserType();
                }

                console.log(`[원격 관제탑] 무선 심사 완료 ➡️ 대상자: ${user.name} / 신호: ${status} (순정상태 [${user.stage}] 격리 보호완료)`);
                alert(`📱 원격 심사 신호 [${status === 'PASS' ? '통과 승인' : '탈락 반려'}] 패킷이 대상자 모바일 화면으로 실시간 사출되었습니다.`);
            } else {
                console.log(`[전산 경고] 명단 매칭 거절: 현재 관제 대상자 명의(${targetName})가 dataStoreApplicant 마스터 대장에 존재하지 않습니다.`);
            }
        }

        // ❸ 2단계 체크박스 배타적 연산선 핸들러
        function handleRules(id) {
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2');
            let cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');

            if (!c1 || !c2 || !cF || !cB || !cS) return;

            if ((id === 'chk_first_fail' && cF.checked) || (id === 'chk_self_out' && cS.checked)) {
                c1.checked = false; c2.checked = false; cB.checked = false;
                if (id === 'chk_first_fail') cS.checked = false; else cF.checked = false;
            } else if (id === 'chk_backup_out' && cB.checked) {
                c1.checked = false; c2.checked = false; cF.checked = false; cS.checked = false;
            } else if (id === 'chk_step2' && c2.checked) {
                c1.checked = true; cF.checked = false; cB.checked = false; cS.checked = false;
            } else if (id === 'chk_step1' && !c1.checked) {
                c2.checked = false;
            }

            let anyChecked = c1.checked || c2.checked || cF.checked || cB.checked || cS.checked;

            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = !anyChecked;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = !anyChecked;
        }

        function switchUserType() {
            let isN = document.getElementById('r_normal').checked;
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2');
            let cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');

            if (!c1 || !c2 || !cF || !cB || !cS) return;

            c1.checked = c2.checked = cF.checked = cB.checked = cS.checked = false;
            c1.disabled = false; cF.disabled = !isN; cS.disabled = !isN; cB.disabled = isN; c2.disabled = true;

            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = true;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = true;
        }

        // ❹ 3단계: 가변 체크박스 선택 사항을 무선 패킷에 안착시켜 대상자 스마트 정산 양식 개방 처리 [index: 0.1.300]
        function toggleAuth(isAllow) {
            syncTargetSession(); // 송신 버튼 터치 시점 마스터 세션 명의 강제 동기화

            if (!targetName || targetName === "") {
                return alert("알림: 현재 권한을 개방할 활성화 대상자가 잡히지 않았습니다.");
            }

            const cleanTargetName = targetName.replace(/\s/g, "");
            let db = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

            let user = db.find(u => {
                const cleanDbName = (u.name || '').toString().replace(/\s/g, "");
                return cleanDbName === cleanTargetName;
            });

            if (user) {
                let code = 0;
                if (document.getElementById('chk_step2').checked) code = 2; // 2차 최종 완료 스펙
                else if (document.getElementById('chk_step1').checked) code = 1; // 1차 일정 완료 스펙
                else if (document.getElementById('chk_first_fail').checked) code = 3; // 소집일 탈락 스펙
                else if (document.getElementById('chk_backup_out').checked) code = 4; // 시험 예비자 귀가 스펙
                else if (document.getElementById('chk_self_out').checked) code = 5; // 중도 동의철회 자진귀가 스펙

                // 원자적 가상 DB 업데이트 동시 커밋 처리 결합
                if (isAllow) {
                    user.payStatus = "신청가능";
                } else {
                    user.payStatus = "대기";
                }
                localStorage.setItem('dataStoreApplicant', JSON.stringify(db));

                // ⚡ [최종 무결성 연동 패킷 완착]: 진짜 가변 차수별 날짜 데이터를 릴레이 패킷에 적재하여 사출 [index: 0.1.300]
                localStorage.setItem('msg_auth_signal', JSON.stringify({
                    name: user.name,
                    isAllow: isAllow,
                    stageCode: code, // 1~5번 실무 식별자 코드 바이패스
                    time: Date.now()
                }));

                alert(isAllow ? "👍 선택하신 가변 차수별 참여비 청구서가 대상자 화면에 실시간 승인 개방되었습니다." : "🔒 참여비 청구 권한을 홀딩 잠금 처리했습니다.");
                console.log(`[원격 관제탑] 지급 권한 조율 완료 ➡️ 대상자명: ${user.name} / 식별코드: ${code} / 상태명세: ${user.payStatus}`);
            } else {
                alert("알림: 현재 심사 중인 대상자의 명의를 dataStoreApplicant 마스터 대장에서 찾을 수 없습니다.");
            }
        }

        function handleRules(id) {
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2'), cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');
            if ((id === 'chk_first_fail' && cF.checked) || (id === 'chk_self_out' && cS.checked)) {
                c1.checked = false; c2.checked = false; cB.checked = false;
                if (id === 'chk_first_fail') cS.checked = false; else cF.checked = false;
            } else if (id === 'chk_backup_out' && cB.checked) {
                c1.checked = false; c2.checked = false; cF.checked = false; cS.checked = false;
            } else if (id === 'chk_step2' && c2.checked) {
                c1.checked = true; cF.checked = false; cB.checked = false; cS.checked = false;
            } else if (id === 'chk_step1' && !c1.checked) { c2.checked = false; }

            let anyChecked = c1.checked || c2.checked || cF.checked || cB.checked || cS.checked;

            // 버튼 탐색 규격 하이픈 오타 전수 청소 통합 종결 완료
            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = !anyChecked;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = !anyChecked;
        }

        function switchUserType() {
            let isN = document.getElementById('r_normal').checked;
            let c1 = document.getElementById('chk_step1'), c2 = document.getElementById('chk_step2'), cF = document.getElementById('chk_first_fail'), cB = document.getElementById('chk_backup_out'), cS = document.getElementById('chk_self_out');
            c1.checked = c2.checked = cF.checked = cB.checked = cS.checked = false;
            c1.disabled = false; cF.disabled = !isN; cS.disabled = !isN; cB.disabled = isN; c2.disabled = true;
            if (document.getElementById('btn_allow')) document.getElementById('btn_allow').disabled = true;
            if (document.getElementById('btn_block')) document.getElementById('btn_block').disabled = true;
        }

        function toggleAuth(isAllow) {
            syncTargetSession(); // 송신 버튼 터치 시점 0초 타이밍 마스터 세션 성명 강제 리프레시

            if (!targetName || targetName === "") {
                return alert("알림: 현재 권한을 개방할 활성화 대상자가 잡히지 않았습니다.");
            }

            const cleanTargetName = targetName.replace(/\s/g, "");
            let db = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

            let user = db.find(u => {
                const cleanDbName = (u.name || '').toString().replace(/\s/g, "");
                return cleanDbName === cleanTargetName;
            });

            if (user) {
                let code = 0;
                if (document.getElementById('chk_step2').checked) code = 2;
                else if (document.getElementById('chk_step1').checked) code = 1;
                else if (document.getElementById('chk_first_fail').checked) code = 3;
                else if (document.getElementById('chk_backup_out').checked) code = 4;
                else if (document.getElementById('chk_self_out').checked) code = 5;

                // 원자적 가상 DB 업데이트 동시 커밋 처리 결합
                if (isAllow) {
                    user.payStatus = "신청가능";
                } else {
                    user.payStatus = "대기";
                }
                localStorage.setItem('dataStoreApplicant', JSON.stringify(db));

                // 소독 완료된 리얼 로그인 유저 대상 무선 인가 신호 패킷 사출
                localStorage.setItem('msg_auth_signal', JSON.stringify({
                    name: user.name,
                    isAllow: isAllow,
                    stageCode: code,
                    time: Date.now()
                }));

                alert(isAllow ? "👍 대상자 화면에 참여비 청구서가 실시간 승인 개방되었습니다." : "🔒 참여비 청구 권한을 홀딩 잠금 처리했습니다.");
                console.log(`[원격 관제탑] 지급 권한 개방 종결 ➡️ 대상자명: ${user.name} / 상태명세: ${user.payStatus}`);
            } else {
                alert("알림: 현재 심사 중인 대상자의 명의를 dataStoreApplicant 마스터 대장에서 찾을 수 없습니다.");
            }
        }
    </script>
</body>

</html>
