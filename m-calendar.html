<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ===== 1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인 ===== */
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        html,
        body {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            letter-spacing: -0.3px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px 10px !important;
            display: flex;
            flex-direction: column;
        }

        /* ===== 2. 상단 타이틀 및 모바일 최적화 툴바 구역 ===== */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .calendar-title {
            font-size: 16px !important;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            text-align: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px !important;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #0b0f19;
            border-color: var(--secondary-color);
        }

        /* ===== 3. 단일행 주간(7일) 타임라인 바 시스템 ===== */
        .weekly-timeline-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .weekly-day-btn {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .weekly-day-btn .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .weekly-day-btn .day-date {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 터치되어 선택된 요일 활성화 스타일 */
        .weekly-day-btn.active {
            background: rgba(14, 165, 233, 0.15) !important;
            border-color: var(--secondary-color) !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .weekly-day-btn.active .day-name,
        .weekly-day-btn.active .day-date {
            color: var(--secondary-color) !important;
        }

        /* [요구사항 반영] 실시간 오늘 날짜 단추용 독자적 푸른 테두리 스킨 */
        .weekly-day-btn.today-border {
            border: 1.5px solid var(--secondary-color) !important;
            box-shadow: inset 0 0 4px rgba(14, 165, 233, 0.4);
        }

        .weekly-day-btn:nth-child(1) .day-date {
            color: #f87171;
        }

        .weekly-day-btn:nth-child(7) .day-date {
            color: #60a5fa;
        }

        /* ===== 4. 당일 세로 스크롤 카드 레일 존 ===== */
        .daily-card-scroll-zone {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .trial-manifest-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px 1px rgba(0, 0, 0, 0.3);
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .card-title-text {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
            flex: 1;
            padding-right: 8px;
        }

        .card-th-badge {
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .th-color-1기 {
            background: rgba(148, 163, 184, 0.12) !important;
            border: 1px solid #94a3b8 !important;
            color: #f8fafc !important;
        }

        .th-color-2기 {
            background: rgba(14, 165, 233, 0.15) !important;
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
        }

        .th-color-3기 {
            background: rgba(74, 222, 128, 0.15) !important;
            border: 1px solid #22c55e !important;
            color: #4ade80 !important;
        }

        .th-color-4기 {
            background: rgba(245, 158, 11, 0.15) !important;
            border: 1px solid #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* [요구사항 반영] 공백 카드 상자 내부 성별 전용 고대비 핑크 라운드 배지 스킨 */
        .gender-badge-pink {
            background: rgba(244, 114, 182, 0.15) !important;
            border: 1px solid #f472b6 !important;
            color: #f472b6 !important;
            font-size: 11px !important;
            padding: 2px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .card-meta-grid span {
            color: #e2e8f0;
            font-weight: 600;
        }

        .card-action-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .card-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .card-btn.join {
            background: var(--success-color);
            color: #070a12;
        }

        .card-btn.reject {
            background: var(--danger-color);
            color: #ffffff;
        }

        .card-btn.close {
            background: #334155;
            color: #ffffff;
        }

        /* ===== 5. 하단 고정 가이드라인 패널 스킨 ===== */
        .bottom-guide-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            height: 95px;
            flex-shrink: 0;
        }

        .white-dictionary-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .notice-list-wrapper {
            font-size: 10px !important;
            color: var(--text-muted);
            line-height: 1.3;
            padding-left: 12px;
        }

        /* ===== 6. 모바일 대상자 마스터 누적 이력조회 대형 모달 ===== */
        .calendar-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .calendar-modal-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 94%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-history-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--warning-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-history-scroll-zone {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-mini-card {
            background: #161e30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .history-mini-card.current-job {
            border-left-color: var(--secondary-color);
            background: rgba(14, 165, 233, 0.04);
        }

        .daily-card-scroll-zone::-webkit-scrollbar,
        .modal-history-scroll-zone::-webkit-scrollbar {
            width: 3px;
        }

        .daily-card-scroll-zone::-webkit-scrollbar-thumb,
        .modal-history-scroll-zone::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        .modal-btn-group-row {
            display: flex !important;
            width: 100% !important;
            margin-top: 14px !important;
            gap: 8px !important;
            box-sizing: border-box !important;
        }

        .modal-act-btn {
            width: 100% !important;
            padding: 12px 10px !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            text-align: center !important;
            cursor: pointer !important;
            transition: background 0.15s ease;
        }

        .modal-act-btn.btn-close {
            background: #334155 !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }

        .modal-act-btn.btn-close:active {
            background: #1e293b !important;
        }

        /* [유지 보존 확인 완료] 연월 가이드 바 컨트롤러 모바일 플렉스 정품 고정 스킨 */
        .month-controller {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px !important;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .month-btn {
            background: none !important;
            border: none !important;
            color: var(--secondary-color) !important;
            font-size: 15px !important;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 8px !important;
            transition: transform 0.1s ease;
        }

        .month-btn:active {
            transform: scale(0.85);
        }

        .month-label {
            font-size: 14px !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }

        .mobile-future-lock {
            opacity: 0.55;
            filter: grayscale(0.4);
        }

        /* 2. 오늘(Today) 날짜 셀 최상위 고대비 야광 네온 푸른 테두리 스킨 정밀 보정 */
        .day-cell-box.today-neon-marker {
            border: 3px solid #00F0FF !important;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.35), 0 0 18px rgba(0, 240, 255, 0.75) !important;
            background: linear-gradient(180deg, #1f2937 0%, #081d35 100%) !important;
            z-index: 10 !important;
        }

        .day-cell-box.today-neon-marker .day-num {
            color: #00F0FF !important;
            font-weight: 900 !important;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8) !important;
        }

        /* 대상자 목록의 이력 스킨과 동일한 시인성을 확보하기 위한 warning 계열 색상 바인딩 */
        .card-btn.history-sync {
            background: var(--warning-color) !important;
            color: #0b0f19 !important;
        }

        .card-btn.history-sync:active {
            background: #0e66e9 !important;
        }
    </style>

</head>

<body>
    <!-- 1. 상단 모바일 기수 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">
            <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄(주간)
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()">
                <i class="fa-solid fa-file-arrow-down"></i> 시험현황
            </button>
            <button type="button" class="tool-btn" onclick="window.print()">
                <i class="fa-solid fa-print"></i> 인쇄/PDF저장
            </button>
        </div>
    </div>

    <!-- 2. 월 및 연도 가이드 바 컨트롤러 (모바일 양 끝단 배치 구조 및 원본 문자 100% 사수) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. [대개혁 핵심] 상단 1행 고정형 주간(7일) 단일 날짜 선택 타임라인 레일 바 -->
    <!-- 자바스크립트 엔진에 의해 일요일부터 토요일까지 7일간의 날짜 조각이 주입됩니다 -->
    <div class="weekly-timeline-bar" id="weeklyTimelineBoard"></div>

    <!-- 4. [대개혁 핵심] 하루 최대 5개 이상의 복잡 과제가 겹쳐도 완벽히 분사하는 세로 스크롤 카드 레일 랙 -->
    <!-- 상단 주간 바에서 선택한 날짜와 실시간 매칭되는 당일 시험 공고 카드들이 세로로 대형 사출됩니다 -->
    <div class="daily-card-scroll-zone" id="dailyCardBoard"></div>

    <!-- 5. 하단 고정 가이드라인 패널 (모바일 10px 슬림 가이드 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 주간 모바일 안내 센터
        </div>
        <ol class="notice-list-wrapper">
            <li>상단 7일 주간 바에서 날짜를 선택하시면 당일 진행 과제 카드가 아래에 정밀 정렬됩니다.</li>
            <li>[과거 참여 이력] 배지 선택 시 대상자의 참여 마스터 누적 내역이 실시간 자동 추적 사출됩니다.</li>
        </ol>
    </div>

    <!-- 6. [대수술 완수] 과거 참여 이력조회 대형 누적 모달 프레임 구역 (✕ 문자 보존) -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-clock-history"></i> 대상자 마스터 참여 이력 관제탑
                </div>
                <button type="button" class="modal-close-x"
                    onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-folder-tree"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트 팩토리에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 단독 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경 최적화 닫기 단추 레일 -->
            <div class="modal-btn-group-row" style="grid-template-columns: 1fr;">
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()"
                    style="background: #334155; color: #ffffff; width: 100%;">이력 화면 닫기</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 1. 달력 주간 변수 및 선택 날짜 정밀 추적 포인터 =====
        let currentDate = new Date();
        if (currentDate.getFullYear() < 2026) { currentDate = new Date("2026-12-04"); }

        // [테두리 보존 락인] 실시간 현재 진짜 오늘 날짜 고정 문자열 추출
        const sysTodayObj = new Date();
        const sysTodayStr = `${sysTodayObj.getFullYear()}-${String(sysTodayObj.getMonth() + 1).padStart(2, '0')}-${String(sysTodayObj.getDate()).padStart(2, '0')}`;

        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');
        let selectedDateStr = `${yyyy}-${mm}-${dd}`;
        let currentFilter = 'ALL';

        // [가변 유저 보안 인터록] 부모 창 진짜 실시간 로그인 데이터 패킷 무지연 가로채기
        let currentCertifiedUser = sessionStorage.getItem('certifiedUserName') || localStorage.getItem('certifiedUserName') || "";
        let cachedLogUserStr = localStorage.getItem('loggedInUser');

        if (cachedLogUserStr) {
            try {
                let parsedLogUser = JSON.parse(cachedLogUserStr);
                if (parsedLogUser && parsedLogUser.name) {
                    currentCertifiedUser = parsedLogUser.name.toString().trim();
                    sessionStorage.setItem('certifiedUserName', currentCertifiedUser);
                }
            } catch (e) { console.error("[전산 오류] 로그인 캐시 복합 파싱 실패:", e); }
        }

        // 만약 백업 세션까지 부재 시 안전가드로 폴백 바인딩
        if (!currentCertifiedUser) {
            currentCertifiedUser = "홍길동";
            sessionStorage.setItem('certifiedUserName', "홍길동");
        }

        function getMasterData() { return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || []; }
        function getApplicantData() { return JSON.parse(localStorage.getItem('dataStoreApplicant')) || []; }
        function moveMonth(v) { currentDate.setDate(currentDate.getDate() + (v * 7)); renderCalendar(); }

        // [시험현황] 부모창 연동 엔진
        function executeDownload() {
            console.log("[원격 인터록 작동] 나의 시험현황 화면으로 강제 이송 패킷 발행.");
            if (window.parent) {
                window.parent.postMessage({ action: "GOTO_STEP_4", timestamp: Date.now() }, "*");
            } else if (window.opener && !window.opener.closed) {
                if (typeof window.opener.navigateToStep === "function") window.opener.navigateToStep(4);
            }
        }

        let currentActiveModalJob = null;
        let currentTemporaryUid = "";
        window.currentWeeklyDateKeys = [];

        function calculateSubtractedDate(baseStr, minusDays) {
            if (!baseStr || baseStr.includes("추후")) return null;
            const dObj = new Date(baseStr.trim());
            if (isNaN(dObj.getTime())) return null;
            dObj.setDate(dObj.getDate() - minusDays);
            return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
        }

        // ==========================================================================
        // [진짜 문제 완치] 날짜 비교 포맷 하이픈 통일 및 3대 버튼 카드 팩토리 활성화
        // ==========================================================================
        function renderCalendar() {
            const timelineBoard = document.getElementById('weeklyTimelineBoard');
            const label = document.getElementById('currentMonthLabel');
            if (!timelineBoard) return; timelineBoard.innerHTML = '';
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            if (label) label.innerText = `${currentYear}년 ${(currentMonth + 1).toString().padStart(2, '0')}월`;

            const currentDayOfWeek = currentDate.getDay();
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDayOfWeek);
            const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
            window.currentWeeklyDateKeys = [];

            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(startOfWeek);
                loopDate.setDate(startOfWeek.getDate() + i);

                const yyyyStr = loopDate.getFullYear();
                const mmStr = String(loopDate.getMonth() + 1).padStart(2, '0');
                const ddStr = String(loopDate.getDate()).padStart(2, '0');
                const formattedDateKey = `${yyyyStr}-${mmStr}-${ddStr}`;

                window.currentWeeklyDateKeys.push(formattedDateKey);
                if (!selectedDateStr && i === currentDayOfWeek) { selectedDateStr = formattedDateKey; }

                const dayBtn = document.createElement('div');
                let todayClass = (formattedDateKey === sysTodayStr) ? " today-border today-neon-marker" : "";
                dayBtn.className = `weekly-day-btn ${selectedDateStr === formattedDateKey ? 'active' : ''}${todayClass}`;

                dayBtn.innerHTML = `<div class="day-name">${dayNamesShort[i]}</div><div class="day-date">${loopDate.getDate()}</div>`;
                dayBtn.onclick = function () {
                    window.isDayButtonClicked = true; // 💡 개별 날짜 클릭 행위 인식 스위치 ON!
                    selectedDateStr = formattedDateKey;
                    document.querySelectorAll('.weekly-day-btn').forEach(btn => { btn.classList.remove('active'); });
                    dayBtn.classList.add('active');
                    renderDailyCards();
                };
                timelineBoard.appendChild(dayBtn);
            }
            renderDailyCards();
        }

        function renderDailyCards() {
            const cardBoard = document.getElementById('dailyCardBoard');
            if (!cardBoard) return;

            // 💡 [버그 완치]: 화살표 이동 및 날짜 변경 시 기존 일정이 유령처럼 남지 않도록 무조건 청소 후 시작
            cardBoard.innerHTML = '';

            const records = getMasterData();
            let applicantDB = getApplicantData() || [];

            // 💡 [원격 주파수 래핑]: 부모창 및 세션 대장에서 실시간 로그인한 진짜 대상자 성명 취득
            const liveCertifiedName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || currentCertifiedUser;
            const cleanSessionName = liveCertifiedName.replace(/\s/g, "");

            // 💡 [주민번호 세션 가로채기]: 첫 로드 시 홍길동 백업으로 퉁겨나가는 현상 원천 차단
            const targetSsn = localStorage.getItem('loggedInUserSsn') || sessionStorage.getItem('loggedInUserSsn') || "851023-2";
            const cleanSsn = targetSsn.replace(/[^0-9]/g, "");
            const displayBirth6 = cleanSsn.substring(0, 6) || "851023";

            let genderText = "여", genderClass = "gender-indicator-badge gender-f";
            if (cleanSsn.endsWith("1") || cleanSsn.endsWith("3") || cleanSsn.includes("M") || cleanSsn.endsWith("M") || cleanSsn.charAt(6) === "1" || cleanSsn.charAt(6) === "3") {
                genderText = "남";
                genderClass = "gender-indicator-badge gender-m";
            }

            // 대장 배열을 최신등록 역순으로 뒤집어 동명이인 및 타인 시험 교차 오염 원천 봉쇄
            const myLiveJobRecord = [...applicantDB].reverse().find(app => {
                if (!app || !app.name) return false;
                const cleanDbName = app.name.toString().replace(/\s/g, "");
                const currentLiveStatus = (app.status || app.stage || "").toString().trim();
                return cleanDbName === cleanSessionName && currentLiveStatus !== "" && !["종료", "탈락", "심사탈락"].includes(currentLiveStatus);
            });

            // 첫 로드 및 주간 이동 시 프로필 고정
            const pIframe = window.parent ? window.parent.document : null;
            if (pIframe) {
                const lockProfileSlot = pIframe.getElementById('lblSetTargetNew') || document.getElementById('lblSetTargetNew');
                if (lockProfileSlot) {
                    lockProfileSlot.innerHTML = `
                <span style="color:#ffffff; font-weight:800;">👤 ${liveCertifiedName}</span>
                <span style="color:rgba(255,255,255,0.4); font-weight:500; margin-left:2px;">(${displayBirth6})</span>
                <span class="${genderClass}" style="margin-left:5px; padding:1px 5px; border-radius:4px; font-size:11px; font-weight:800; display:inline-block; line-height:1.3;">${genderText}</span>
            `;
                }
            }

            if (!myLiveJobRecord) {
                cardBoard.innerHTML = `
            <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 12px;">
                <div style="margin-bottom: 8px; font-size: 13px;">
                    <span style="color:#ffffff; font-weight:800;">👤 ${liveCertifiedName}</span>
                    <span style="color:rgba(255,255,255,0.4); font-weight:500; margin-left:2px;">(${displayBirth6})</span>
                    <span class="${genderClass}" style="margin-left:5px; padding:1px 5px; border-radius:4px; font-size:11px; font-weight:800; display:inline-block; line-height:1.3;">${genderText}</span>
                </div>
                <div style="color:var(--text-muted); text-align:center; padding:15px 10px; font-size: 13px; font-weight: 500;">
                    선택하신 날짜에는 등록된 임상시험 일정이 없습니다.
                </div>
            </div>
        `;
                return;
            }

            // 2. 마스터 공고 원장을 순회하며 로그인 대상자의 연계 과제 타이틀을 필터링 및 동적 계산 조인
            let hasWeeklyScheduleInThisWindow = false; // 현재 주간 바 영역 내에 매칭되는 일정이 존재하는지 체크하는 감시 안테나
            let currentWeeklyAllBriefingHtml = ""; // 이번주 전체 일정 일괄 브리핑 묶음판
            let currentRecruitmentItem = null;

            const targetRecords = records.filter(item => {
                if (!item.title) return false;
                const cleanMyTitle = myLiveJobRecord.title.toString().replace(/\s/g, "").toLowerCase();
                const cleanItemTitle = item.title.toString().replace(/\s/g, "").toLowerCase();
                if (cleanMyTitle !== "신규방문과제미배정" && cleanMyTitle !== cleanItemTitle) return false;

                currentRecruitmentItem = item;

                // 🎯 [정밀 교정 완료]: 지급일 차감 수식 대신, 대장의 정품 실제 방문일 변수를 1:1 다이렉트 매핑
                let itemScheduleMap = {};
                if (item.examSchedule) itemScheduleMap[item.examSchedule.trim()] = "스크리닝 방문";
                if (item.recDate) itemScheduleMap[item.recDate.trim()] = "소집 방문 (임상시험 시작)";
                if (item.visitDate1) itemScheduleMap[item.visitDate1.trim()] = "1차 방문채혈";
                if (item.visitDate2) itemScheduleMap[item.visitDate2.trim()] = "2차 방문채혈";
                if (item.visitDate3) itemScheduleMap[item.visitDate3.trim()] = "3차 방문채혈";
                if (item.visitDate4) itemScheduleMap[item.visitDate4.trim()] = "4차 방문채혈";
                if (item.endExamDate) itemScheduleMap[item.endExamDate.trim()] = "종료검사";

                // 🎯 [기획안 2번 완착 - 주간 바 전수 검사]: 현재 켜져 있는 주간 바(7일) 영역 내에 내 일정이 걸쳐 있는지 스캔
                const weeklyKeys = window.currentWeeklyDateKeys || [];
                let briefingLines = [];

                // 내 전체 7대 일정 캘린더 맵을 순회하며 이번 주간 바 날짜들과 교차 매칭 검문
                for (const [dateKey, stageName] of Object.entries(itemScheduleMap)) {
                    if (weeklyKeys.includes(dateKey)) {
                        hasWeeklyScheduleInThisWindow = true; // 이번 주간 바에 내 임상 일정이 걸쳐 있음 포착
                    }

                    // 7대 마스터 족보 전체 리스트를 기획 서식(• yyyy년 mm월 dd일 (요일) : 차수명)으로 빌드업
                    const dayObj = new Date(dateKey);
                    if (!isNaN(dayObj.getTime())) {
                        const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
                        const formattedDateString = `${dayObj.getFullYear()}년 ${String(dayObj.getMonth() + 1).padStart(2, '0')}월 ${String(dayObj.getDate()).padStart(2, '0')}일 (${dayNamesShort[dayObj.getDay()]})`;

                        let displayStageName = stageName;
                        if (stageName.includes("스크리닝 방문")) displayStageName = "스크리닝";
                        else if (stageName.includes("소집 방문")) displayStageName = "소집(입원)";

                        briefingLines.push(`• ${formattedDateString} : ${displayStageName}`);
                    }
                }

                // 날짜 순서대로 이탈 없이 정렬한 뒤 줄바꿈 태그(<br>) 파이프라인으로 최종 바인딩
                currentWeeklyAllBriefingHtml = briefingLines.join('<br>');

                // 🎯 [버그 원천 완치]: 선택 날짜 불일치 시 공고 데이터 자체를 날려버리던 하단 차단막을 전면 파쇄하고,
                // 과제 매칭이 완료된 순정 공고 객체는 무조건 유지하여 전체 마일스톤이 정상 렌더링되도록 보장합니다.
                return true;
            });


            // 🎯 [구조적 결함 완치]: 실제 오늘 날짜에 사출된 카드가 있는지 체크하는 감시 카운터 장착
            let renderedCardCount = 0;

            // 3. 필터링 동치 정착이 완료된 임상 과제를 기반으로 화면에 3대 액션 명세 카드 랙 사출 드로잉 [순정 수호]
            targetRecords.forEach(item => {
                const thText = (item.th || "2기").trim();
                const clickUid = item.uid ? item.uid : item.title;
                const dynamicColorClass = `th-color-${thText}`;

                // 1. 공고 원고 내부의 7대 정품 변수와 라벨 문자열 딕셔너리 조립
                const originalMilestones = [
                    { dateStr: item.examSchedule, label: "스크리닝 방문" },
                    { dateStr: item.recDate, label: "소집(입원)" },
                    { dateStr: item.visitDate1, label: "1차 방문채혈" },
                    { dateStr: item.visitDate2, label: "2차 방문채혈" },
                    { dateStr: item.visitDate3, label: "3차 방문채혈" },
                    { dateStr: item.visitDate4, label: "4차 방문채혈" },
                    { dateStr: item.endExamDate, label: "종료검사" }
                ];

                // 2. 가공 배열 대신 정품 마일스톤 배열을 순회하며 selectedDateStr과 일치성 대조
                originalMilestones.forEach((schedule, idx) => {
                    if (!schedule.dateStr || schedule.dateStr.trim() === "" || schedule.dateStr === "미정") {
                        return;
                    }

                    // 날짜 하이픈 기호 포맷 소독 정제
                    const cleanMilestoneDate = schedule.dateStr.trim().replace(/[^0-9-]/g, "");

                    // 💡 [핵심 정밀 타격]: 선택된 날짜와 원장 날짜가 일치하지 않으면 사출을 완벽 봉쇄 차단
                    if (cleanMilestoneDate !== selectedDateStr) {
                        return;
                    }

                    // 날짜 매칭에 성공했으므로 사출 카운터 가산
                    renderedCardCount++;

                    const currentStageText = schedule.label;
                    const uniqueSubKey = `${clickUid}_${idx}`;
                    const card = document.createElement('div');
                    card.className = 'trial-manifest-card';
                    card.setAttribute("style", "margin-bottom: 10px; border: 1px solid var(--border-color); background: #111827; padding: 14px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);");

                    card.innerHTML = `
<div class="card-top-row">
<div class="card-title-text" style="color: #ffffff; font-weight: 800; font-size: 14.5px;">${currentStageText}</div>
</div>
<div class="card-meta-grid" style="margin-top:6px;">
<div>연계 과제: <span style="color: #38bdf8; font-weight: 700;">${item.title || '임상 과제명 미지정'}</span></div>
<div>배정 정원: <span>${item.count ? item.count + '명' : ''}</span></div>
<div>임상 기간: <span>${item.period ? item.period + '시간' : ''}</span></div>
</div>
<div class="card-action-bar" id="ui_action_bar_${uniqueSubKey}" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px;">
<button type="button" class="card-btn join" id="btn_card_join_${uniqueSubKey}" style="height:32px; font-size: 12.5px;">참여</button>
<button type="button" class="card-btn reject" id="btn_card_reject_${uniqueSubKey}" style="height:32px; font-size:12.5px; background:#475569;">미참여</button>
<button type="button" class="card-btn history-sync" id="btn_card_hist_${uniqueSubKey}" style="height:32px; font-size:12.5px;"><i class="fa-solid fa-clock-history"></i> 이력조회</button>
</div>
`;

                    const liveStatusText = myLiveJobRecord.status || myLiveJobRecord.stage || "신검대기";
                    if (liveStatusText === "신검대기" || liveStatusText === "신검통과") {
                        if (!currentStageText.includes("스크리닝")) {
                            card.classList.add('mobile-future-lock');
                        }
                    }

                    cardBoard.appendChild(card);
                }); // 💡 [정밀 수리 완료] originalMilestones.forEach 반복문이 여기서 정확하게 안전 종료됩니다.

                // ===== [순정 정품 4대 행정 안전 가드 신청 파이프라인 원형 보존 적재] =====
                const btnJoin = document.getElementById(`btn_card_join_${uniqueSubKey}`);
                if (btnJoin) {
                    btnJoin.onclick = function (e) {
                        e.preventDefault();
                        let appDB = getApplicantData();
                        const activeJobRecord = appDB.find(app => {
                            const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                            const dbTitle = (app.title || '').toString().trim();
                            return cleanDbName === cleanSessionName && app.stage !== "종료" && dbTitle !== "신규 방문 과제 미배정";
                        });

                        if (activeJobRecord && !myLiveJobRecord) {
                            alert("중복 신청 불가 안내\n\n대상자님은 현재 참여 중이거나 전산심사 대기 중인 임상시험 과제가 존재합니다.");
                            return;
                        }

                        const finishedJobs = appDB.filter(app => {
                            const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                            return cleanDbName === cleanSessionName && app.stage === "종료" && app.recDate;
                        });

                        if (finishedJobs.length > 0 && !myLiveJobRecord) {
                            finishedJobs.sort((a, b) => new Date(b.recDate) - new Date(a.recDate));
                            const lastFinishedJob = finishedJobs[0]; // 안전한 단일 객체 참조 보정
                            const systemCurrentTime = new Date();
                            const lastExamDate = new Date(lastFinishedJob.recDate);
                            const dayDiff = Math.floor((systemCurrentTime.getTime() - lastExamDate.getTime()) / (1000 * 60 * 60 * 24));

                            if (dayDiff < 180) {
                                alert("전산망 보안 안내\n\n대상자님은 마지막 시험 참여 후 아직 6개월이 경과하지 않았습니다.");
                                return;
                            }
                        }

                        const isAlreadyClickedThisJob = appDB.some(app => (app.name || '').toString().trim() === (myLiveJobRecord ? myLiveJobRecord.name : currentCertifiedUser) && (app.title || '').toString().trim() === (item.title || '').toString().trim() && (app.th || '').toString().trim() === thText);
                        let targetIdx = appDB.findIndex(u => (u.name || '').toString().trim().replace(/\s/g, "") === cleanSessionName);

                        if (targetIdx !== -1 && isAlreadyClickedThisJob) {
                            let cleanFriendlyStage = "소집";
                            if (currentStageText.includes("1차")) cleanFriendlyStage = "1차방문";
                            else if (currentStageText.includes("2차")) cleanFriendlyStage = "2차방문";
                            else if (currentStageText.includes("3차")) cleanFriendlyStage = "3차방문";
                            else if (currentStageText.includes("4차")) cleanFriendlyStage = "4차방문";
                            else if (currentStageText.includes("종료검사") || currentStageText.includes("종료")) cleanFriendlyStage = "종료방문";

                            appDB[targetIdx].status = cleanFriendlyStage;
                            appDB[targetIdx].stage = cleanFriendlyStage;
                            localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                            alert(`인증 성공\n\n대상자님의 참여 상태가 출석 [${appDB[targetIdx].status}] 단계로 정상 전진 업데이트 커밋되었습니다.`);

                            if (window.opener && !window.opener.closed && typeof window.opener.refreshApplicantView === "function") { window.opener.refreshApplicantView(); }
                            renderCalendar();
                            return;
                        }

                        let targetIdxNew = appDB.findIndex(u => (u.name || '').toString().trim().replace(/\s/g, "") === cleanSessionName && (u.title || '').toString().trim() === "신규 방문 과제 미배정");
                        const liveQuotaCount = appDB.filter(u => (u.title || '').toString().replace(/\s/g, "") === item.title.toString().replace(/\s/g, "") && (u.th || '').toString().replace(/\s/g, "") === thText.toString().replace(/\s/g, "")).length;

                        const nextLineNumber = liveQuotaCount + 1;
                        const liveProgressFormat = nextLineNumber + "/60";
                        const newApplicantRecord = {
                            uid: (targetIdxNew !== -1 ? appDB[targetIdxNew].uid : ("NEW_" + Date.now() + "_" + Math.floor(Math.random() * 1000))),
                            name: localStorage.getItem('certifiedUserName') || currentCertifiedUser, title: item.title, th: thText, count: liveProgressFormat, nCount: 60, period: item.period || "0",
                            ssn: activeJobRecord && activeJobRecord.ssn ? activeJobRecord.ssn : "050607-2",
                            phone: activeJobRecord && activeJobRecord.phone ? activeJobRecord.phone : "010-0000-0000",
                            gender: myLiveJobRecord.gender || "여", payStatus1: "대기", payStatus2: "대기", payStatus3: "대기", payStatus4: "대기",
                            result: "대기", isDutyAgreed: "대기", isCallAgreed: "대기", category: "M인증", stage: "신검대기", regDate: new Date().toISOString().split('T')
                        };

                        if (targetIdxNew !== -1) { appDB[targetIdxNew] = Object.assign({}, appDB[targetIdxNew], newApplicantRecord); }
                        else if (targetIdx !== -1) { appDB[targetIdx] = Object.assign({}, appDB[targetIdx], newApplicantRecord); }
                        else { appDB.push(newApplicantRecord); }

                        localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                        alert(`[신청 접수 완료]\n\n${localStorage.getItem('certifiedUserName') || currentCertifiedUser} 대상자님, 선택하신 임상시험 [${item.title}] 과제 참여 신청이 정상 접수되었습니다.`);
                        renderDailyCards();
                    };
                }

                if (document.getElementById(`btn_card_reject_${uniqueSubKey}`)) { document.getElementById(`btn_card_reject_${uniqueSubKey}`).onclick = function (e) { e.preventDefault(); alert('미참여 신청 되었습니다.'); }; }
                if (document.getElementById(`btn_card_hist_${uniqueSubKey}`)) { document.getElementById(`btn_card_hist_${uniqueSubKey}`).onclick = function (e) { e.preventDefault(); openIndividualHistoryModalInMobile(cleanSessionName, item.title, thText); }; }
            }); // 💡 targetRecords.forEach 상위 반복문이 여기서 매끄럽게 종료 닫힙니다.

            // 🎯 [공백 요일 완치 가드]: 오늘 날짜에 분사되어 찍힌 임상 카드가 한 장도 없다면 예외 안내 보드를 즉시 사출합니다.
            if (renderedCardCount === 0) {
                const liveCertifiedName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || (myLiveJobRecord ? myLiveJobRecord.name : currentCertifiedUser);

                cardBoard.innerHTML = `
                    <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px;">
                        <i class="fa-solid fa-calendar-xmark" style="font-size: 24px; color: var(--text-muted); margin-bottom: 8px; display: block;"></i>
                        <div style="color: #ffffff; font-weight: 800; font-size: 14.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 5px;">
                            <span>👤 ${liveCertifiedName} (${displayBirth6})</span>
                            <span class="${genderClass}" style="padding:1px 5px; border-radius:4px; font-size:11px; font-weight:800;">${genderText}</span>
                        </div>
                        <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">선택하신 날짜에는 등록된 임상시험 일정이 없습니다.</div>
                    </div>
                `;
                return;
            }
        }


        //참여누적 이력조회 ㅇ
        function openIndividualHistoryModalInMobile(currentSessionName, targetTitle, targetTh) {
            let applicantDB = getApplicantData();
            const scrollZone = document.getElementById("modal-history-scroll-zone");
            if (!scrollZone) return; scrollZone.innerHTML = "";
            const rawHistoryRecords = applicantDB.filter(item => (item.name || "").toString().trim() === currentSessionName);
            document.getElementById("m-history-count-title").innerText = `참여 누적 내역 (${rawHistoryRecords.length}건)`;

            if (rawHistoryRecords.length === 0) {
                scrollZone.innerHTML = '<div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding: 20px 0;">연동된 대상자 이력 내역이 존재하지 않습니다.</div>';
            } else {
                rawHistoryRecords.forEach(row => {
                    const isCurrentJob = ((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
                    const miniCard = document.createElement("div");
                    miniCard.className = isCurrentJob ? "history-mini-card current-job" : "history-mini-card";

                    let prefixTag = isCurrentJob ? `<span style="color:var(--secondary-color); font-weight: 800; margin-right: 4px;">[현재시험]</span>` : `<span style="color:var(--text-muted); font-weight:700; margin-right: 4px;">[과거시험]</span>`;
                    let currentPayStatus = row.status || "대기";

                    miniCard.innerHTML = `
                <div style="text-align:left;">
                    <div style="font-size:12px; font-weight:700; color:#ffffff; margin-bottom:2px;">${prefixTag}${row.name || '대상자'} ${row.title || '미지정과제'}</div>
                    <div style="font-size:11px; color:var(--text-muted);">진행기수 : <span style="color:#fff;">${row.th || '-'}</span> | 현재단계: <span style="color: #38bdf8; font-weight:700;">${currentPayStatus}</span></div>
                </div>
            `;
                    scrollZone.appendChild(miniCard);
                });
            }
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: flex !important;');
        }

        window.closeDetailModal = function () {
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: none !important;');
        };

        // ==========================================================================
        // 🔒 [가변 유저 대응형 최종 완착] 독립 기동 즉시 진짜 내 세션 가로채기 3중 수신소
        // ==========================================================================
        window.onload = function () {
            let logUserStr = localStorage.getItem('loggedInUser');
            let logUserSsn = localStorage.getItem('loggedInUserSsn') || "951007-2";

            // 🎯 [정밀 타격 급소 교정]: 구형 객체 수색을 파쇄하고 실시간 진짜 로그인 유저명 키값 1순위 직격 가로채기
            let activeTargetName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || "";

            if (logUserStr && !activeTargetName) {
                try {
                    let parsedLogUser = JSON.parse(logUserStr);
                    if (parsedLogUser && parsedLogUser.name) {
                        activeTargetName = parsedLogUser.name.toString().trim();
                    }
                } catch (e) { console.error("[전산 오류] 자식 달력 내부 성명 캐시 해독 실패:", e); }
            }

            // 만약 세션 스토리지 및 캐시가 모두 부재할 때만 최하위 가드로 백업 데이터 적용
            if (!activeTargetName || activeTargetName === "홍길동") {
                activeTargetName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || "홍길동";
            }
            sessionStorage.setItem('certifiedUserName', activeTargetName);

            // 주민번호 기반 생년월일 6자리 및 성별 식별 인터록 완착
            const cleanSsn = logUserSsn.replace(/[^0-9a-zA-Z]/g, "");
            const displayBirth6 = cleanSsn.substring(0, 6) || "951007";
            let genderText = "여", genderClass = "gender-indicator-badge gender-f";

            if (cleanSsn.endsWith("1") || cleanSsn.endsWith("3") || cleanSsn.includes("M") || cleanSsn.endsWith("M") || cleanSsn.charAt(6) === "1" || cleanSsn.charAt(6) === "3") {
                genderText = "남";
                genderClass = "gender-indicator-badge gender-m";
            }

            // 상단 네on 프로필 팩토리 바인딩 동기화 완료
            const selfTargetSlot = document.getElementById('lblSetTargetNew') || (window.parent ? window.parent.document.getElementById('lblSetTargetNew') : null);
            if (selfTargetSlot) {
                selfTargetSlot.innerHTML = `
            <span style="color:#ffffff; font-weight:800;">👤 \${activeTargetName}</span>
            <span style="color:rgba(255, 255, 255, 0.4); font-weight:500; margin-left:2px;">(\${displayBirth6})</span>
            <span class="\${genderClass}" style="margin-left: 5px; padding:1px 5px; border-radius: 4px; font-size:11px; font-weight: 800; display: inline-block; line-height:1.3;">\${genderText}</span>
        `;
            }

            if (typeof renderCalendar === "function") { renderCalendar(); }
        };

    </script>
</body>

</html>
