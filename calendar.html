<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상 일정 마스터 캘린더</title>
    <!-- 폰트 및 아이콘 라이브러리 연동 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        /* 상단 유틸리티 툴바 및 타이틀 제어 */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .calendar-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--secondary-color);
        }

        .toolbar-group {
            display: flex;
            gap: 6px;
        }

        .tool-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #000;
            border-color: var(--secondary-color);
        }

        /* 월 이동 컨트롤러 */
        .month-controller {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 800;
        }

        .month-btn {
            background: none;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        /* 달력 그리드 구조 레이아웃 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            width: 100%;
        }

        .day-header {
            background: #111827;
            text-align: center;
            padding: 8px 0;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .day-header:nth-child(1) {
            color: #f87171;
        }

        /* 일요일 */
        .day-header:nth-child(7) {
            color: #60a5fa;
        }

        /* 토요일 */

        .day-cell {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            min-height: 95px;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .day-cell.other-month {
            opacity: 0.25;
        }

        .day-num {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .day-cell:nth-child(7n+1) .day-num {
            color: #f87171;
        }

        .day-cell:nth-child(7n) .day-num {
            color: #60a5fa;
        }

        /* 캘린더 내 일정 텍스트 배지 스타일 */
        .event-badge {
            font-size: 10px;
            padding: 3px 5px;
            border-radius: 4px;
            line-height: 1.3;
            font-weight: 500;
            word-break: break-all;
            margin-bottom: 1px;
            color: #ffffff;
        }

        .badge-rec {
            background: rgba(14, 165, 233, 0.25);
            border: 1px solid var(--secondary-color);
        }

        .badge-pay {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid var(--warning-color);
        }

        @media print {
            body {
                background: #fff;
                color: #000;
                padding: 0;
            }

            .toolbar-group,
            .month-controller button {
                display: none;
            }

            .day-cell {
                background: #fff !important;
                border: 1px solid #000 !important;
                min-height: 80px;
            }

            .event-badge {
                color: #000 !important;
                border: 1px solid #000 !important;
                background: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- 1. 상단 타이틀 및 기능 요구사항 3종 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">📊 임상 관리 마스터 일정표</div>
        <div class="toolbar-group">
            <button class="tool-btn active" id="btnFilterAll" onclick="setFilter('ALL')">전체 일정</button>
            <button class="tool-btn" id="btnFilterDuty" onclick="setFilter('DUTY')">참여 일정</button>
            <button class="tool-btn" id="btnFilterNone" onclick="setFilter('NONE')">미참여 일정</button>
            <button class="tool-btn" onclick="executeDownload()"><i class="fa fa-download"></i> 다운로드</button>
            <button class="tool-btn" onclick="window.print()"><i class="fa fa-print"></i> 인쇄</button>
        </div>
    </div>

    <!-- 2. 월 선택 네비게이터 -->
    <div class="month-controller">
        <button class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span id="currentMonthLabel">2026년 09월</span>
        <button class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. 메인 달력 테이블 보드 구역 -->
    <div class="calendar-grid" id="calendarBoard"></div>

    <script>
        let currentDate = new Date();
        let currentFilter = 'ALL'; // ALL, DUTY, NONE

        // 로컬스토리지 동기화 스트림 데이터 로드
        function getMasterData() {
            return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.toolbar-group .tool-btn').forEach(btn => btn.classList.remove('active'));
            if (type === 'ALL') document.getElementById('btnFilterAll').classList.add('active');
            if (type === 'DUTY') document.getElementById('btnFilterDuty').classList.add('active');
            if (type === 'NONE') document.getElementById('btnFilterNone').classList.add('active');
            renderCalendar();
        }

        function moveMonth(v) {
            currentDate.setMonth(currentDate.getMonth() + v);
            renderCalendar();
        }

        function executeDownload() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getMasterData(), null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `clinical_schedule_${currentDate.getFullYear()}_${currentDate.getMonth() + 1}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function renderCalendar() {
            const board = document.getElementById('calendarBoard');
            const label = document.getElementById('currentMonthLabel');
            board.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            label.innerText = `${year}년 ${(month + 1).toString().padStart(2, '0')}월`;

            // 달력 헤더 그리기
            const weeks = ['일', '월', '화', '수', '목', '금', '토'];
            weeks.forEach(w => {
                const head = document.createElement('div');
                head.className = 'day-header';
                head.innerText = w;
                board.appendChild(head);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();

            // 1일 앞쪽의 지난달 빈칸 채우기
            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = `<div class="day-num">${prevLastDate - i}</div>`;
                board.appendChild(cell);
            }

            // 이번달 날짜 렌더링 및 일정 매핑
            const records = getMasterData();

            for (let d = 1; d <= lastDate; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `<div class="day-num">${d}</div>`;

                const thisDateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;

                // 날짜와 데이터 일정 비교 역추적 매핑 구조
                records.forEach(item => {
                    // 참여/미참여 필터 가시성 필터링 분기
                    if (currentFilter === 'DUTY' && (!item.count || parseInt(item.count) <= 0)) return;
                    if (currentFilter === 'NONE' && (item.count && parseInt(item.count) > 0)) return;

                    const thInfo = item.th ? ` (${item.th})` : '';
                    const metaText = `[소집] ${item.title || '과제'}${thInfo} / 인원: ${item.count || 0}명 / 기간: ${item.period || 0}h / CRC: ${item.crc || '-'}`;

                    // A. 소집일자 기준 매핑
                    if (item.recDate === thisDateStr) {
                        const badge = document.createElement('div');
                        badge.className = 'event-badge badge-rec';
                        badge.innerText = metaText;
                        cell.appendChild(badge);
                    }

                    // B. 참여비 차수별 지급 일정 분기 매핑
                    ['payDate1', 'payDate2', 'payDate3'].forEach((pKey, idx) => {
                        if (item[pKey] === thisDateStr) {
                            const badge = document.createElement('div');
                            badge.className = 'event-badge badge-pay';
                            badge.innerText = `[참여비 ${idx + 1}차] ${item.title || '과제'}`;
                            cell.appendChild(badge);
                        }
                    });
                });

                board.appendChild(cell);
            }
        }

        // 파일 오픈 마운트 시 렌더러 즉시 구동
        window.onload = renderCalendar;
    </script>
</body>

</html>
