<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ========================================================
1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인
======================================================== */
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* 📱 html과 body의 실제 가용 면적을 모바일 스크린 비율과 100% 동기화 (주소창 밀림 방어) */
        html,
        body {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            letter-spacing: -0.3px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px 10px !important;
            /* 📱 좁은 모바일 화면 공간 극대화를 위한 슬림 패딩 */
            display: flex;
            flex-direction: column;
        }

        /* ========================================================
         2. 상단 타이틀 및 모바일 최적화 툴바 구역
        ======================================================== */
        .header-container {
            display: flex;
            flex-direction: column;
            /* 📱 세로 배치 정렬로 뷰포트 횡공간 확장 방어 */
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .calendar-title {
            font-size: 16px !important;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            /* 📱 3대 버튼 균등 분할 터치 레이아웃 */
            text-align: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px !important;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #0b0f19;
            border-color: var(--secondary-color);
        }

        /* ========================================================
3. [구조 대혁명] 단일행 주간(7일) 타임라인 바 시스템
======================================================== */
        .weekly-timeline-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            /* 📱 일~토 7일간의 날짜 칸만 한 줄 고정 사출 */
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        /* 주간 날짜 개별 단추 디자인 */
        .weekly-day-btn {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .weekly-day-btn .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .weekly-day-btn .day-date {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 📱 오늘 일자 혹은 실실시간 대상자가 터치해 선택한 요일 활성화 스킨 */
        .weekly-day-btn.active {
            background: rgba(14, 165, 233, 0.15) !important;
            border-color: var(--secondary-color) !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .weekly-day-btn.active .day-name,
        .weekly-day-btn.active .day-date {
            color: var(--secondary-color) !important;
        }

        /* 📱 일요일(레드) 및 토요일(블루) 모바일 컬러 아이덴티티 보존 */
        .weekly-day-btn:nth-child(1) .day-date {
            color: #f87171;
        }

        .weekly-day-btn:nth-child(7) .day-date {
            color: #60a5fa;
        }

        /* ========================================================
4. [구조 대혁명] 당일 소집 과제 대형 세로 스크롤 카드 레일 존
======================================================== */
        .daily-card-scroll-zone {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            /* 📱 모바일 가속 터치 부드러운 스크롤 탑재 */
        }

        /* 📱 하루 최대 5개 이상 과제 중첩 시에도 시원시원하게 스크롤되는 대형 카드 컴포넌트 */
        .trial-manifest-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .card-title-text {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
            flex: 1;
            padding-right: 8px;
        }

        /* 📱 모집공고 고대비 4색 라벨 배지 모바일화 계승 */
        .card-th-badge {
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .th-color-1기 {
            background: rgba(148, 163, 184, 0.12) !important;
            border: 1px solid #94a3b8 !important;
            color: #f8fafc !important;
        }

        .th-color-2기 {
            background: rgba(14, 165, 233, 0.15) !important;
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
        }

        .th-color-3기 {
            background: rgba(74, 222, 128, 0.15) !important;
            border: 1px solid #22c55e !important;
            color: #4ade80 !important;
        }

        .th-color-4기 {
            background: rgba(245, 158, 11, 0.15) !important;
            border: 1px solid #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* 메타 정보 2열 격자 배치 */
        .card-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .card-meta-grid span {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* 카드 하단 직장 일체형 터치 액션 버튼 바 레일 */
        .card-action-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .card-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .card-btn.join {
            background: var(--success-color);
            color: #070a12;
        }

        .card-btn.reject {
            background: var(--danger-color);
            color: #ffffff;
        }

        .card-btn.close {
            background: #334155;
            color: #ffffff;
        }

        /* ========================================================
5. 하단 고정 모바일 가이드 라벨 패널 스킨
======================================================== */
        .bottom-guide-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            height: 95px;
            /* 📱 소프트 키보드 유입 시 터짐 방지 압축 스킨 */
            flex-shrink: 0;
        }

        .white-dictionary-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .notice-list-wrapper {
            font-size: 10px !important;
            color: var(--text-muted);
            line-height: 1.3;
            padding-left: 12px;
        }

        /* ========================================================
6. 모바일 대상자 마스터 누적 이력조회 대형 모달 (100% 보존 수리)
======================================================== */
        .calendar-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .calendar-modal-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 94%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-history-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--warning-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-history-scroll-zone {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-mini-card {
            background: #161e30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .history-mini-card.current-job {
            border-left-color: var(--secondary-color);
            background: rgba(14, 165, 233, 0.04);
        }

        .daily-card-scroll-zone::-webkit-scrollbar,
        .modal-history-scroll-zone::-webkit-scrollbar {
            width: 3px;
        }

        .daily-card-scroll-zone::-webkit-scrollbar-thumb,
        .modal-history-scroll-zone::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }



        /* ========================================================
   . 과거 참여 이력조회 독립 모달 하단 버튼 전용 스킨
   ======================================================== */
        .modal-btn-group-row {
            display: flex !important;
            width: 100% !important;
            margin-top: 14px !important;
            gap: 8px !important;
            box-sizing: border-box !important;
        }

        .modal-act-btn {
            width: 100% !important;
            padding: 12px 10px !important;
            /* 📱 모바일 터치 반경 최적화를 위한 넉넉한 세로폭 배정 */
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            text-align: center !important;
            cursor: pointer !important;
            transition: background 0.15s ease;
        }

        .modal-act-btn.btn-close {
            background: #334155 !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }

        .modal-act-btn.btn-close:active {
            background: #1e293b !important;
        }


        /* ========================================================
   [교정 추가] 2. 연월 가이드 바 컨트롤러 모바일 플렉스 정렬 스킨
   ======================================================== */
        .month-controller {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px !important;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .month-btn {
            background: none !important;
            border: none !important;
            color: var(--secondary-color) !important;
            font-size: 15px !important;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 8px !important;
            transition: transform 0.1s ease;
        }

        .month-btn:active {
            transform: scale(0.85);
        }

        .month-label {
            font-size: 14px !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }
    </style>

</head>

<body>
    <!-- 1. 상단 모바일 기수 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">
            <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄러 (주간 관제)
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()"><i
                    class="fa-solid fa-file-arrow-down"></i> 백업</button>
            <button type="button" class="tool-btn" onclick="window.print()"><i class="fa-solid fa-print"></i>
                인쇄/PDF저장</button>
        </div>
    </div>

    <!-- 2. 월 및 연도 가이드 바 컨트롤러 (모바일 양 끝단 배치 구조) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. [대개혁 핵심] 상단 1행 고정형 주간(7일) 단일 날짜 선택 타임라인 레일 바 -->
    <!-- 자바스크립트 엔진에 의해 일요일부터 토요일까지 7일간의 날짜 조각이 주입됩니다 -->
    <div class="weekly-timeline-bar" id="weeklyTimelineBoard"></div>

    <!-- 4. [대개혁 핵심] 하루 최대 5개 이상의 복잡 과제가 겹쳐도 완벽히 분사하는 세로 스크롤 카드 레일 랙 -->
    <!-- 상단 주간 바에서 선택한 날짜와 실시간 매칭되는 당일 시험 공고 카드들이 세로로 대형 사출됩니다 -->
    <div class="daily-card-scroll-zone" id="dailyCardBoard"></div>

    <!-- 5. 하단 고정 가이드라인 패널 (모바일 10px 슬림 가이드 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 주간 모바일 안내 센터
        </div>
        <ol class="notice-list-wrapper">
            <li>상단 7일 주간 바에서 날짜를 선택하시면 당일 진행 과제 카드가 아래에 정밀 정렬됩니다.</li>
            <li>[과거 참여 이력] 배지 선택 시 대상자의 참여 마스터 누적 내역이 실시간 자동 추적 사출됩니다.</li>
        </ol>
    </div>

    <!-- 6. [대수술 완수] 과거 참여 이력조회 대형 누적 모달 프레임 구역 (원본 스펙 100% 무결성 결합) -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-clock-history"></i> 대상자 마스터 참여 이력 관제탑
                </div>
                <button type="button" class="modal-close-x"
                    onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-folder-tree"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트 팩토리에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 단독 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경 최적화 닫기 단추 레일 -->
            <div class="modal-btn-group-row" style="grid-template-columns: 1fr;">
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()"
                    style="background: #334155; color: #ffffff; width: 100%;">이력 화면 닫기</button>
            </div>
        </div>
    </div>


    <script>
        // 1. 달력 주간 변수 및 선택 날짜 정밀 추적 포인터 [이전 장전 완착 스펙]
        let currentDate = new Date(); // 실시간 시스템 원격 오늘 날짜 자동 추적 마운트 완료

        // 오늘 날짜를 기준으로 YYYY-MM-DD 스트링 락포인터를 유연하게 동적 자동 산출
        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');

        let selectedDateStr = `${yyyy}-${mm}-${dd}`;
        let currentFilter = 'ALL';
        let currentCertifiedUser = sessionStorage.getItem('certifiedUserName') || "";

        /**
         * 2. 메인 대시보드(admin.html)의 로컬스토리지 임상시험 마스터 레코드 스트림 연동
         */
        function getMasterData() {
            return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
        }

        /**
         * 3. 대상자 관리 탭(applicantView)의 가상 데이터베이스 동기화 스트림 로드
         */
        function getApplicantData() {
            return JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
        }

        /**
         * 4. 주간 선택 컨트롤러 네비게이터 작동기 (화살표 터치 시 7일 주간 단위로 레일 이동)
         */
        function moveMonth(v) {
            currentDate.setDate(currentDate.getDate() + (v * 7));
            renderCalendar();
        }

        /**
         * 5. 🎯 [기능 전면 개혁 완착]: 구형 JSON 백업 사출 기능을 완벽히 폐기 철거하고, 
         * 상단 중앙 [시험현황] 단추 터치 시 부모창인 m-login.html의 4단계 나의 시험정보방으로 무지연 원격 복귀시키는 통신 엔진
         */
        function executeDownload() {
            console.log("[원격 인터록 작동] 모바일 관제탑 ➔ 부모창 m-login 4단계 나의 시험현황 화면으로 강제 이송 패킷 발행.");

            // 크로스 도메인 및 iframe 샌드박스 보안 장벽을 관통하여 부모 본진에 복귀 트리거 발사
            if (window.parent) {
                window.parent.postMessage({
                    action: "GOTO_STEP_4",
                    timestamp: Date.now()
                }, "*");
            } else if (window.opener && !window.opener.closed) {
                // 팝업 윈도우 스펙 호환용 폴백 가드
                if (typeof window.opener.navigateToStep === "function") {
                    window.opener.navigateToStep(4);
                }
            }
        }

        // 글로벌 스코프에 현재 활성화된 모달 과제 컨텍스트 데이터 보존
        let currentActiveModalJob = null;
        let currentTemporaryUid = "";

        // [신설]: 주간 7일간 글로벌 전산망 레일의 날짜 컬렉션을 팩토리와 하단 카드 실시간 공유하기 위한 글로벌 가선
        window.currentWeeklyDateKeys = [];

        /**
         * 6. [대개혁 코어] 상단 1행 고정형 주간(7일) 타임라인 바 동적 빌더 함수
         */
        function renderCalendar() {
            const timelineBoard = document.getElementById('weeklyTimelineBoard');
            const label = document.getElementById('currentMonthLabel');
            if (!timelineBoard) return;
            timelineBoard.innerHTML = '';

            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();

            // 상단 연도 및 월 표기 가이드 실시간 갱신
            if (label) label.innerText = `${currentYear}년 ${(currentMonth + 1).toString().padStart(2, '0')}월`;

            // 현재 기준 날짜에서 이번 주 일요일(시작점) 날짜 역산
            const currentDayOfWeek = currentDate.getDay(); // 0: 일요일 ~ 6: 토요일
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDayOfWeek);

            const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
            window.currentWeeklyDateKeys = [];

            // 일요일부터 토요일까지 딱 7일간의 상단 날짜 단추 레일 생성 루프
            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(startOfWeek);
                loopDate.setDate(startOfWeek.getDate() + i);

                // 한국 시차(UTC+9) 보정 오프셋 반영 후 완벽한 YYYY-MM-DD 10자리 표준 규격 문자열 정밀 추출
                const kstoffset = loopDate.getTime() - (loopDate.getTimezoneOffset() * 60000);
                const formattedDateKey = new Date(kstoffset).toISOString().split('T')[0];

                // 하단 카드 팩토리 스캔용 공유 버퍼 풀에 7일치 주간 날짜 전수 적재
                window.currentWeeklyDateKeys.push(formattedDateKey);

                // 최초 로딩 시 오늘 일자를 디폴트 활성화 타겟으로 지정
                if (!selectedDateStr && i === currentDayOfWeek) {
                    selectedDateStr = formattedDateKey;
                }

                const dayBtn = document.createElement('div');
                dayBtn.className = `weekly-day-btn ${selectedDateStr === formattedDateKey ? 'active' : ''}`;

                dayBtn.innerHTML = `
                    <div class="day-name">${dayNamesShort[i]}</div>
                    <div class="day-date">${loopDate.getDate()}</div>
                `;

                // 요일 단추 터치 시 실시간 포인터를 스위칭하고 하단 상세 제어 권한을 릴레이 스위칭 리프레시
                dayBtn.onclick = function () {
                    selectedDateStr = formattedDateKey;
                    document.querySelectorAll('.weekly-day-btn').forEach(btn => btn.classList.remove('active'));
                    dayBtn.classList.add('active');
                    renderDailyCards(); // 하단 대형 세로형 카드 목록의 신청 제어 장벽을 실시간 갱신
                };

                timelineBoard.appendChild(dayBtn);
            }

            // 주간 바배치 마감 즉시 전체 카드를 리스트에 상시 유지 자동 사출
            renderDailyCards();
        }

        /**
         * 7. [구조 대개혁 코어]: 주간 전체 모집공고 전수 선제 공개 및 선택 일자별 참여 단추 레일 조건부 개방 엔진
         */
        function renderDailyCards() {
            const cardBoard = document.getElementById('dailyCardBoard');
            if (!cardBoard) return;
            cardBoard.innerHTML = '';

            const records = getMasterData();
            let applicantDB = getApplicantData();

            let loggedInUser = JSON.parse(localStorage.getItem('loggedInUser')) || {};
            if (!loggedInUser.name) {
                loggedInUser = { name: "홍길동", isNew: false };
                localStorage.setItem('loggedInUser', JSON.stringify(loggedInUser));
            }

            const currentSessionName = loggedInUser.name.toString().trim();
            const cleanSessionName = currentSessionName.replace(/\s/g, "");
            const cleanSelectedDateStr = selectedDateStr.toString().replace(/[^0-9]/g, "");

            // 🔒 [격리 판단 가드]: 참여하지 않은 시험, 참여가 종료되지 않은 시험, 6개월 미과과자 역산 타과제 차단
            const myLiveJobRecord = applicantDB.find(app =>
                (app.name || "").toString().replace(/\s/g, "") === cleanSessionName &&
                app.stage && !["종료", "탈락", "신검탈락", "신검동철"].includes(app.stage)
            );
            const isLockInUser = !!myLiveJobRecord;

            // 💡 [실무 지급 공식 핵심 역산 포인터 사전 빌드업]
            // 날짜 가감 연산 전용 내장 헬퍼 매커니즘
            function calculateSubtractedDate(baseStr, minusDays) {
                if (!baseStr || baseStr.includes("추후")) return null;
                const dObj = new Date(baseStr.trim());
                if (isNaN(dObj.getTime())) return null;
                dObj.setDate(dObj.getDate() - minusDays);
                return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
            }

            // 오늘 기준으로 지나간 시험 배제 연산용 바인딩
            const todayMidnight = new Date();
            todayMidnight.setHours(0, 0, 0, 0);

            // 🔒 [대원칙 격리 셔터 작동]: 타인의 시험공고 원천 박멸 및 선택한 특정 요일 날짜에 진짜 매칭되는 일정만 필터 스캔
            const targetRecords = records.filter(item => {
                if (!item.recDate) return false;

                // ❶ [과제명 1:1 복합 차단]: 내 과제명과 다른 공고는 흔적도 없이 전면 격리 차단 (은폐 필터링 거절)
                if (isLockInUser && myLiveJobRecord.title !== item.title) {
                    return false;
                }

                // 기수(th) 명세까지 완벽하게 일치하는지 2중 크로스 검문 가드 작동
                if (isLockInUser && myLiveJobRecord.th && item.th) {
                    const cleanMyTh = myLiveJobRecord.th.toString().replace(/[^0-9]/g, "");
                    const cleanItemTh = item.th.toString().replace(/[^0-9]/g, "");
                    if (cleanMyTh !== cleanItemTh) return false;
                }

                const recDateObj = new Date(item.recDate);
                recDateObj.setHours(0, 0, 0, 0);
                if (recDateObj < todayMidnight) return false;

                // ❷ [4대 행정 일자 동적 역산 타깃 필터링 추가 주입]
                // 현재 스캔 중인 공고 원본을 토대로 진짜 행정 날짜 딕셔너리 트랙 생성
                let itemScheduleMap = {};

                // 스크리닝일 (모집공고의 recDate 기본 상속)
                if (item.recDate) itemScheduleMap[item.recDate.trim()] = true;

                // 소집일 (대상자 대장의 ssn 란에 숨겨진 진짜 소집일 파싱 연동)
                if (isLockInUser && myLiveJobRecord.ssn && myLiveJobRecord.ssn.includes("소집:")) {
                    const parsedSojib = myLiveJobRecord.ssn.match(/\d{4}-\d{2}-\d{2}/);
                    if (parsedSojib) itemScheduleMap[parsedSojib[0]] = true;
                }

                // 1차~4차 방문일 = 참여비 지급예정일(payDate1~4)의 1주일 전(7일 전) 역산 공식 반영
                if (item.payDate1) { const d = calculateSubtractedDate(item.payDate1, 7); if (d) itemScheduleMap[d] = true; }
                if (item.payDate2) { const d = calculateSubtractedDate(item.payDate2, 7); if (d) itemScheduleMap[d] = true; }
                if (item.payDate3) { const d = calculateSubtractedDate(item.payDate3, 7); if (d) itemScheduleMap[d] = true; }
                if (item.payDate4) { const d = calculateSubtractedDate(item.payDate4, 7); if (d) itemScheduleMap[d] = true; }

                // 종료검사일 = 종료비 지급예정일(paySchedule 내 날짜 또는 payDate5)의 14일 전 역산 공식 반영
                if (item.paySchedule) {
                    const matchedDates = item.paySchedule.toString().match(/\d{4}-\d{2}-\d{2}/g);
                    if (matchedDates && matchedDates.length >= 5) {
                        const d = calculateSubtractedDate(matchedDates[4], 14); if (d) itemScheduleMap[d] = true;
                    } else if (item.payDate5) {
                        const d = calculateSubtractedDate(item.payDate5, 14); if (d) itemScheduleMap[d] = true;
                    }
                }

                // 🎯 [핵심 진압 마스크 체결]: 상단 주간 레일에서 마우스/터치로 '선택한 특정 날짜(selectedDateStr)'가 
                // 이 과제의 진짜 역산 4대 행정 일자 맵에 포함되어 존재할 때만 카드로 사출 노출 인가!!
                if (!itemScheduleMap[selectedDateStr.toString().trim()]) {
                    return false;
                }

                // 3중 필터링을 모두 무결하게 통과한 진짜 일정만 상단 레일 바와 매칭 전파
                const cleanRecDate = item.recDate.toString().replace(/[^0-9]/g, "");
                return window.currentWeeklyDateKeys.some(weeklyKey => weeklyKey.replace(/[^0-9]/g, "") === cleanRecDate);
            });

            if (targetRecords.length === 0) {
                cardBoard.innerHTML = `
                    <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px;">
                        <i class="fa-solid fa-calendar-xmark" style="font-size: 24px; color: var(--text-muted); margin-bottom: 8px; display: block;"></i>
                        선택하신 날짜에는 배정된 임상시험 차수 세부 일정이 없습니다.
                    </div>
                `;
                return;
            }

            targetRecords.forEach(item => {
                const thText = (item.th || "1기").trim();
                const clickUid = item.uid ? item.uid : item.title;
                const dynamicColorClass = `th-color-${thText}`;
                const cleanRecDate = item.recDate.toString().replace(/[^0-9]/g, "");
                const isDateMatchedNow = (cleanRecDate === cleanSelectedDateStr);
                const actionDisplayStatus = isDateMatchedNow ? "grid" : "none";
                const guideDisplayStatus = isDateMatchedNow ? "none" : "block";

                // 💡 [실물 요구사항 이식]: 복잡한 공고 제목 대신 현재 진행 행정 단계에 맞춰 4대 표기명으로 치환 노출 [INDEX: 1]
                let currentStageText = "스크리닝";
                let liveStatusText = "신검대기";

                if (isLockInUser) {
                    liveStatusText = myLiveJobRecord.status || myLiveJobRecord.stage || "신검대기";
                    if (["신검대기", "신검통과"].includes(liveStatusText)) {
                        currentStageText = "스크리닝";
                    } else if (liveStatusText === "소집") {
                        currentStageText = "소집일";
                    } else if (liveStatusText.includes("방문") && liveStatusText !== "종료방문") {
                        currentStageText = `${liveStatusText} 채혈`; // 1~4차 방문채혈 명세화 [INDEX: 1]
                    } else if (liveStatusText === "종료방문" || liveStatusText === "종료") {
                        currentStageText = "종료방문";
                    } else {
                        currentStageText = liveStatusText;
                    }
                }

                const borderHighlightStyle = isDateMatchedNow ? "border: 1px solid var(--secondary-color); box-shadow: 0 0 12px rgba(14, 165, 233, 0.2);" : "";
                const card = document.createElement('div');
                card.className = 'trial-manifest-card';
                card.setAttribute("style", borderHighlightStyle);
                card.innerHTML = `
                    <div class="card-top-row">
                        <!-- 🎯 진짜 참여중인 과제 정보에 맞춰 4대 행정 용어 텍스트만 깔끔하게 표출 -->
                        <div class="card-title-text" style="color: #ffffff; font-weight:800;">${currentStageText} 일자 일정 안내</div>
                        <div class="card-th-badge ${dynamicColorClass}">[${thText}]</div>
                    </div>
                    <div class="card-meta-grid">
                        <div>연계 과제: <span style="color:#38bdf8; font-weight:700;">${item.title || '임상 과제명 미지정'}</span></div>
                        <div>배정 정원: <span>${item.count ? item.count + '명' : '-'}</span></div>
                        <div>임상 기간: <span>${item.period ? item.period + '시간' : ''}</span></div>
                        <div>소집 일자: <span style="color: var(--secondary-color); font-weight: 800;">${item.recDate || '-'}</span></div>
                    </div>
                    <div style="display: ${guideDisplayStatus}; background-color: #0f172a; border: 1px dashed #334155; padding: 8px; border-radius: 8px; font-size: 11px; color: var(--warning-color); text-align: center; margin-top: 6px;">
                        ■상세 청구 및 신청은 상단 주간 바에서 <strong>[${item.recDate.substring(5)}]</strong> 요일을 터치하세요.
                    </div>
                    <div class="card-action-bar" id="ui_action_bar_${clickUid}" style="display: ${actionDisplayStatus};">
                        <button type="button" class="card-btn join" id="btn_card_join_${clickUid}">참여</button>
                        <button type="button" class="card-btn reject" id="btn_card_reject_${clickUid}">미참여</button>
                        <button type="button" class="card-btn close" id="btn_card_hist_${clickUid}"><i class="fa-solid fa-clock-history"></i> 이력</button>
                    </div>
                `;

                // 🔒 [미래 일정 터치 차단 클릭 가드 원격 수혈] [INDEX: 1]
                // 진재영 대상자가 [신검통과] 유효 단계 상태일 때, 미래 일정(1~4차 방문 등)은 클릭 가드 작동 [INDEX: 1]
                if (isLockInUser) {
                    if (liveStatusText === "신검대기" || liveStatusText === "신검통과") {
                        if (currentStageText !== "스크리닝") {
                            card.classList.add('mobile-future-lock');
                        }
                    } else if (liveStatusText === "소집" || liveStatusText.includes("방문")) {
                        if (currentStageText !== liveStatusText && !currentStageText.includes(liveStatusText)) {
                            card.classList.add('mobile-future-lock');
                        }
                    }
                }

                cardBoard.appendChild(card);

                if (isDateMatchedNow) {
                    const joinBtn = document.getElementById(`btn_card_join_${clickUid}`);
                    if (joinBtn) {
                        joinBtn.onclick = function (e) {
                            e.preventDefault();

                            const cleanSessionName = currentSessionName.toString().trim().replace(/\s/g, "");
                            let appDB = getApplicantData();

                            // [1단계 가드]: 액티브 과제 중복 신청 원천 차단막 스크린
                            const activeJobRecord = appDB.find(app => {
                                const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                                const dbTitle = (app.title || '').toString().trim();
                                return cleanDbName === cleanSessionName && app.stage !== "종료" && dbTitle !== "신규 방문 과제 미배정";
                            });

                            // 💡 [기획 특수 예외 보정]: 이미 참여중인 락인 유저(진재영)인 경우 중복신청 차단막을 유연하게 우회하여 출석 전진 루프 연결
                            if (activeJobRecord && !isLockInUser) {
                                alert("중복 신청 불가 안내\n\n대상자님은 현재 참여 중이거나 전산 심사 대기 중인 임상시험 과제가 존재합니다.\n\n한 명당 오직 하나의 시험만 참여 가능하므로 다른 시험에 중복 신청할 수 없습니다.");
                                return;
                            }

                            // [2단계 가드]: 종료 대상자 대상 180일 격리 연산 인터셉터
                            const finishedJobs = appDB.filter(app => {
                                const cleanDbName = (app.name || '').toString().replace(/\s/g, "");
                                return cleanDbName === cleanSessionName && app.stage === "종료" && app.recDate;
                            });

                            if (finishedJobs.length > 0 && !isLockInUser) {
                                finishedJobs.sort((a, b) => new Date(b.recDate) - new Date(a.recDate));
                                const lastFinishedJob = finishedJobs[0];
                                const systemCurrentTime = new Date("2026-09-20");
                                const lastExamDate = new Date(lastFinishedJob.recDate);

                                const timeDiff = systemCurrentTime.getTime() - lastExamDate.getTime();
                                const dayDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

                                if (dayDiff < 180) {
                                    alert(`전산망 보안 안내\n\n대상자님은 마지막 시험 참여 후 아직 6개월이 경과하지 않았습니다.\n(현재 ${dayDiff}일 경과 / 180일 이후 신청 가능)\n\n기존 과제가 종료되었더라도 격리 기간이 지나야 새 시험 참여가 가능합니다.`);
                                    return;
                                }
                            }

                            // [3단계 가드]: 동일 과제 중복 참여 최종 디펜스
                            const isAlreadyClickedThisJob = appDB.some(app =>
                                (app.name || '').toString().trim() === currentSessionName &&
                                (app.title || '').toString().trim() === (item.title || '').toString().trim() &&
                                (app.th || '').toString().trim() === thText
                            );

                            // 💡 [출석체크 인터록 결합]: 이미 배정된 유저가 본인 일정 배지에서 참여를 눌렀을 때 ➔ 상태 강제 전진 실행 [INDEX: 1]
                            if (isLockInUser && isAlreadyClickedThisJob) {
                                const myIdx = appDB.findIndex(app => (app.name || '').toString().replace(/\s/g, "") === cleanSessionName && app.stage && !["종료", "탈락"].includes(app.stage));
                                if (myIdx !== -1) {
                                    // 현재 진행 행정 트랙 한 칸 전진 스위칭 (실무 프로세스 순차 도래 락인)
                                    if (liveStatusText === "신검대기") {
                                        appDB[myIdx].status = "신검통과"; appDB[myIdx].stage = "신검통과";
                                    } else if (liveStatusText === "신검통과") {
                                        appDB[myIdx].status = "소집"; appDB[myIdx].stage = "소집";
                                    } else if (liveStatusText === "소집") {
                                        appDB[myIdx].status = "1차방문"; appDB[myIdx].stage = "1차방문";
                                    } else if (liveStatusText === "1차방문") {
                                        appDB[myIdx].status = "2차방문"; appDB[myIdx].stage = "2차방문";
                                    } else if (liveStatusText === "2차방문") {
                                        appDB[myIdx].status = "3차방문"; appDB[myIdx].stage = "3차방문";
                                    } else if (liveStatusText === "3차방문") {
                                        appDB[myIdx].status = "4차방문"; appDB[myIdx].stage = "4차방문";
                                    } else if (liveStatusText === "4차방문") {
                                        appDB[myIdx].status = "종료방문"; appDB[myIdx].stage = "종료방문";
                                    } else if (liveStatusText === "종료방문") {
                                        appDB[myIdx].status = "종료"; appDB[myIdx].stage = "종료";
                                    }

                                    localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                                    alert(`🎉 출석 인증 성공\n\n대상자님의 참여 상태가 [${appDB[myIdx].status}] 단계로 정상 전진 업데이트 커밋되었습니다.`);

                                    // ⚡ [최상위 관제탑 원격 불 켜기 트리거]: admin.html 부모 대시보드 명단 뷰어 무새로고침 실시간 표출 리렌더링 인터록 발사
                                    if (window.opener && !window.opener.closed) {
                                        if (typeof window.opener.refreshApplicantView === "function") window.opener.refreshApplicantView();
                                        else if (typeof window.opener.refreshAdminMemberTableView === "function") window.opener.refreshAdminMemberTableView();
                                    }

                                    renderCalendar(); // 내장 주간 그리드 바 실시간 새로고침
                                    return;
                                }
                            }

                            if (isAlreadyClickedThisJob && !isLockInUser) {
                                alert("중복참여");
                                try {
                                    localStorage.setItem('currentStep', '4');
                                    localStorage.setItem('forcedStepNum', '4');
                                    if (document.getElementById('calendar-modal')) document.getElementById('calendar-modal').style.display = 'none';
                                    const parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;
                                    const lyr4 = parentDoc.getElementById('layer4');
                                    const lyr5 = parentDoc.getElementById('layer5');
                                    if (lyr5) lyr5.style.setProperty("display", "none", "important");
                                    if (lyr4) {
                                        lyr4.style.setProperty("display", "block", "important");
                                        if (window.parent && typeof window.parent.renderStep4SettlementCard === "function") window.parent.renderStep4SettlementCard();
                                    }
                                } catch (fatalRouteErr) {
                                    if (window.parent) window.parent.location.href = "m-login.html?step=4";
                                }
                                return;
                            }

                            // [4단계 파이프라인: 완전히 독립된 격리 신규 행 생성 차단 ➔ 실시간 엎어치기]
                            const realUserSession = appDB.find(u => u.name.toString().trim() === currentSessionName) || {}; //

                            // 로그인 시점에 임시 생성되어 대장에 들어가 있던 "신규 방문 과제 미배정" 행 객체를 성명 크로스 매칭으로 정밀 추적 색인!
                            let targetIdx = appDB.findIndex(u => (u.name || '').toString().trim().replace(/\s/g, "") === cleanSessionName && (u.title || '').toString().trim() === "신규 방문 과제 미배정"); //

                            // [인원수 정순 증가 스케줄러]: 이 시험(경동제약 식후 임상시험 등) + 이 기수로 기존 대장에 이미 등록 완료된 진짜 실시간 머릿수 산출
                            const liveQuotaCount = appDB.filter(u =>
                                (u.title || '').toString().replace(/\s/g, "") === item.title.toString().replace(/\s/g, "") &&
                                (u.th || '').toString().replace(/\s/g, "") === thText.toString().replace(/\s/g, "")
                            ).length; //

                            // [순번 왜곡 박멸]: 기존 머릿체인에 정직하게 이번 신규 진입 분인 +1을 누적 결합하여 실시간 분모 고정 분수 포맷 사출
                            const nextLineNumber = liveQuotaCount + 1; //

                            // [요구사항 반영]: 고정 정원 구조에 맞게 인원수 증가 시 1/60 포맷 스펙으로 사출 배치
                            const liveProgressFormat = nextLineNumber + "/60"; //

                            // 실시간 엎어치기 및 정보 매핑 인스턴스 빌드
                            const newApplicantRecord = { //
                                // 기존 임시 행이 존재한다면 그 고유 UID를 1%의 변조도 없이 그대로 상속 사수하여 데이터 파편화 차단!
                                uid: (targetIdx !== -1 ? appDB[targetIdx].uid : ("NEW_" + Date.now() + "_" + Math.floor(Math.random() * 1000))), //

                                name: currentSessionName, //
                                title: item.title, // "신규 방문 과제 미배정" 칸을 진짜 선택한 시험명으로 완벽 엎어치기!
                                th: thText,        // 진짜 기수 정보로 완벽 엎어치기!
                                count: liveProgressFormat, // 1/60 형태로 실시간 누적 증가된 분수 포맷 사출!
                                nCount: 60, //
                                period: item.period || "0", //

                                // 진짜 생년월일, 전화번호, 성별 상속 락인 및 더미 찌꺼기 청소 세척 완료
                                ssn: realUserSession.ssn ? realUserSession.ssn.toString().trim().toUpperCase() : "850101-1", //
                                phone: realUserSession.phone ? realUserSession.phone.toString().trim() : "010-0000-0000", //
                                gender: realUserSession.gender || (typeof parseGenderFromSsn === "function" ? parseGenderFromSsn(realUserSession.ssn, currentSessionName) : "남"), //

                                // 행정 금융 정산 스코어보드 초기화 동기화 표준 레일 세팅
                                payStatus1: "대기", //
                                payStatus2: "대기", //
                                payStatus3: "대기", //
                                payStatus: "대기", //
                                result: "대기", //
                                isDutyAgreed: "대기", //
                                isCallAgreed: "대기", //

                                category: realUserSession.category || "M인증", //
                                // [임상 실무 헌법 잠금]: 구형 "소집" 표기를 전면 철거하고, 신체검사 결과 대기자 규격인 "신검대기" 배지로 강제 락인 마운트!
                                stage: "신검대기", //
                                regDate: new Date().toISOString().split('T')[0] //
                            }; //

                            // [하이브리드 적재 스케줄러]: 기존 "미배정" 줄이 있으면 1:1 치환 교체 업데이트 단행!
                            if (targetIdx !== -1) { //
                                appDB[targetIdx] = Object.assign({}, appDB[targetIdx], newApplicantRecord); //
                            } else { //
                                appDB.push(newApplicantRecord); //
                            } //

                            // 가상 데이터베이스 최종 영구 커밋 동기화
                            localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB)); //

                            // 표준화 가이드 완벽 준수 사출 ('피험자' ➔ '대상자' 단어 완전 소독 마감)
                            alert(`[신청 접수 완료]\n\n${currentSessionName} 대상자님, \n선택하신 임상시험 [${item.title}] 과제 참여 신청이 정상 접수되었습니다.`); //

                            renderDailyCards(); // 화면 상세 리스트 즉시 리렌더링 실시간 동기화
                        };
                    }


                    const rejectBtn = document.getElementById(`btn_card_reject_${clickUid}`);
                    if (rejectBtn) {
                        rejectBtn.onclick = function (e) {
                            e.preventDefault();
                            alert('미참여 신청 되었습니다.');
                        };
                    }

                    const histBtn = document.getElementById(`btn_card_hist_${clickUid}`);
                    if (histBtn) {
                        histBtn.onclick = function (e) {
                            e.preventDefault();
                            openIndividualHistoryModalInMobile(currentSessionName, item.title, thText);
                        };
                    }
                }
            });
        }

        /**
         * 8. [원본 무결성 보존] 모바일 전용 참여 마스터 이력조회 모달 강제 렌더러
         */
        function openIndividualHistoryModalInMobile(currentSessionName, targetTitle, targetTh) {
            let applicantDB = getApplicantData();
            const scrollZone = document.getElementById("modal-history-scroll-zone");
            if (!scrollZone) return;
            scrollZone.innerHTML = "";

            const rawHistoryRecords = applicantDB.filter(item => (item.name || "").toString().trim() === currentSessionName);

            const currentJobArray = rawHistoryRecords.filter(row => (row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
            const pastJobArray = rawHistoryRecords.filter(row => !((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh));
            const sortedHistoryRecords = currentJobArray.concat(pastJobArray);

            document.getElementById("m-history-count-title").innerText = `참여 누적 내역 (${sortedHistoryRecords.length}건)`;

            if (sortedHistoryRecords.length === 0) {
                scrollZone.innerHTML = `<div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding: 20px 0;">연동된 대상자 이력 내역이 존재하지 않습니다.</div>`;
            } else {
                sortedHistoryRecords.forEach(row => {
                    const isCurrentJob = ((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
                    const miniCard = document.createElement("div");
                    miniCard.className = isCurrentJob ? "history-mini-card current-job" : "history-mini-card";

                    let prefixTag = isCurrentJob ? `<span style="color:var(--secondary-color); font-weight:800; margin-right:4px;">[현재시험]</span>` : `<span style="color:var(--text-muted); font-weight:700; margin-right:4px;">[과거시험]</span>`;
                    let rowTitleDisplay = row.title || '미지정 과제';
                    if (row.isVirtualGhost) {
                        prefixTag = '<span style="color:var(--success-color); font-weight: 800; margin-right: 4px;"> [최초인증]</span>';
                        rowTitleDisplay = `${rowTitleDisplay} (가상 회원권 즉시 발급됨)`;
                    }

                    const currentPayStatus = row.payStatus1 || row.payStatus || "대기";
                    let statusColor = "#94a3b8";
                    if (currentPayStatus === "접수") statusColor = "#38bdf8";
                    else if (currentPayStatus === "처리중") statusColor = "#fbbf24";
                    else if (currentPayStatus === "완료") statusColor = "var(--success-color)";
                    else if (currentPayStatus === "대기") statusColor = "var(--danger-color)";

                    miniCard.innerHTML = `
                        <div style="text-align:left;">
                            <div style="font-size:12px; font-weight:700; color:#ffffff; margin-bottom:2px;">
                                ${prefixTag}${row.name || '대상자'} ${rowTitleDisplay}
                            </div>
                            <div style="font-size:11px; color:var(--text-muted);">
                                진행기수: <span style="color:#fff;">${row.th || '-'}</span> | 인정 시간: <span style="color:#fff;">${row.period || '0'}시간</span>
                            </div>
                            <div style="font-size:11.5px; color:var(--text-muted); white-space:nowrap; margin-top:2px;">
                                지급상태: <span style="color: ${statusColor}; font-weight:700;"> ${currentPayStatus}</span>
                            </div>
                        </div>
                    `;
                    scrollZone.appendChild(miniCard);
                });
            }

            const overlay = document.getElementById('detailModaloverlay');
            if (overlay) overlay.setAttribute('style', 'display: flex !important;');
        }

        window.closeDetailModal = function () {
            const overlay = document.getElementById('detailModaloverlay');
            if (overlay) overlay.setAttribute('style', 'display: none !important;');
        };

        window.onload = renderCalendar;

    </script>
</body>

</html>
