<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
 /* ========================================================
1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인
======================================================== */
:root {
    --bg-color: #0b0f19;
    --card-color: #1a233a;
    --border-color: #334155;
    --secondary-color: #0ea5e9;
    --success-color: #4ade80;
    --warning-color: #fbbf24;
    --danger-color: #f87171;
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
}

/* 📱 html과 body의 실제 가용 면적을 모바일 스크린 비율과 100% 동기화 */
html,
body {
    height: 100% !important;
    max-height: 100% !important;
    overflow: hidden;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    letter-spacing: -0.3px;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 10px 8px !important; /* 📱 좁은 모바일 화면을 위해 여백 최소화 */
    display: flex;
    flex-direction: column;
}

/* ========================================================
2. 상단 타이틀 및 모바일 최적화 툴바 구역
======================================================== */
.header-container {
    display: flex;
    flex-direction: column; /* 📱 세로 정렬로 뷰포트 공간 확보 */
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    flex-shrink: 0;
}

.calendar-title {
    font-size: 16px !important; /* 📱 모바일 타이틀 크기 최적화 */
    font-weight: 800;
    color: var(--secondary-color);
    display: flex;
    align-items: center;
    gap: 6px;
}

.toolbar-group {
    display: flex;
    gap: 4px;
    width: 100%; /* 📱 너비를 100%로 채워 정렬선 일치 */
}

.tool-btn {
    flex: 1; /* 📱 균등 분할 배치로 터치 오차 방지 */
    text-align: center;
    justify-content: center;
    padding: 6px 4px;
    font-size: 11px !important; /* 📱 가로 공간 방어를 위해 자간 및 크기 압축 */
    font-weight: 700;
    color: #fff;
    background: var(--card-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    transition: all 0.15s ease;
}

.tool-btn.active {
    background: var(--secondary-color);
    color: #0b0f19;
    border-color: var(--secondary-color);
}

/* ========================================================
3. 월 선택 모바일 최적화 내비게이터
======================================================== */
.month-controller {
    display: flex;
    justify-content: space-between; /* 📱 양 끝단으로 컨트롤러를 밀어 터치 편의성 극대화 */
    align-items: center;
    margin-bottom: 8px;
    flex-shrink: 0;
    width: 100%;
}

.month-label {
    font-size: 18px !important;
    font-weight: 800;
    color: #ffffff;
    text-align: center;
    flex: 1;
}

.month-btn {
    background: #1e293b;
    border: 1px solid var(--border-color);
    color: var(--secondary-color);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    width: 36px; /* 📱 손가락 터치 면적 스케일업(36px) */
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

/* ========================================================
4. 달력판 본체 및 모바일 압축 격자 구조 설계
======================================================== */
.calendar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-bottom: 8px;
    gap: 3px;
}

.weekday-bar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    height: 24px;
    width: 100%;
    flex-shrink: 0;
}

.day-header {
    background: #111827;
    text-align: center;
    line-height: 22px;
    font-weight: 700;
    font-size: 11px !important;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    border-radius: 4px;
    height: 100%;
}

.day-header:nth-child(1) { color: #f87171; }
.day-header:nth-child(7) { color: #60a5fa; }

.date-grid-scroll-zone {
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
    min-height: 0;
    -webkit-overflow-scrolling: touch; /* 📱 모바일 가속 터치 스크롤 이식 */
}

.date-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    width: 100%;
}

.day-cell {
    background: var(--card-color);
    border: 1px solid var(--border-color);
    padding: 3px !important;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 84px !important; /* 📱 PC용 140px에서 모바일 압축형 84px 구조로 대전환 */
    overflow: hidden;
}

.day-cell.other-month {
    opacity: 0.12;
}

.day-num {
    font-size: 11px !important;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 1px;
}

.date-grid .day-cell:nth-child(7n+1) .day-num { color: #f87171; }
.date-grid .day-cell:nth-child(7n) .day-num { color: #60a5fa; }

/* 📱 모바일 특화 일정 배지 (가로가 비좁아 튀어나오는 글자를 완벽 압축) */
.event-badge {
    font-size: 10px !important; /* 📱 10px 압축으로 가시성 방어 */
    padding: 2px 3px !important;
    border-radius: 3px;
    line-height: 1.2;
    font-weight: 800;
    word-break: break-all;
    cursor: pointer;
    white-space: nowrap; /* 📱 폰트 세로 터짐 방지 */
    overflow: hidden;
    text-overflow: ellipsis; /* 📱 초과 텍스트 자동 말줄임 처리 */
}

.th-color-1기 { background: rgba(148, 163, 184, 0.1) !important; border: 1px solid rgba(148, 163, 184, 0.6) !important; color: #cbd5e1 !important; }
.th-color-2기 { background: rgba(14, 165, 233, 0.1) !important; border: 1px solid rgba(14, 165, 233, 0.6) !important; color: #38bdf8 !important; }
.th-color-3기 { background: rgba(168, 85, 247, 0.1) !important; border: 1px solid rgba(168, 85, 247, 0.6) !important; color: #c084fc !important; }
.th-color-4기 { background: rgba(245, 158, 11, 0.1) !important; border: 1px solid rgba(245, 158, 11, 0.6) !important; color: #fbbf24 !important; }

/* ========================================================
5. 하단 고정 모바일 안내 패널 스킨
======================================================== */
.bottom-guide-panel {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #111827;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    height: 95px; /* 📱 폰 화면 높이 방어를 위한 슬림 박스 압축 */
    flex-shrink: 0;
}

.white-dictionary-box {
    background: #ffffff;
    color: #0b0f19;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
}

.notice-list-wrapper {
    font-size: 10px !important;
    color: var(--text-muted);
    line-height: 1.3;
    padding-left: 12px;
}

/* ========================================================
6. 모바일 전용 대형 풀와이드 팝업 모달 서식
======================================================== */
.calendar-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    z-index: 99999;
    justify-content: center;
    align-items: center;
}

.calendar-modal-box {
    background: var(--card-color);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 16px !important; /* 📱 내부 터치 반경을 넓히기 위해 마진 축소 */
    width: 94% !important; /* 📱 PC용 고정폭을 버리고 스마트폰 너비에 맞춤 밀착 */
    max-width: 380px !important;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    animation: modalPopUp 0.18s ease-out;
}

@keyframes modalPopUp {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    margin-bottom: 10px;
}

.modal-title {
    font-size: 14px !important;
    font-weight: 800;
    color: var(--secondary-color);
    display: flex;
    align-items: center;
    gap: 4px;
}

.modal-close-x {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
}

/* 📱 모바일 특화 반응형 상세 내역 테이블 서식 */
.modal-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 12px;
}

.modal-table th,
.modal-table td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
}

.modal-table th {
    color: var(--text-muted);
    font-weight: 700;
    width: 32% !important; /* 📱 항목 글자가 세로로 꺾이지 않도록 고정 비율 보장 */
    background: rgba(255, 255, 255, 0.01);
}

.modal-table td {
    color: #ffffff;
    font-weight: 500;
}

.modal-history-title {
    font-size: 12px !important;
    font-weight: 800;
    color: var(--warning-color);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.modal-history-scroll-zone {
    background: #0b0f19;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px;
    max-height: 140px !important; /* 📱 소프트 키보드 유입 시 밀림을 방지하는 컴팩트 박스 */
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
    -webkit-overflow-scrolling: touch;
}

.history-mini-card {
    background: #161e30;
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--border-color);
    padding: 8px !important;
    border-radius: 6px;
    display: flex;
    flex-direction: column; /* 📱 가로 공간 협소 문제를 원천 차단하는 세로 적재 구조 */
    align-items: flex-start !important;
    gap: 4px;
    width: 100%;
}

.history-mini-card.current-job {
    border-left-color: var(--secondary-color);
    background: rgba(14, 165, 233, 0.04);
}

/* 📱 터치 미스를 전면 삭제하는 대형 균등 액션 버튼 트랙 */
.modal-btn-group-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
}

.modal-act-btn {
    padding: 10px 4px !important;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px !important;
    cursor: pointer;
    text-align: center;
}

.modal-act-btn.btn-join { background: var(--success-color); color: #070a12; }
.modal-act-btn.btn-reject { background: var(--danger-color); color: #ffffff; }
.modal-act-btn.btn-close { background: #334155; color: #ffffff; }

.date-grid-scroll-zone::-webkit-scrollbar,
.modal-history-scroll-zone::-webkit-scrollbar { width: 3px; }
.date-grid-scroll-zone::-webkit-scrollbar-thumb,
.modal-history-scroll-zone::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
</style>

</head>

<body>
  <!-- 1. 상단 모바일 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">
            <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄러 (모바일)
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()"><i class="fa-solid fa-file-arrow-down"></i> 백업</button>
            <button type="button" class="tool-btn" onclick="window.print()"><i class="fa-solid fa-print"></i> 인쇄</button>
        </div>
    </div>

    <!-- 2. 월 선택 컨트롤러 네비게이터 (모바일 양 끝단 배치 구조) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. 메인 모바일 달력 격자판 (상단 요일바 압축 및 가속 터치 스크롤 스케일 격자 구조) -->
    <div class="calendar-wrapper">
        <div class="weekday-bar">
            <div class="day-header">일</div>
            <div class="day-header">월</div>
            <div class="day-header">화</div>
            <div class="day-header">수</div>
            <div class="day-header">목</div>
            <div class="day-header">금</div>
            <div class="day-header">토</div>
        </div>
        <div class="date-grid-scroll-zone">
            <div class="date-grid" id="calendarBoard"></div>
        </div>
    </div>

    <!-- 4. 하단 고정 가이드라인 패널 (모바일 10px 슬림 텍스트 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 임상 안내 센터 가동중
        </div>
        <ol class="notice-list-wrapper">
            <li>과제 배지 터치 시 참여 신청 상세 모달 팝업이 전격 연동 사출됩니다.</li>
            <li>이미 참여 신청이 완료된 시험 과제는 중복 선택이 원천 가드 차단됩니다.</li>
        </ol>
    </div>

    <!-- 5. [모바일 대수술 완수] 시험명 클릭 시 동적으로 작동하는 풀와이드 상세 모달 프레임 구역 -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-circle-info"></i> [소집 일정 상세 안내]
                </div>
                <button type="button" class="modal-close-x" onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 모바일 반응형 상세 정보 테이블 배정 -->
            <table class="modal-table">
                <tr>
                    <th>임상 시험명</th>
                    <td id="m-title" style="color:var(--secondary-color); font-weight:800;">-</td>
                </tr>
                <tr>
                    <th>진행 기수</th>
                    <td id="m-th">-</td>
                </tr>
                <tr>
                    <th>배정 인원</th>
                    <td id="m-count">-</td>
                </tr>
                <tr>
                    <th>임상 기간</th>
                    <td id="m-period">-</td>
                </tr>
                <tr>
                    <th>담당 CRC</th>
                    <td id="m-crc">-</td>
                </tr>
                <tr>
                    <th>소집 일자</th>
                    <td id="m-recDate">-</td>
                </tr>
            </table>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-clock-history"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경을 최적화한 균등 분할 3대 대형 터치 액션 버튼 레이어 -->
            <div class="modal-btn-group-row">
                <button type="button" class="modal-act-btn btn-join">참여</button>
                <button type="button" class="modal-act-btn btn-reject">미참여</button>
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()">닫기</button>
            </div>
        </div>
    </div>
    

    <script>
// 1. 달력 전역 상태 관리 포인터 스케줄러
let currentDate = new Date();
let currentFilter = 'ALL';

/**
 * 2. 메인 대시보드(admin.html)의 로컬스토리지 임상시험 마스터 레코드 스트림 연동
 */
function getMasterData() {
    return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
}

/**
 * 3. 대상자 관리 탭(applicantView)의 가상 데이터베이스 동기화 스트림 로드
 */
function getApplicantData() {
    return JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
}

/**
 * 4. 월 선택 컨트롤러 네비게이터 작동기 (모바일 터치 스위칭)
 */
function moveMonth(v) {
    currentDate.setMonth(currentDate.getMonth() + v);
    renderCalendar();
}

/**
 * 5. 전체 스케줄링 백업 데이터 JSON 파일 사출 다운로드 함수
 */
function executeDownload() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getMasterData(), null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `CTMS_Schedule_${currentDate.getFullYear()}_${currentDate.getMonth() + 1}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// 글로벌 스코프에 현재 활성화된 모달 과제 컨텍스트 데이터 보존
let currentActiveModalJob = null;
let currentTemporaryUid = ""; // 💡 [인덱스 버그 해결] 실시간 배열 순서 변동에 대응할 고유 UID 락 보존 변수

/**
 * 6. 오직 소집일자만 추적 매핑하는 정밀 달력 격자 사출 렌더러 함수
 */
function renderCalendar() {
    const board = document.getElementById('calendarBoard');
    const label = document.getElementById('currentMonthLabel');
    if (!board) return;
    board.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    if (label) label.innerText = `${year}년 ${(month + 1).toString().padStart(2, '0')}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    // 이전 달 일자 사출 (모바일 압축 스킨 연동)
    for (let i = firstDay - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `<div class="day-num">${prevLastDate - i}</div>`;
        board.appendChild(cell);
    }

    const records = getMasterData();

    // 이번 달 핵심 일자 루프 기동
    for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerHTML = `<div class="day-num">${d}</div>`;

        const targetYearStr = year.toString();
        const targetMonthStr = (month + 1).toString().padStart(2, '0');
        const targetDayStr = d.toString().padStart(2, '0');
        const thisDateStr = `${targetYearStr}-${targetMonthStr}-${targetDayStr}`;

        records.forEach(item => {
            const thText = (item.th || "1기").trim();
            const thLabel = item.th ? ` [${item.th}]` : '';
            const clickUid = item.uid ? item.uid : item.title;

            const dynamicColorClass = `th-color-${thText}`;

            // 소집 일자와 달력 날짜 격자가 실시간 일치 시 과제 배지 락인 바인딩
            if (item.recDate && item.recDate.trim() === thisDateStr) {
                const badge = document.createElement('div');
                badge.className = `event-badge ${dynamicColorClass}`;
                badge.innerHTML = `+ ${item.title || '과제'}${thLabel}`;
                badge.setAttribute('onclick', `openClinicalDetailModal('${clickUid}', '소집 일정')`);
                cell.appendChild(badge);
            }
        });

        board.appendChild(cell);
    }
}      

/**
 * 7. m-login.html 인증 세션 연동 및 가상 회원가입 자동 패스권 탑재 엔진 + 원본 버튼 하이재킹 모듈 결합 [INDEX: 0.1.34]
 */
window.openClinicalDetailModal = function (uid, typeTitle) {
    const records = getMasterData();
    let applicantDB = getApplicantData();

    const target = records.find(item => item.uid == uid || item.title === uid);
    if (!target) return console.error("오류: 선택한 임상 데이터 정보를 역추적할 수 없습니다.");

    const targetTitle = (target.title || "").toString().trim();
    const targetTh = (target.th || "").toString().trim();

    currentActiveModalJob = target;

    let loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!loggedInUser || !loggedInUser.name) {
        loggedInUser = { name: "홍길동", isNew: false };
        localStorage.setItem('loggedInUser', JSON.stringify(loggedInUser));
    }

    const currentSessionName = loggedInUser.name.toString().trim();

    // 현재 로그인한 사용자의 고유한 가상 티켓 또는 정식 신청건을 찾아 추적
    let myTicket = applicantDB.find(app => (app.name || "").toString().trim() === currentSessionName);

    if (!myTicket) {
        // 전연 참여 적 없는 완전 신규 방문 대상자인 경우 즉석 가상 티켓 발행
        currentTemporaryUid = "TEMP_" + Date.now();
        myTicket = {
            uid: currentTemporaryUid,
            name: currentSessionName,
            title: targetTitle,
            th: targetTh,
            period: target.period || "0",
            payStatus: "대기",
            isVirtualGhost: true
        };
        applicantDB.push(myTicket);
        localStorage.setItem('dataStoreApplicant', JSON.stringify(applicantDB));
    } else {
        // 이미 등록되어 있던 계정이라면 해당 객체의 불변 고유 uid를 시스템 추적 키로 락인
        currentTemporaryUid = myTicket.uid;
    }

    document.getElementById('m-popup-type').innerHTML = `<i class="fa-solid fa-circle-info"></i> [${typeTitle} 상세 안내]`;
    document.getElementById('m-title').innerText = target.title || '-';
    document.getElementById('m-th').innerText = target.th || '-';
    document.getElementById('m-count').innerText = target.count ? target.count + '명' : '-';
    document.getElementById('m-period').innerText = target.period ? target.period + '시간' : '-';
    document.getElementById('m-crc').innerText = target.crc || '-';
    document.getElementById('m-recDate').innerText = target.recDate || '-';

    const scrollZone = document.getElementById("modal-history-scroll-zone");
    if (scrollZone) {
        scrollZone.innerHTML = "";

        // [버그 교정 핵심] 타인의 데이터가 섞이지 않도록 오직 현재 로그인된 대상자 성명 정보만 단독 정밀 추출
        const rawHistoryRecords = applicantDB.filter(item =>
            (item.name || "").toString().trim() === currentSessionName && (item.name || "").toString().trim() !== ""
        );

        const currentJobArray = rawHistoryRecords.filter(row =>
            (row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh
        );
        const pastJobArray = rawHistoryRecords.filter(row =>
            !((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh)
        );

        const sortedHistoryRecords = currentJobArray.concat(pastJobArray);
        document.getElementById("m-history-count-title").innerText = `참여 누적 내역 (${sortedHistoryRecords.length}건)`;

        if (sortedHistoryRecords.length === 0) {
            scrollZone.innerHTML = `<div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding:20px 0;">연동된 대상자 이력 내역이 존재하지 않습니다.</div>`;
        } else {
            sortedHistoryRecords.forEach(row => {
                const isCurrentJob = ((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
                const miniCard = document.createElement("div");
                miniCard.className = isCurrentJob ? "history-mini-card current-job" : "history-mini-card";

                let prefixTag = isCurrentJob ? `<span style="color:var(--secondary-color); font-weight:800; margin-right:4px;">[현재시험]</span>` : `<span style="color:var(--text-muted); font-weight:700; margin-right:4px;">[과거시험]</span>`;
                let rowTitleDisplay = row.title || '미지정 과제';
                if (row.isVirtualGhost) {
                    prefixTag = `<span style="color:var(--success-color); font-weight:800; margin-right:4px;">[최초인증]</span>`;
                    rowTitleDisplay = `${rowTitleDisplay} (가상 회원 패스권 즉시 발급됨)`;
                }

                const currentPayStatus = row.payStatus1 || row.payStatus || "대기";
                let statusColor = "#94a3b8";
                if (currentPayStatus === "접수") statusColor = "#38bdf8";
                else if (currentPayStatus === "처리중") statusColor = "#fbbf24";
                else if (currentPayStatus === "완료") statusColor = "var(--success-color)";
                else if (currentPayStatus === "대기") statusColor = "var(--danger-color)";

                miniCard.innerHTML = `
                    <div style="text-align:left;">
                        <div style="font-size:13px; font-weight:700; color:#ffffff; margin-bottom:2px;">
                            ${prefixTag}${row.name || '대상자'} - ${rowTitleDisplay}
                        </div>
                        <div style="font-size:11.5px; color:var(--text-muted);">
                            진행기수: <span style="color:#fff;">${row.th || '-'}</span> | 인정시간: <span style="color:#fff;">${row.period || '0'}시간</span>
                        </div>
                    </div>
                    <div style="font-size:12.5px; color:var(--text-muted); white-space:nowrap;">
                        지급상태: <span style="color:${statusColor}; font-weight:700;">${currentPayStatus}</span>
                    </div>
                `;
                scrollZone.appendChild(miniCard);
            });
        }
    }

    // 💡 원본 HTML 소스를 100% 보존하기 위해 타겟 엘리먼트 내부의 온클릭 핸들러 가로채기(인터셉트) 기믹 가동 [INDEX: 0.1.36]
    setTimeout(() => {
        const btnJoin = document.querySelector('.btn-join');
        const btnReject = document.querySelector('.btn-reject');

        if (btnJoin) {
            btnJoin.onclick = function (e) {
                e.preventDefault();
                let appDB = JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];

                // 🔒 [하이브리드 중복 참여 차단 가드벽 엔진 가동] [INDEX: 0.1.36]
                const isAlreadyJoined = appDB.some(app => 
                    (app.name || '').toString().trim() === currentSessionName &&
                    (app.title || '').toString().trim() === targetTitle &&
                    (app.th || '').toString().trim() === targetTh &&
                    !app.isVirtualGhost
                );

                if (isAlreadyJoined) {
                    // 지시하신 대로 알림창 내 가독성 높은 2단 줄바꿈(\n)을 사출하고, 승인을 누르면 모달을 유연하게 클로즈 마감 [INDEX: 0.1.36]
                    alert("알림: 이미 참가한 시험입니다.\n기존에 신청 완료된 일정 및 과제를 확인해 주세요.");
                    document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;');
                    return; // 하단의 가상 플래그 삭제 및 중복 데이터 덮어쓰기 파이프라인을 완전히 차단
                }

                // 고유 UID 속성을 추적하여 정확한 행 포인터 락인 [INDEX: 0.1.36]
                const myTargetIdx = appDB.findIndex(app => String(app.uid) === String(currentTemporaryUid));

                if (myTargetIdx !== -1) {
                    // 💡 [버그 종결 핵심 설계]: 기존 배열 메모리 주소를 요동치게 하던 splice, unshift를 전면 파기하고 원래 자리를 100% 현상 보존! [INDEX: 0.1.36]
                    delete appDB[myTargetIdx].isVirtualGhost;
                    delete appDB[myTargetIdx].isNewUserGhost;

                    appDB[myTargetIdx].title = targetTitle;
                    appDB[myTargetIdx].th = targetTh;
                    appDB[myTargetIdx].period = currentActiveModalJob.period || "0";
                    appDB[myTargetIdx].payStatus = "대기"; // 대기 상태로 정식 도약 [INDEX: 0.1.36]

                    localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                }
                alert('참여 신청 접수되었습니다.');
                document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;');
            };
        }

        if (btnReject) {
            btnReject.onclick = function (e) {
                e.preventDefault();
                alert('미참여 신청 되었습니다.');
                document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;');
            };
        }
    }, 50);

    const overlay = document.getElementById('detailModalOverlay');
    if (overlay) overlay.setAttribute('style', 'display: flex !important;');
};

window.closeDetailModal = function (e) {
    const overlay = document.getElementById('detailModalOverlay');
    if (overlay) overlay.setAttribute('style', 'display: none !important;');
};

window.onload = renderCalendar;
    </script>
