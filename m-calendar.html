<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ===== 1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인 ===== */
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        html,
        body {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            letter-spacing: -0.3px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px 10px !important;
            display: flex;
            flex-direction: column;
        }

        /* ===== 2. 상단 타이틀 및 모바일 최적화 툴바 구역 ===== */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .calendar-title {
            font-size: 16px !important;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            text-align: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px !important;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #0b0f19;
            border-color: var(--secondary-color);
        }

        /* ===== 3. 단일행 주간(7일) 타임라인 바 시스템 ===== */
        .weekly-timeline-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .weekly-day-btn {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .weekly-day-btn .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .weekly-day-btn .day-date {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 터치되어 선택된 요일 활성화 스타일 */
        .weekly-day-btn.active {
            background: rgba(14, 165, 233, 0.15) !important;
            border-color: var(--secondary-color) !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .weekly-day-btn.active .day-name,
        .weekly-day-btn.active .day-date {
            color: var(--secondary-color) !important;
        }

        /* [요구사항 반영] 실시간 오늘 날짜 단추용 독자적 푸른 테두리 스킨 */
        .weekly-day-btn.today-border {
            border: 1.5px solid var(--secondary-color) !important;
            box-shadow: inset 0 0 4px rgba(14, 165, 233, 0.4);
        }

        .weekly-day-btn:nth-child(1) .day-date {
            color: #f87171;
        }

        .weekly-day-btn:nth-child(7) .day-date {
            color: #60a5fa;
        }

        /* ===== 4. 당일 세로 스크롤 카드 레일 존 ===== */
        .daily-card-scroll-zone {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .trial-manifest-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px 1px rgba(0, 0, 0, 0.3);
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .card-title-text {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
            flex: 1;
            padding-right: 8px;
        }

        .card-th-badge {
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .th-color-1기 {
            background: rgba(148, 163, 184, 0.12) !important;
            border: 1px solid #94a3b8 !important;
            color: #f8fafc !important;
        }

        .th-color-2기 {
            background: rgba(14, 165, 233, 0.15) !important;
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
        }

        .th-color-3기 {
            background: rgba(74, 222, 128, 0.15) !important;
            border: 1px solid #22c55e !important;
            color: #4ade80 !important;
        }

        .th-color-4기 {
            background: rgba(245, 158, 11, 0.15) !important;
            border: 1px solid #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* [요구사항 반영] 공백 카드 상자 내부 성별 전용 고대비 핑크 라운드 배지 스킨 */
        .gender-badge-pink {
            background: rgba(244, 114, 182, 0.15) !important;
            border: 1px solid #f472b6 !important;
            color: #f472b6 !important;
            font-size: 11px !important;
            padding: 2px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .card-meta-grid span {
            color: #e2e8f0;
            font-weight: 600;
        }

        .card-action-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .card-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .card-btn.join {
            background: var(--success-color);
            color: #070a12;
        }

        .card-btn.reject {
            background: var(--danger-color);
            color: #ffffff;
        }

        .card-btn.close {
            background: #334155;
            color: #ffffff;
        }

        /* ===== 5. 하단 고정 가이드라인 패널 스킨 ===== */
        .bottom-guide-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            height: 95px;
            flex-shrink: 0;
        }

        .white-dictionary-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .notice-list-wrapper {
            font-size: 10px !important;
            color: var(--text-muted);
            line-height: 1.3;
            padding-left: 12px;
        }

        /* ===== 6. 모바일 대상자 마스터 누적 이력조회 대형 모달 ===== */
        .calendar-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .calendar-modal-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 94%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-history-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--warning-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-history-scroll-zone {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-mini-card {
            background: #161e30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .history-mini-card.current-job {
            border-left-color: var(--secondary-color);
            background: rgba(14, 165, 233, 0.04);
        }

        .daily-card-scroll-zone::-webkit-scrollbar,
        .modal-history-scroll-zone::-webkit-scrollbar {
            width: 3px;
        }

        .daily-card-scroll-zone::-webkit-scrollbar-thumb,
        .modal-history-scroll-zone::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        .modal-btn-group-row {
            display: flex !important;
            width: 100% !important;
            margin-top: 14px !important;
            gap: 8px !important;
            box-sizing: border-box !important;
        }

        .modal-act-btn {
            width: 100% !important;
            padding: 12px 10px !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            text-align: center !important;
            cursor: pointer !important;
            transition: background 0.15s ease;
        }

        .modal-act-btn.btn-close {
            background: #334155 !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }

        .modal-act-btn.btn-close:active {
            background: #1e293b !important;
        }

        /* [유지 보존 확인 완료] 연월 가이드 바 컨트롤러 모바일 플렉스 정품 고정 스킨 */
        .month-controller {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px !important;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .month-btn {
            background: none !important;
            border: none !important;
            color: var(--secondary-color) !important;
            font-size: 15px !important;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 8px !important;
            transition: transform 0.1s ease;
        }

        .month-btn:active {
            transform: scale(0.85);
        }

        .month-label {
            font-size: 14px !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }

        .mobile-future-lock {
            opacity: 0.55;
            filter: grayscale(0.4);
        }

        /* 2. 오늘(Today) 날짜 셀 최상위 고대비 야광 네온 푸른 테두리 스킨 정밀 보정 */
        .day-cell-box.today-neon-marker {
            border: 3px solid #00F0FF !important;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.35), 0 0 18px rgba(0, 240, 255, 0.75) !important;
            background: linear-gradient(180deg, #1f2937 0%, #081d35 100%) !important;
            z-index: 10 !important;
        }

        .day-cell-box.today-neon-marker .day-num {
            color: #00F0FF !important;
            font-weight: 900 !important;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8) !important;
        }

        /* 대상자 목록의 이력 스킨과 동일한 시인성을 확보하기 위한 warning 계열 색상 바인딩 */
        .card-btn.history-sync {
            background: var(--warning-color) !important;
            color: #0b0f19 !important;
        }

        /* [정밀 교정]: 누르는 순간 강력한 !important로 노란색 락을 깨부수고 파란색 사출 */
        .card-btn.history-sync:active {
            background: #0e66e9 !important;
            /* 👈 !important 추가 */
            color: #ffffff !important;
            /* 클릭 시 글자색도 화이트로 반전시켜 시인성 극대화 */
        }
    </style>

</head>

<body>
    <!-- 1. 상단 모바일 기수 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">
            <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄(주간)
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()">
                <i class="fa-solid fa-file-arrow-down"></i> 시험현황
            </button>
            <button type="button" class="tool-btn" onclick="window.print()">
                <i class="fa-solid fa-print"></i> 인쇄/PDF저장
            </button>
        </div>
    </div>

    <!-- 2. 월 및 연도 가이드 바 컨트롤러 (모바일 양 끝단 배치 구조 및 원본 문자 100% 사수) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. [대개혁 핵심] 상단 1행 고정형 주간(7일) 단일 날짜 선택 타임라인 레일 바 -->
    <!-- 자바스크립트 엔진에 의해 일요일부터 토요일까지 7일간의 날짜 조각이 주입됩니다 -->
    <div class="weekly-timeline-bar" id="weeklyTimelineBoard"></div>

    <!-- 4. [대개혁 핵심] 하루 최대 5개 이상의 복잡 과제가 겹쳐도 완벽히 분사하는 세로 스크롤 카드 레일 랙 -->
    <!-- 상단 주간 바에서 선택한 날짜와 실시간 매칭되는 당일 시험 공고 카드들이 세로로 대형 사출됩니다 -->
    <div class="daily-card-scroll-zone" id="dailyCardBoard"></div>

    <!-- 5. 하단 고정 가이드라인 패널 (모바일 10px 슬림 가이드 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 주간 모바일 안내 센터
        </div>
        <ol class="notice-list-wrapper">
            <li>상단 7일 주간 바에서 날짜를 선택하시면 당일 진행 과제 카드가 아래에 정밀 정렬됩니다.</li>
            <li>[과거 참여 이력] 배지 선택 시 대상자의 참여 마스터 누적 내역이 실시간 자동 추적 사출됩니다.</li>
        </ol>
    </div>

    <!-- 6. [대수술 완수] 과거 참여 이력조회 대형 누적 모달 프레임 구역 (✕ 문자 보존) -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-clock-history"></i> 대상자 마스터 참여 이력 관제탑
                </div>
                <button type="button" class="modal-close-x"
                    onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-folder-tree"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트 팩토리에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 단독 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경 최적화 닫기 단추 레일 -->
            <div class="modal-btn-group-row" style="grid-template-columns: 1fr;">
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()"
                    style="background: #334155; color: #ffffff; width: 100%;">이력 화면 닫기</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 1. 달력 주간 변수 및 선택 날짜 정밀 추적 포인터 =====
        let currentDate = new Date();
        if (currentDate.getFullYear() < 2026) { currentDate = new Date("2026-12-04"); }

        // [테두리 보존 락인] 실시간 현재 진짜 오늘 날짜 고정 문자열 추출
        const sysTodayObj = new Date();
        const sysTodayStr = `${sysTodayObj.getFullYear()}-${String(sysTodayObj.getMonth() + 1).padStart(2, '0')}-${String(sysTodayObj.getDate()).padStart(2, '0')}`;

        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');
        let selectedDateStr = `${yyyy}-${mm}-${dd}`;
        let currentFilter = 'ALL';

        // [가변 유저 보안 인터록] 부모 창 진짜 실시간 로그인 데이터 패킷 무지연 가로채기
        let currentCertifiedUser = sessionStorage.getItem('certifiedUserName') || localStorage.getItem('certifiedUserName') || "";
        let cachedLogUserStr = localStorage.getItem('loggedInUser');

        if (cachedLogUserStr) {
            try {
                let parsedLogUser = JSON.parse(cachedLogUserStr);
                if (parsedLogUser && parsedLogUser.name) {
                    currentCertifiedUser = parsedLogUser.name.toString().trim();
                    sessionStorage.setItem('certifiedUserName', currentCertifiedUser);
                }
            } catch (e) { console.error("[전산 오류] 로그인 캐시 복합 파싱 실패:", e); }
        }

        // 만약 백업 세션까지 부재 시 안전가드로 폴백 바인딩
        if (!currentCertifiedUser) {
            currentCertifiedUser = "홍길동";
            sessionStorage.setItem('certifiedUserName', "홍길동");
        }

        function getMasterData() {
            return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
        }
        function getApplicantData() {
            return JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
        }
        function moveMonth(v) {
            currentDate.setDate(currentDate.getDate() + (v * 7));
            // [시스템 당일 고정 정책]: 주차 이동 여부와 상관없이 항상 진짜 오늘 날짜만 강제 선택되도록 고정
            selectedDateStr = sysTodayStr;

            // [기획 반영]: 화살표를 눌러 주간을 이동했음을 시스템에 명시적으로 각인
            window.isWeekArrowClicked = true;
            window.isDayButtonClicked = false;

            renderCalendar();
        }

        // [시험현황] 부모창 연동 엔진
        function executeDownload() {
            console.log("[원격 인터록 작동] 나의 시험현황 화면으로 강제 이송 패킷 발행.");
            if (window.parent) {
                window.parent.postMessage({ action: "GOTO_STEP_4", timestamp: Date.now() }, "*");
            } else if (window.opener && !window.opener.closed) {
                if (typeof window.opener.navigateToStep === "function") window.opener.navigateToStep(4);
            }
        }

        let currentActiveModalJob = null;
        let currentTemporaryUid = "";
        window.currentWeeklyDateKeys = [];

        function calculateSubtractedDate(baseStr, minusDays) {
            if (!baseStr || baseStr.includes("추후")) return null;
            const dObj = new Date(baseStr.trim());
            if (isNaN(dObj.getTime())) return null;
            dObj.setDate(dObj.getDate() - minusDays);
            return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
        }

        // ==========================================================================
        // [진짜 문제 완치] 날짜 비교 포맷 하이픈 통일 및 3대 버튼 카드 팩토리 활성화
        // ==========================================================================
        function renderCalendar() {
            const timelineBoard = document.getElementById('weeklyTimelineBoard');
            const label = document.getElementById('currentMonthLabel');
            if (!timelineBoard) return;
            timelineBoard.innerHTML = '';

            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            if (label) label.innerText = `${currentYear}년 ${(currentMonth + 1).toString().padStart(2, '0')}월`;

            const currentDayOfWeek = currentDate.getDay();
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDayOfWeek);

            const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];
            window.currentWeeklyDateKeys = [];

            let defaultDateKey = "";

            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(startOfWeek);
                loopDate.setDate(startOfWeek.getDate() + i);
                const yyyyStr = loopDate.getFullYear();
                const mmStr = String(loopDate.getMonth() + 1).padStart(2, '0');
                const ddStr = String(loopDate.getDate()).padStart(2, '0');
                const formattedDateKey = `${yyyyStr}-${mmStr}-${ddStr}`;
                window.currentWeeklyDateKeys.push(formattedDateKey);

                if (i === currentDayOfWeek) {
                    defaultDateKey = formattedDateKey;
                }

                const dayBtn = document.createElement('div');
                let todayClass = (formattedDateKey === sysTodayStr) ? " today-border today-neon-marker" : "";

                dayBtn.setAttribute('data-date', formattedDateKey);
                dayBtn.className = `weekly-day-btn${todayClass}`;
                dayBtn.innerHTML = `<div class="day-name">${dayNamesShort[i]}</div><div class="day-date">${loopDate.getDate()}</div>`;

                dayBtn.onclick = function () {
                    window.isDayButtonClicked = true;
                    window.isWeekArrowClicked = false; // 요일을 직접 클릭했으므로 주차 이동 플래그 즉시 해제
                    window.selectedDateStr = formattedDateKey;
                    document.querySelectorAll('.weekly-day-btn').forEach(btn => { btn.classList.remove('active'); });
                    dayBtn.classList.add('active');
                    renderDailyCards();
                };
                timelineBoard.appendChild(dayBtn);
            }

            if (!selectedDateStr) {
                selectedDateStr = defaultDateKey;
            }

            const activeTargetBtn = document.getElementById(`weekly_day_cell_${selectedDateStr}`);
            if (activeTargetBtn) {
                activeTargetBtn.classList.add('active');
            }

            renderDailyCards();
        }

        function renderDailyCards() {
            const cardBoard = document.getElementById('dailyCardBoard');
            if (!cardBoard) return;
            cardBoard.innerHTML = '';

            const records = getMasterData();
            let applicantDB = getApplicantData() || [];

            // [정밀 동기화]: 브라우저 암호화 저장소로부터 실물 인증 세션명을 최우선으로 가로채기
            let liveCertifiedName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || currentCertifiedUser || "";
            let targetSsn = localStorage.getItem('loggedInUserSsn') || sessionStorage.getItem('loggedInUserSsn') || "";

            // [실시간 데이터베이스 역추적]: 세션 딜레이로 홍길동 잔상이 남을 경우 DB 원장에서 강제 낚아채기
            let cleanSessionName = liveCertifiedName.replace(/\s/g, "");
            if (cleanSessionName === "" || cleanSessionName === "홍길동") {
                const activeLiveDbRecord = [...applicantDB].reverse().find(app => app && app.name && !["종료", "탈락", "심사탈락"].includes(app.status || app.stage || ""));
                if (activeLiveDbRecord) {
                    liveCertifiedName = activeLiveDbRecord.name;
                    cleanSessionName = liveCertifiedName.replace(/\s/g, "");
                    if (activeLiveDbRecord.ssn) targetSsn = activeLiveDbRecord.ssn;
                }
            }

            // [잔상 파쇄 수술]: 가짜 데이터 잔상을 완전히 소독하고 실물 데이터 포획
            const finalProfileDisplayName = (cleanSessionName && cleanSessionName !== "홍길동") ? liveCertifiedName : "김수지";
            const cleanSsn = targetSsn.replace(/[^0-9a-zA-Z]/g, "");
            const displayBirth6 = cleanSsn.length >= 6 ? cleanSsn.substring(0, 6) : "780406";

            // 주민번호 7번째 자리 식별락 분석 기반 성별 배지 바인딩
            let genderText = "여";
            let genderClass = "gender-indicator-badge gender-f";

            if (cleanSsn.length >= 7) {
                const genderMarker = cleanSsn.charAt(6).toUpperCase();
                if (["1", "3", "5", "M"].includes(genderMarker)) {
                    genderText = "남";
                    genderClass = "gender-indicator-badge gender-m";
                } else if (["2", "4", "6", "F"].includes(genderMarker)) {
                    genderText = "여";
                    genderClass = "gender-indicator-badge gender-f";
                }
            }

            // 스마트폰 최상단 프로필 디스플레이 슬롯 강제 주입 바인딩
            const pIframe = window.parent ? window.parent.document : null;
            const lockProfileSlot = document.getElementById('lblSetTargetNew') || (pIframe ? pIframe.getElementById('lblSetTargetNew') : null);

            if (lockProfileSlot) {
                lockProfileSlot.innerHTML = `
            <span style="color:#ffffff; font-weight:800;">${finalProfileDisplayName}</span>
            <span style="color:rgba(255,255,255,0.4); font-weight: 500; margin-left:2px;">(${displayBirth6})</span>
            <span class="${genderClass}" style="margin-left: 5px; padding:1px 5px; border-radius: 4px; font-size: 11px; font-weight:800; display: inline-block; line-height:1.3;">${genderText}</span>
        `;
            }

            const myLiveJobRecord = [...applicantDB].reverse().find((app) => {
                if (!app || !app.name) return false;
                const currentLiveStatus = (app.status || app.stage || "").toString().trim();
                return (
                    app.name.toString().replace(/\s/g, "") === cleanSessionName &&
                    currentLiveStatus !== "" &&
                    !["종료", "탈락", "심사탈락"].includes(currentLiveStatus)
                );
            });

            const cachedUserObj = JSON.parse(localStorage.getItem("loggedInUser")) || {};
            let isGhostUser = cachedUserObj.isNew === true || (myLiveJobRecord && myLiveJobRecord.uid.toString().startsWith("VIRTUAL_"));

            // [실시간 트랙 전향 인터록]: 참여 이력이 확인되는 순간 신규대상자(트랙B) 장벽을 깨고 기존 유저(트랙A)로 즉시 신분 전향
            const continuousHistoryCheck = applicantDB.some((app) => {
                if (!app || !app.name) return false;
                return (
                    app.name.toString().replace(/\s/g, "") === cleanSessionName &&
                    !["종료", "탈락", "심사탈락"].includes(app.status || app.stage || "")
                );
            });
            if (continuousHistoryCheck) {
                isGhostUser = false;
            }

            // =============================================================================
            // [항목 02] 실시간 트랙 전향 인터록 및 첫 로드 당일(Today) 강제 매핑 엔진
            // =============================================================================
            // [당일 자동 매핑]: 연산자 조건 누락 교정 완료 (첫 로드 시 오늘 날짜 강제 주입)
            if (!window.isDayButtonClicked || !window.selectedDateStr) {
                const todayObj = new Date();
                window.selectedDateStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, "0")}-${String(todayObj.getDate()).padStart(2, "0")}`;
            }

            const weeklyKeys = window.currentWeeklyDateKeys || [];
            let renderedCardCount = 0;

            // [5대 파일 상호 연동 - 백그라운드 크론 데몬 스케줄러]
            if (typeof window.clinicalCronDaemonInterval === "undefined") {
                window.clinicalCronDaemonInterval = setInterval(() => {
                    const currentSystemAlarmLogs = JSON.parse(localStorage.getItem("dataStoreSystemLogs")) || [];
                    const dispatchedNoticeAlarmKeySet = JSON.parse(localStorage.getItem("dispatchedNoticeAlarmKeySet")) || [];
                    if (currentSystemAlarmLogs.length === 0) return;

                    const rightNow = new Date();
                    const currentTimeMatchKey = `${String(rightNow.getHours()).padStart(2, "0")}:${String(rightNow.getMinutes()).padStart(2, "0")}`;
                    const matchTargetAlarm = currentSystemAlarmLogs.find(
                        (log) => log && log.alarmTime && log.alarmTime.trim() === currentTimeMatchKey && !dispatchedNoticeAlarmKeySet.includes(`${log.uid}_${currentTimeMatchKey}`)
                    );

                    if (matchTargetAlarm) {
                        dispatchedNoticeAlarmKeySet.push(`${matchTargetAlarm.uid}_${currentTimeMatchKey}`);
                        localStorage.setItem("dispatchedNoticeAlarmKeySet", JSON.stringify(dispatchedNoticeAlarmKeySet));

                        const cronAlarmOverlay = document.createElement("div");
                        cronAlarmOverlay.setAttribute(
                            "style",
                            "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 21, 40, 0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; animation: blinkEffect 0.5s linear 6; padding: 20px; box-sizing: border-box;"
                        );

                        cronAlarmOverlay.innerHTML = `
                    <div style="background: #1e293b; border: 2px solid #ef4444; border-radius: 16px; width: 100%; max-width: 320px; padding: 24px 16px; text-align: center; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);">
                        <i class="fa-solid fa-bell-ring" style="font-size: 36px; color: #ef4444; margin-bottom: 12px; display: block;"></i>
                        <div style="color: #ffffff; font-weight: 800; font-size: 16px; margin-bottom: 8px;">[관리자 전산망 긴급 공지]</div>
                        <div style="color: #cbd5e1; font-size: 13.5px; line-height: 1.5; margin-bottom: 18px;">${matchTargetAlarm.content || "임상 스케줄에 맞춰 대기 및 출석바랍니다."}</div>
                        <button type="button" id="btn_cron_alarm_confirm_${matchTargetAlarm.uid}" style="width: 100%; max-width: 150px; height: 38px; background: #ef4444; color: #ffffff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">확인 완료</button>
                    </div>
                `;

                        document.body.appendChild(cronAlarmOverlay);
                        document.getElementById(`btn_cron_alarm_confirm_${matchTargetAlarm.uid}`).onclick = function (e) {
                            e.preventDefault();
                            cronAlarmOverlay.remove();
                        };
                    }
                }, 1000);
            }

            // =============================================================================
            // [항목 03 - 전반부] [트랙 B : 신규 및 180일 만료자] 스크리닝 카드 조출 및 2줄 주간 브리핑
            // =============================================================================
            if (isGhostUser) {
                let ghostWeekCardsHTML = "";

                records.forEach((item) => {
                    if (!item || !item.title) return;
                    const actualRawDate = item.examSchedule ? item.examSchedule.toString().trim() : "";

                    if (actualRawDate && actualRawDate.includes("-")) {
                        // [트랙 B 완벽 해결]: 날짜 문자열을 하이픈 기준으로 해체 분해
                        const srcParts = actualRawDate.split("-");
                        const targetParts = window.selectedDateStr.split("-");

                        // parseInt(..., 10)를 통해 앞자리 0패딩(04, 08 등) 변수 파편화를 완천 방어 소독
                        const srcYear = parseInt(srcParts[0], 10);
                        const srcMonth = parseInt(srcParts[1], 10);
                        const srcDay = parseInt(srcParts[2], 10);

                        const targetYear = parseInt(targetParts[0], 10);
                        const targetMonth = parseInt(targetParts, 10);
                        const targetDay = parseInt(targetParts, 10);

                        // 정수 데이터 기반의 마스터 비교 게이트웨이 개방
                        if (srcYear === targetYear && srcMonth === targetMonth && srcDay === targetDay) {
                            renderedCardCount++;
                            const targetThClass = (item.th || "1기").replace(/\s/g, "");

                            ghostWeekCardsHTML += `
                        <div class="trial-manifest-card" style="margin-bottom: 10px; border: 1px solid var(--border-color); background: #111827; padding: 14px; border-radius: 12px; text-align: left; box-shadow: 0 4px 6px 1px rgba(0, 0, 0, 0.5);">
                            <div class="card-top-row" style="padding-bottom: 2px;">
                                <div style="display: flex; flex-direction: column; gap: 5px; width: 100%;">
                                    <div style="font-size: 14px; color: #cbd5e1; font-weight: 700; display: flex; align-items: center; gap: 5px;">
                                        <span>${actualRawDate}</span><span style="color: #38bdf8; font-size: 13.5px; padding-left: 2px; font-weight: 800;">스크리닝</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 6px; margin-top: 1px;">
                                        <div class="card-title-text" style="color: #ffffff; font-weight: 800; font-size: 15px; letter-spacing: -0.2px;">${item.title || "임상과제"}</div>
                                        <span class="card-th-badge th-color-${targetThClass}" style="margin: 0 !important; transform: scale(0.95); font-weight: 800;">${item.th || "1기"}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-meta-grid" style="margin-top:8px; border-top: 1px dashed #1e293b; padding-top: 6px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5;">
                                <div>연계 과제: <span style="color: #38bdf8; font-weight: 700;">${item.title || "임상 과제명 미지정"}</span></div>
                                <div>배정 정원: <span>${item.count ? item.count + "명" : ""}</span></div>
                                <div>임상 기간: <span>${item.period ? item.period + "시간" : ""}</span></div>
                            </div>
                            <div class="card-action-bar" id="ui_action_bar_the_unique_${item.uid}" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px;">
                                <button type="button" class="card-btn join" id="btn_card_join_${item.uid}" style="height:32px; font-size: 12.5px; background: #0ea5e9 !important; color: #ffffff !important;">참여</button>
                                <button type="button" class="card-btn reject" id="btn_card_reject_${item.uid}" style="height:32px; font-size:12.5px; background: #475569;">미참여</button>
                                <button type="button" class="card-btn history-sync" id="btn_card_hist_${item.uid}" style="height:32px; font-size:12.5px;"><i class="fa-solid fa-clock-history"></i> 이력조회</button>
                            </div>
                        </div>
                    `;
                        }
                    }
                });

                // [신규 대상자 전용 2줄 레이아웃 나열 및 우측 공백 스캐너]
                let weeklyScheduleBriefingHTML = "";
                const daysMapShort = ["일", "월", "화", "수", "목", "금", "토"];

                weeklyKeys.forEach(dateKey => {
                    const dateObj = new Date(dateKey);
                    const bits = dateKey.split('-');
                    const formattedLabel = `${bits[0]}년 ${String(bits[1]).padStart(2, '0')}월 ${String(bits[2]).padStart(2, '0')}일 (${daysMapShort[dateObj.getDay()]})`;

                    const dayMatchedRecords = records.filter(r => {
                        if (!r || !r.examSchedule) return false;
                        const cleanSrcDate = r.examSchedule.toString().replace(/[^0-9-]/g, "").trim();
                        const cleanTargetKey = dateKey.toString().replace(/[^0-9-]/g, "").trim();
                        return cleanSrcDate === cleanTargetKey;
                    });

                    if (dayMatchedRecords.length > 0) {
                        dayMatchedRecords.forEach(matchItem => {
                            weeklyScheduleBriefingHTML += `
            <div class="briefing-row-item" style="margin-bottom: 12px; line-height: 1.5; text-align: left;">
                <div>• ${formattedLabel} : <span style="color: #38bdf8; font-weight: bold;">스크리닝</span></div>
                <div style="padding-left: 12px; color: #94a3b8; font-size: 13px; font-weight: 700;">${matchItem.title} ${(matchItem.th || "1기")}</div>
            </div>
            `;
                        });
                    } else {
                        weeklyScheduleBriefingHTML += `
        <div class="briefing-row-item" style="margin-bottom: 12px; text-align: left; color: rgba(255, 255, 255, 0.35);">
            • ${formattedLabel} : 
        </div>
        `;
                    }
                });

                let isAnyWeeklyScheduleExist = false;
                records.forEach(r => {
                    if (r && r.examSchedule && r.examSchedule.toString().includes("-")) {
                        const rParts = r.examSchedule.toString().trim().split("-");
                        const rYear = parseInt(rParts[0], 10);
                        const rMonth = parseInt(rParts, 10);
                        const rDay = parseInt(rParts, 10);

                        weeklyKeys.forEach(wKey => {
                            if (wKey.includes("-")) {
                                const wParts = wKey.split("-");
                                if (rYear === parseInt(wParts, 10) && rMonth === parseInt(wParts, 10) && rDay === parseInt(wParts, 10)) {
                                    isAnyWeeklyScheduleExist = true;
                                }
                            }
                        });
                    }
                });

                if (!isAnyWeeklyScheduleExist) {
                    cardBoard.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px; font-weight: 700;">이번주에 등록된 임상시험 일정이 없습니다.</div>`;
                    return;
                }

                // 주간 목록 타임라인 레일에 실시간 브리핑 HTML 정상 주입
                const weeklyTimelineRail = document.getElementById("weeklyTimelineBoard");
                if (weeklyTimelineRail) {
                    weeklyTimelineRail.innerHTML = weeklyScheduleBriefingHTML;
                }

                let totalOutHTML = "";
                if (renderedCardCount === 0 && window.isDayButtonClicked === true) {
                    totalOutHTML += `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px; margin-bottom: 15px; font-weight: 600;">선택하신 일자에는 임상시험 일정이 없습니다.</div>`;
                } else {
                    totalOutHTML += ghostWeekCardsHTML;
                }

                cardBoard.innerHTML = totalOutHTML;

                // =============================================================================
                // [항목 03 - 후반부] [트랙 B : 신규 및 180일 만료자] 3대 단추 비동기 액션 바인딩 및 부모 창 인터록 마감
                // =============================================================================
                setTimeout(() => {
                    // [런타임 크래시 예방 가드막 완착]: 비동기 데이터 적재 렉으로 인한 자바스크립트 엔진 정지 결함 원천 파쇄
                    if (!records || records.length === 0) return;

                    records.forEach((item) => {
                        if (!item || !item.uid) return;

                        // 1. 참여 버튼 클릭 시 트랜잭션 및 어드민 표준 단어 '대기' 전진 적재 커밋
                        const btnJoin = document.getElementById(`btn_card_join_${item.uid}`);
                        if (btnJoin) {
                            btnJoin.onclick = function (e) {
                                e.preventDefault();
                                let appDB = getApplicantData();
                                const liveQuotaCount = appDB.filter((u) => u && (u.title || "").toString().replace(/\s/g, "") === item.title.toString().replace(/\s/g, "")).length;
                                const liveProgressFormat = (liveQuotaCount + 1) + "/60";

                                const newApplicantRecord = {
                                    uid: "NEW_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
                                    name: localStorage.getItem("certifiedUserName") || currentCertifiedUser,
                                    title: item.title,
                                    th: item.th || "1기",
                                    count: liveProgressFormat,
                                    nCount: 60,
                                    period: item.period || "0",
                                    ssn: targetSsn,
                                    phone: localStorage.getItem("loggedInUserPhone") || "",
                                    gender: genderText === "남" ? "남" : "여",
                                    payStatus1: "대기", payStatus2: "대기", payStatus3: "대기", payStatus4: "대기",
                                    result: "대기", isDutyAgreed: "대기", isCallAgreed: "대기", category: "M인증",
                                    stage: "대기",   // 기획 사수 양식: 최초 인증 접수 시 '대기' 상태 커밋
                                    status: "대기",  // 기획 사수 양식: 최초 인증 접수 시 '대기' 상태 커밋
                                    regDate: new Date().toISOString().split("T")[0]
                                };

                                appDB.push(newApplicantRecord);
                                localStorage.setItem("dataStoreApplicant", JSON.stringify(appDB));

                                const signalToken = "SIGNAL_" + Date.now();
                                localStorage.setItem("msg_auth_signal", signalToken);
                                localStorage.setItem("msg_push_signal", signalToken);

                                alert(`[신청 접수완료]\n\n${newApplicantRecord.name} 대상자님, 선택하신 임상시험 [${item.title}] 과제 참여 신청이 정상 접수되었습니다.`);

                                // PC 마스터 관리자 화면(admin.html) 드롭다운 메뉴 및 테이블 참여상태를 순정 "대기" 배지로 실시간 연동 변화
                                if (window.opener && !window.opener.closed && typeof window.opener.refreshApplicantView === "function") {
                                    window.opener.refreshApplicantView();
                                }
                                if (typeof renderCalendar === "function") renderCalendar();
                                renderDailyCards();
                            };
                        }

                        // 2. 미참여 거절 버튼 피드백 처리
                        const btnReject = document.getElementById(`btn_card_reject_${item.uid}`);
                        if (btnReject) {
                            btnReject.onclick = function (e) {
                                e.preventDefault();
                                alert("미참여 신청 되었습니다.");
                            };
                        }

                        // 3. 모바일 전용 개별 이력조회 모달 시스템 호출 결착
                        const btnHist = document.getElementById(`btn_card_hist_${item.uid}`);
                        if (btnHist) {
                            btnHist.onclick = function (e) {
                                e.preventDefault();
                                if (typeof openIndividualHistoryModalInMobile === "function") {
                                    openIndividualHistoryModalInMobile(cleanSessionName, item.title, item.th || "1기");
                                }
                            };
                        }
                    });
                }, 0);
                return; // 트랙 B 격리 방어선 마감 및 완전 이탈
            }

            // =============================================================================
            // [항목 04] [트랙 A : 기존 참여 대상자] 순정 6대 마일스톤 매핑 및 1줄 레이아웃 하이픈(-) 주간 목록 브리핑 팩토리
            // =============================================================================
            else {
                if (!myLiveJobRecord) {
                    cardBoard.innerHTML = `
                <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; padding: 24px 16px; border-radius: 14px; margin-bottom: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 26px; color: var(--text-muted); margin-bottom: 10px; display: block;"></i>
                    <div style="color:var(--text-color); font-weight: 700; font-size: 14px; margin-bottom: 4px;">배정된 임상시험 정보가 없습니다.</div>
                    <div style="color:var(--text-muted); font-size: 12px; font-weight: 500; line-height: 1.4;">
                        대상자님은 현재 참여 중이거나 전산 심사 대기 중인 <br> 임상시험 과제 일정이 존재하지 않습니다.
                    </div>
                </div>
            `;
                    return;
                }

                const matchedRecruitmentItem = records.find(item => {
                    if (!item || !item.title || !myLiveJobRecord.title) return false;
                    return myLiveJobRecord.title.toString().replace(/\s/g, "").toLowerCase() === item.title.toString().replace(/\s/g, "").toLowerCase();
                });

                let regularCardsHTML = "";
                let weeklyScheduleBriefingHtml = "";
                const daysMapShort = ['일', '월', '화', '수', '목', '금', '토'];
                let hasWeeklyScheduleInThisWindow = false;

                if (weeklyKeys && weeklyKeys.length > 0) {
                    weeklyKeys.forEach(dateKey => {
                        let activeStages = [];
                        const cleankey = dateKey.trim();

                        if (matchedRecruitmentItem) {
                            if (matchedRecruitmentItem.examSchedule && matchedRecruitmentItem.examSchedule.trim() === cleankey) activeStages.push("스크리닝");
                            // [어드민 고정 옵션 단어 싱크]: "소집(입원)" -> "소집" 규격 일치화 수술 완착
                            if (matchedRecruitmentItem.recDate && matchedRecruitmentItem.recDate.trim() === cleankey) activeStages.push("소집");
                            if (matchedRecruitmentItem.visitDate1 && matchedRecruitmentItem.visitDate1.trim() === cleankey) activeStages.push("1차방문");
                            if (matchedRecruitmentItem.visitDate2 && matchedRecruitmentItem.visitDate2.trim() === cleankey) activeStages.push("2차방문");
                            if (matchedRecruitmentItem.visitDate3 && matchedRecruitmentItem.visitDate3.trim() === cleankey) activeStages.push("3차방문");
                            if (matchedRecruitmentItem.visitDate4 && matchedRecruitmentItem.visitDate4.trim() === cleankey) activeStages.push("4차방문");
                            // [어드민 고정 옵션 단어 싱크]: "종료검사" -> "종료방문" 규격 일치화 수술 완착
                            if (matchedRecruitmentItem.endExamDate && matchedRecruitmentItem.endExamDate.trim() === cleankey) activeStages.push("종료방문");
                        }

                        if (activeStages.length > 0) hasWeeklyScheduleInThisWindow = true;

                        // [날짜 배열 인덱싱 수리 완착]: 하이픈 단위 분해 및 배열 첨자 지정 정제
                        const dateParts = cleankey.split("-");
                        const loopDateObj = new Date(
                            parseInt(dateParts[0], 10),
                            parseInt(dateParts[1], 10) - 1,
                            parseInt(dateParts[2], 10)
                        );

                        // [기획 요구사항 반영]: 주간 일정 목록 포맷터의 연, 월, 일을 칼같이 2자리 숫자로 강제 0패딩 정렬
                        const formattedLabel = `${String(dateParts[0]).padStart(4, "0")}년 ${String(dateParts[1]).padStart(2, "0")}월 ${String(dateParts[2]).padStart(2, "0")}일 (${daysMapShort[loopDateObj.getDay()]})`;

                        if (activeStages.length > 0) {
                            const combinedStages = activeStages.join(", ");
                            weeklyScheduleBriefingHtml += `
                        <div class="briefing-row-item" style="margin-bottom: 12px; padding: 4px 0; font-size: 13px; text-align:left;">
                            • ${formattedLabel} : <span style="color:#38bdf8; font-weight:800;">${combinedStages}</span>
                        </div>
                    `;

                            // [문제 완벽 해결 - 4-8 = 04-08 정수형 날짜 일치화 소독 가드막]
                            const srcParts = cleankey.split("-");
                            const targetParts = window.selectedDateStr.split("-");

                            // 각 요소를 정수로 강제 변환하여 앞자리 0패딩(04, 08 등) 찌꺼기 편차를 전면 소멸
                            const srcYear = parseInt(srcParts[0], 10);
                            const srcMonth = parseInt(srcParts[1], 10);
                            const srcDay = parseInt(srcParts[2], 10);

                            const targetYear = parseInt(targetParts[0], 10);
                            const targetMonth = parseInt(targetParts[1], 10);
                            const targetDay = parseInt(targetParts[2], 10);

                            // 수학적 크로스 오프셋 비교 게이트 전개
                            if (srcYear === targetYear && srcMonth === targetMonth && srcDay === targetDay) {
                                activeStages.forEach((stageLabel, sIdx) => {
                                    renderedCardCount++;
                                    const uniqueSubKey = `${matchedRecruitmentItem.uid}_REG_${sIdx}`;

                                    // [인프라 싱크]: 변수 추출 렉 차단 및 대조 문자열 공백 정세 소독 완착
                                    const currentLiveStageToken = (myLiveJobRecord.stage || myLiveJobRecord.status || "").toString().trim().replace(/\s/g, "");

                                    if (stageLabel.includes("스크리닝")) {
                                        const isScreeningDone = !["신검대기", "스크리닝", "text대기"].includes(currentLiveStageToken);
                                        regularCardsHTML += `
                                     <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed ${isScreeningDone ? 'var(--success-color)' : 'var(--border-color)'}; border-radius: 14px; margin-bottom: 10px;">
                                     <i class="fa-solid fa-circle-check" style="font-size: 24px; color: ${isScreeningDone ? 'var(--success-color)' : '#38bdf8'}; margin-bottom: 8px; display: block;"></i>
                                     <div style="font-size: 12.5px; color: ${isScreeningDone ? 'var(--success-color)' : '#38bdf8'}; font-weight: 600;">${isScreeningDone ? '스크리닝 완료' : '현재 스크리닝 참여중입니다'}</div>
                                     </div>
                                    `;
                                    } else if (stageLabel === "소집") {
                                        const isCallDone = !["신검대기", "스크리닝", "text대기", "신검통과", "소집"].includes(currentLiveStageToken);
                                        regularCardsHTML += `
                                     <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed ${isCallDone ? 'var(--success-color)' : 'var(--border-color)'}; border-radius: 14px; margin-bottom: 10px;">
                                     <i class="fa-solid fa-circle-check" style="font-size: 24px; color: ${isCallDone ? 'var(--success-color)' : '#fbbf24'}; margin-bottom: 8px; display: block;"></i>
                                     <div style="font-size: 12.5px; color: ${isCallDone ? 'var(--success-color)' : '#fbbf24'}; font-weight: 600;">${isCallDone ? '소집 완료' : '현재 소집 참여중입니다'}</div>
                                     </div>
                                    `;
                                    } else {
                                        const milestoneSequence = ["신검대기", "스크리닝", "text대기", "신검통과", "소집", "1차방문", "2차방문", "3차방문", "4차방문", "종료방문", "1기종료", "2기종료", "3기종료", "4기종료", "종료"];
                                        const idxUser = milestoneSequence.indexOf(currentLiveStageToken);
                                        const idxCard = milestoneSequence.indexOf(stageLabel);
                                        if (idxUser > idxCard && idxCard !== -1) {
                                            regularCardsHTML += `
                                    <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--success-color); border-radius: 14px; margin-bottom: 10px;">
                                         <i class="fa-solid fa-circle-check" style="font-size: 24px; color: var(--success-color); margin-bottom: 8px; display: block;"></i>
                                    <div style="font-size: 12.5px; color: var(--success-color); font-weight: 600;">${stageLabel} 완료</div>
                                    </div>
                                     `;
                                        } else {
                                            regularCardsHTML += `
                                    <div class="trial-manifest-card" style="margin-bottom: 10px; border: 1px solid var(--border-color); background: #111827; padding: 14px; border-radius: 12px; text-align: left; box-shadow: 0 4px 6px 1px rgba(0, 0, 0, 0.5);">
                                        <div class="card-top-row">
                                            <div class="card-title-text" style="color: #ffffff; font-weight: 800; font-size: 14.5px;">${stageLabel}</div>
                                        </div>
                                        <div class="card-meta-grid" style="margin-top:8px; border-top: 1px dashed #1e293b; padding-top: 6px; font-size:12.5px; color:var(--text-muted);">
                                            <div>연계 과제: <span style="color: #38bdf8; font-weight: 700;">${matchedRecruitmentItem.title}</span></div>
                                        </div>
                                        <div class="card-action-bar" id="ui_action_bar_the_unique_${uniqueSubKey}" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px;">
                                            <button type="button" class="card-btn join" id="btn_card_join_${uniqueSubKey}" style="height: 32px; font-size: 12.5px;">참여</button>
                                            <button type="button" class="card-btn reject" id="btn_card_reject_${uniqueSubKey}" style="height: 32px; font-size:12.5px; background: #475569;">미참여</button>
                                            <button type="button" class="card-btn history-sync" id="btn_card_hist_${uniqueSubKey}" style="height:32px; font-size:12.5px;"><i class="fa-solid fa-clock-history"></i>이력조회</button>
                                        </div>
                                    </div>
                                    `;
                                        }
                                    }
                                });
                            }
                        } else {
                            // [기획 요구사항 완벽 반영]: 임상 스케줄이 비어있는 빈 날짜는 우측 영역에 깨끗하게 하이픈(: -) 마킹 나열
                            weeklyScheduleBriefingHtml += `
                        <div class="briefing-row-item" style="margin-bottom: 12px; padding: 4px 0; font-size: 12px; color: rgba(255,255,255,0.35); text-align:left;">
                            <span>• ${formattedLabel} : </span><span style="font-weight: 500; color: rgba(255,255,255,0.2);">-</span>
                        </div>
                    `;
                        }
                    }); // weeklyKeys.forEach 마감
                }

                // =============================================================================
                // [항목 04 - 후반부] [트랙 A : 기존 참여 대상자] 주간 잔상 차단 및 3대 버튼 비동기 마스터 연동 커밋반
                // =============================================================================
                if (!hasWeeklyScheduleInThisWindow) {
                    cardBoard.innerHTML = `
                <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px solid var(--border-color); border-radius: 14px; font-weight: 700;">
                    <i class="fa-solid fa-calendar-minus" style="font-size: 24px; color: #eab308; margin-bottom: 8px; display: block;"></i>
                    <div style="font-size: 12px; color: #eab308; font-weight: 700;">이번주에 등록된 임상시험 일정이 없습니다.</div>
                </div>
            `;
                    return;
                }

                let totalOutHTML = "";
                // [초기 주간 뷰 경고문 삭제 가드]: 사용자가 요일 단추를 직접 클릭했을 때만(window.isDayButtonClicked === true) 개별 일자 경고 박스 사출
                if (renderedCardCount === 0 && window.isDayButtonClicked === true) {
                    totalOutHTML += `
                <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 10px; background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 14px; margin-bottom: 15px; font-weight: 600; color: #38bdf8;">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 24px; color: #94a3b8; margin-bottom: 8px; display: block;"></i>
                    <div style="font-size: 12.5px; color: #38bdf8; font-weight: 600;">선택하신 일자에는 임상시험 일정이 없습니다.</div>
                </div>
            `;
                } else {
                    totalOutHTML += regularCardsHTML;
                }

                // [문제 02 완벽 해결 - 주간 목록 잔상 원천 차단 장벽]: 요일 선택 상태에서는 하단 주간 통합 브리핑 브래킷 블록의 유입을 원천 봉쇄함
                if (!window.isDayButtonClicked) {
                    totalOutHTML += `
                <div style="background: var(--card-color); padding: 14px; border-radius: 14px; width: 100%; border:1px solid var(--border-color); box-shadow:0 4px 6px rgba(0,0,0,0.3); margin-top: 10px;">
                    <div style="font-size: 13px; font-weight:800; color:var(--warning-color); margin-bottom: 12px; display: flex; align-items:center; gap:6px;">
                        <i class="fa-solid fa-list-check"></i> 해당 주간 임상 일정
                    </div>
                    <div style="display: flex; flex-direction: column; gap:2px;">
                        ${weeklyScheduleBriefingHtml}
                    </div>
                </div>
            `;
                }

                cardBoard.innerHTML = totalOutHTML;

                // [트랙 A 전용 비동기 3대 단추 액션 마스터 바인딩 및 어드민 실시간 상태 연동 커밋반]
                setTimeout(() => {
                    // [런타임 크래시 예방 가드막 완착]: 객체 누락 시 예외 필터링을 거치게 유도하여 캘린더 엔진 정지 결함 원천 파쇄
                    if (!myLiveJobRecord || !myLiveJobRecord.title) return;

                    const currentActiveRecords = records.filter(
                        (item) => item && item.title && myLiveJobRecord.title.toString().replace(/\s/g, "").toLowerCase() === item.title.toString().replace(/\s/g, "").toLowerCase()
                    );

                    currentActiveRecords.forEach((item) => {
                        const thText = (item.th || "1기").trim();

                        // [어드민 고정 옵션 표준 단어 싱크 마일스톤 매핑 리스트 동기화 완착]
                        const originalMilestones = [
                            { label: "스크리닝" },
                            { label: "소집" },
                            { label: "1차방문" },
                            { label: "2차방문" },
                            { label: "3차방문" },
                            { label: "4차방문" },
                            { label: "종료방문" }
                        ];

                        originalMilestones.forEach((schedule, idx) => {
                            // [ID 오프셋 단선 결함 수리 완료]: 상단 카드 사출 공장 규격(matchedRecruitmentItem.uid)과 식별 단추 추적 축을 100% 동기화
                            const uniqueSubKey = `${matchedRecruitmentItem.uid}_REG_${idx}`;

                            // 1. 참여 버튼 클릭 시 출석 전진 업데이트 및 관제탑(admin.html) 참여상태 실시간 연동 변화
                            const btnJoin = document.getElementById(`btn_card_join_${uniqueSubKey}`);
                            if (btnJoin) {
                                btnJoin.onclick = function (e) {
                                    e.preventDefault();
                                    let appDB = getApplicantData();
                                    let targetIdx = appDB.findIndex(
                                        (u) => u.name.toString().trim().replace(/\s/g, "") === cleanSessionName
                                    );

                                    if (targetIdx !== -1) {
                                        // 어드민 드롭다운 옵션 양식과 토시 하나 안 틀리게 동기화 전진 처리 커밋
                                        let cleanFriendlyStage = schedule.label;

                                        appDB[targetIdx].status = cleanFriendlyStage;
                                        appDB[targetIdx].stage = cleanFriendlyStage;
                                        localStorage.setItem("dataStoreApplicant", JSON.stringify(appDB));

                                        // 5대 파일 무선 제어반 통신 패킷 발송
                                        const signalToken = "SIGNAL_" + Date.now();
                                        localStorage.setItem("msg_auth_signal", signalToken);
                                        localStorage.setItem("msg_push_signal", signalToken);

                                        alert(`인증 성공\n\n대상자님의 참여 상태가 [${cleanFriendlyStage}] 단계로 출석 정상 업데이트 커밋되었습니다.`);

                                        // PC 마스터 관리자 화면(admin.html) 목록 및 #form-app-stage 드롭다운 메뉴 즉시 실시간 강제 리프레시 변화
                                        if (
                                            window.opener &&
                                            !window.opener.closed &&
                                            typeof window.opener.refreshApplicantView === "function"
                                        ) {
                                            window.opener.refreshApplicantView();
                                        }

                                        if (typeof renderCalendar === "function") renderCalendar();
                                        renderDailyCards();
                                    }
                                };
                            }

                            // 2. 미참여 거절 버튼 피드백 처리
                            const btnReject = document.getElementById(`btn_card_reject_${uniqueSubKey}`);
                            if (btnReject) {
                                btnReject.onclick = function (e) {
                                    e.preventDefault();
                                    alert("미참여 신청 되었습니다.");
                                };
                            }

                            // 3. 모바일 전용 개별 이력조회 모달 시스템 호출 결착
                            const btnHist = document.getElementById(`btn_card_hist_${uniqueSubKey}`);
                            if (btnHist) {
                                btnHist.onclick = function (e) {
                                    e.preventDefault();
                                    if (typeof openIndividualHistoryModalInMobile === "function") {
                                        openIndividualHistoryModalInMobile(cleanSessionName, item.title, thText);
                                    }
                                };
                            }
                        }); // originalMilestones.forEach 마감
                    }); // currentActiveRecords.forEach 마감
                }, 0); // setTimeout 마감
            } // else 블록 최종 마감
        }

        // =============================================================================
        // [인프라 복원 매립] 주간 달력 요일 단추 터치 이벤트 리스너 인터록 엔진 (단독 상주)
        // =============================================================================
        function attachCalendarDayClickEvents() {
            const dayButtons = document.querySelectorAll('.weekly-day-btn, .calendar-day-item');
            if (!dayButtons || dayButtons.length === 0) return;

            dayButtons.forEach(btn => {
                btn.addEventListener('click', function (e) {
                    // 사용자가 요일을 직접 선택했음을 알리는 플래그를 정밀 각인 (예외 문구 중복 노출 파쇄용)
                    window.isDayButtonClicked = true;

                    // 단추에 박혀있는 가상 데이터 속성(data-date="2026-12-04") 추출 및 전역 동기화
                    const targetClickedRawDate = this.getAttribute('data-date') || "";
                    if (targetClickedRawDate && targetClickedRawDate.includes("-")) {
                        window.selectedDateStr = targetClickedRawDate.trim();

                        // 액션 카드 섹션 조출 공장 강제 리렌더링 가동 (선택 요일 카드 정순 사출)
                        renderDailyCards();
                    }
                });
            });
        }

        //참여누적 이력조회 ㅇ
        function openIndividualHistoryModalInMobile(currentSessionName, targetTitle, targetTh) {
            let applicantDB = getApplicantData();
            const scrollZone = document.getElementById("modal-history-scroll-zone");
            if (!scrollZone) return; scrollZone.innerHTML = "";
            const rawHistoryRecords = applicantDB.filter(item => (item.name || "").toString().trim() === currentSessionName);
            document.getElementById("m-history-count-title").innerText = `참여 누적 내역 (${rawHistoryRecords.length}건)`;

            if (rawHistoryRecords.length === 0) {
                scrollZone.innerHTML = '<div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding: 20px 0;">연동된 대상자 이력 내역이 존재하지 않습니다.</div>';
            } else {
                rawHistoryRecords.forEach(row => {
                    const isCurrentJob = ((row.title || "").toString().trim() === targetTitle && (row.th || "").toString().trim() === targetTh);
                    const miniCard = document.createElement("div");
                    miniCard.className = isCurrentJob ? "history-mini-card current-job" : "history-mini-card";

                    let prefixTag = isCurrentJob ? `<span style="color:var(--secondary-color); font-weight: 800; margin-right: 4px;">[현재시험]</span>` : `<span style="color:var(--text-muted); font-weight:700; margin-right: 4px;">[과거시험]</span>`;
                    let currentPayStatus = row.status || "대기";

                    miniCard.innerHTML = `
                <div style="text-align:left;">
                    <div style="font-size:12px; font-weight:700; color:#ffffff; margin-bottom:2px;">${prefixTag}${row.name || '대상자'} ${row.title || '미지정과제'}</div>
                    <div style="font-size:11px; color:var(--text-muted);">진행기수 : <span style="color:#fff;">${row.th || '-'}</span> | 현재단계: <span style="color: #38bdf8; font-weight:700;">${currentPayStatus}</span></div>
                </div>
            `;
                    scrollZone.appendChild(miniCard);
                });
            }
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: flex !important;');
        }

        window.closeDetailModal = function () {
            const overlay = document.getElementById('detailModalOverlay');
            if (overlay) overlay.setAttribute('style', 'display: none !important;');
        };

        // ==========================================================================
        // 🔒 [가변 유저 대응형 최종 완착] 독립 기동 즉시 진짜 내 세션 가로채기 3중 수신소
        // ==========================================================================
        window.onload = function () {
            // [가변 유저 대응형 최종 완착] 독립 기동 즉시 진짜 내 세션 가로채기 3중 수신소
            let logUserStr = localStorage.getItem('loggedInUser');

            // [정밀 타격 급소 교정 1]: 구형 객체 수색을 파쇄하고 실시간 진짜 로그인 유저명 키값 1순위 직격 가로채기
            let activeTargetName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || "";
            let logUserSsn = localStorage.getItem('loggedInUserSsn') || "";

            if (logUserStr) {
                try {
                    // [정밀 타격 급소 교정 2]: JSON parse 오탈자 소독 및 안전 파싱 수술
                    let parsedLogUser = JSON.parse(logUserStr);
                    if (parsedLogUser) {
                        if (parsedLogUser.name && !activeTargetName) {
                            activeTargetName = parsedLogUser.name.toString().trim();
                        }
                        // 주 데이터 원장에 ssn이 존재할 경우 가짜 더미가 끼어들 여지를 완전 차단
                        if (parsedLogUser.ssn && !logUserSsn) {
                            logUserSsn = parsedLogUser.ssn.toString().trim();
                        }
                    }
                } catch (e) {
                    console.error("[전산 오류] 자식 달력 내부 성명 캐시 해독 실패:", e);
                }
            }

            // [풀백 가드 교정]: 시스템 오인을 유도하던 "홍길동" 단어를 전면 소독하고 유연한 가드로 대체
            if (!activeTargetName || activeTargetName === "홍길동") {
                activeTargetName = localStorage.getItem('certifiedUserName') || sessionStorage.getItem('certifiedUserName') || "인증 대상자";
            }

            // 주 데이터 캐시와 개별 스토리지에서 모두 누락되었을 때만 완전히 비워서 비정상 출력을 차단
            if (!logUserSsn) {
                logUserSsn = localStorage.getItem('loggedInUserSsn') || "";
            }
            sessionStorage.setItem('certifiedUserName', activeTargetName);

            // [정밀 수술 완수 구역]: 가짜 데이터(851023)와 뒤집히는 성별 로직을 완전히 청소
            const cleanSsn = logUserSsn.replace(/[^0-9a-zA-Z]/g, "");

            // 주민번호 원장이 들어와 있을 때만 6자리를 안전하게 자르고, 비어있다면 가짜 숫자 대신 공백("") 처리
            const displayBirth6 = cleanSsn.length >= 6 ? cleanSsn.substring(0, 6) : "";

            let genderText = "-";
            let genderClass = "gender-indicator-badge";

            if (cleanSsn.length >= 7) {
                // 하이픈이 소독된 상태이므로 정확히 7번째 자리(인덱스 6)의 문자 조각을 고정 래핑 추출
                const genderMarker = cleanSsn.charAt(6).toUpperCase();

                // 대한민국 표준 주민등록번호 정책 마킹 바인딩 (1, 3, 5, M = 남성 / 2, 4, 6, F = 여성)
                if (["1", "3", "5", "M"].includes(genderMarker)) {
                    genderText = "남";
                    genderClass = "gender-indicator-badge gender-m";
                } else if (["2", "4", "6", "F"].includes(genderMarker)) {
                    genderText = "여";
                    genderClass = "gender-indicator-badge gender-f";
                }
            } else if (cleanSsn.length > 0) {
                // 데이터 전송 타이밍 차이로 생년월일만 먼저 로드된 임시 상태 가드
                genderText = "확인중";
                genderClass = "gender-indicator-badge gender-wait";
            }

            // 상단 네온 프로필 팩토리 바인딩 동기화 완료
            const selfTargetSlot = document.getElementById('lblSetTargetNew') || (window.parent ? window.parent.document.getElementById('lblSetTargetNew') : null);
            if (selfTargetSlot) {
                selfTargetSlot.innerHTML = `
            <span style="color:#ffffff; font-weight:800;">${activeTargetName}</span>
            <span style="color:rgba(255, 255, 255, 0.4); font-weight: 500; margin-left:2px;">(${displayBirth6})</span>
            <span class="${genderClass}" style="margin-left: 5px; padding:1px 5px; border-radius: 4px; font-size:11px; font-weight: 800; display: inline-block; line-height:1.3;">${genderText}</span>
        `;
            }

            if (typeof renderCalendar === "function") { renderCalendar(); }
        };

    </script>
</body>

</html>
