<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상시험 일정관리</title>
    <!-- 아이콘 팩 연동 (안정적인 구동 방어) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ========================================================
1. 글로벌 디자인 시스템 컬러 변수 및 모바일 주소창 방어 락인
======================================================== */
        :root {
            --bg-color: #0b0f19;
            --card-color: #1a233a;
            --border-color: #334155;
            --secondary-color: #0ea5e9;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* 📱 html과 body의 실제 가용 면적을 모바일 스크린 비율과 100% 동기화 (주소창 밀림 방어) */
        html,
        body {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            letter-spacing: -0.3px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px 10px !important;
            /* 📱 좁은 모바일 화면 공간 극대화를 위한 슬림 패딩 */
            display: flex;
            flex-direction: column;
        }

        /* ========================================================
         2. 상단 타이틀 및 모바일 최적화 툴바 구역
        ======================================================== */
        .header-container {
            display: flex;
            flex-direction: column;
            /* 📱 세로 배치 정렬로 뷰포트 횡공간 확장 방어 */
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .calendar-title {
            font-size: 16px !important;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            /* 📱 3대 버튼 균등 분할 터치 레이아웃 */
            text-align: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px !important;
            font-weight: 700;
            color: #fff;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .tool-btn.active {
            background: var(--secondary-color);
            color: #0b0f19;
            border-color: var(--secondary-color);
        }

        /* ========================================================
3. [구조 대혁명] 단일행 주간(7일) 타임라인 바 시스템
======================================================== */
        .weekly-timeline-bar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            /* 📱 일~토 7일간의 날짜 칸만 한 줄 고정 사출 */
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        /* 주간 날짜 개별 단추 디자인 */
        .weekly-day-btn {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .weekly-day-btn .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .weekly-day-btn .day-date {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 📱 오늘 일자 혹은 실실시간 대상자가 터치해 선택한 요일 활성화 스킨 */
        .weekly-day-btn.active {
            background: rgba(14, 165, 233, 0.15) !important;
            border-color: var(--secondary-color) !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .weekly-day-btn.active .day-name,
        .weekly-day-btn.active .day-date {
            color: var(--secondary-color) !important;
        }

        /* 📱 일요일(레드) 및 토요일(블루) 모바일 컬러 아이덴티티 보존 */
        .weekly-day-btn:nth-child(1) .day-date {
            color: #f87171;
        }

        .weekly-day-btn:nth-child(7) .day-date {
            color: #60a5fa;
        }

        /* ========================================================
4. [구조 대혁명] 당일 소집 과제 대형 세로 스크롤 카드 레일 존
======================================================== */
        .daily-card-scroll-zone {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            /* 📱 모바일 가속 터치 부드러운 스크롤 탑재 */
        }

        /* 📱 하루 최대 5개 이상 과제 중첩 시에도 시원시원하게 스크롤되는 대형 카드 컴포넌트 */
        .trial-manifest-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .card-title-text {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
            flex: 1;
            padding-right: 8px;
        }

        /* 📱 모집공고 고대비 4색 라벨 배지 모바일화 계승 */
        .card-th-badge {
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px;
            font-weight: 800;
            white-space: nowrap;
        }

        .th-color-1기 {
            background: rgba(148, 163, 184, 0.12) !important;
            border: 1px solid #94a3b8 !important;
            color: #f8fafc !important;
        }

        .th-color-2기 {
            background: rgba(14, 165, 233, 0.15) !important;
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
        }

        .th-color-3기 {
            background: rgba(74, 222, 128, 0.15) !important;
            border: 1px solid #22c55e !important;
            color: #4ade80 !important;
        }

        .th-color-4기 {
            background: rgba(245, 158, 11, 0.15) !important;
            border: 1px solid #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* 메타 정보 2열 격자 배치 */
        .card-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .card-meta-grid span {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* 카드 하단 직장 일체형 터치 액션 버튼 바 레일 */
        .card-action-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .card-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .card-btn.join {
            background: var(--success-color);
            color: #070a12;
        }

        .card-btn.reject {
            background: var(--danger-color);
            color: #ffffff;
        }

        .card-btn.close {
            background: #334155;
            color: #ffffff;
        }

        /* ========================================================
5. 하단 고정 모바일 가이드 라벨 패널 스킨
======================================================== */
        .bottom-guide-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            height: 95px;
            /* 📱 소프트 키보드 유입 시 터짐 방지 압축 스킨 */
            flex-shrink: 0;
        }

        .white-dictionary-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .notice-list-wrapper {
            font-size: 10px !important;
            color: var(--text-muted);
            line-height: 1.3;
            padding-left: 12px;
        }

        /* ========================================================
6. 모바일 대상자 마스터 누적 이력조회 대형 모달 (100% 보존 수리)
======================================================== */
        .calendar-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .calendar-modal-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 94%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-history-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--warning-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-history-scroll-zone {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-mini-card {
            background: #161e30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .history-mini-card.current-job {
            border-left-color: var(--secondary-color);
            background: rgba(14, 165, 233, 0.04);
        }

        .daily-card-scroll-zone::-webkit-scrollbar,
        .modal-history-scroll-zone::-webkit-scrollbar {
            width: 3px;
        }

        .daily-card-scroll-zone::-webkit-scrollbar-thumb,
        .modal-history-scroll-zone::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }



        /* ========================================================
   . 과거 참여 이력조회 독립 모달 하단 버튼 전용 스킨
   ======================================================== */
        .modal-btn-group-row {
            display: flex !important;
            width: 100% !important;
            margin-top: 14px !important;
            gap: 8px !important;
            box-sizing: border-box !important;
        }

        .modal-act-btn {
            width: 100% !important;
            padding: 12px 10px !important;
            /* 📱 모바일 터치 반경 최적화를 위한 넉넉한 세로폭 배정 */
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 800 !important;
            text-align: center !important;
            cursor: pointer !important;
            transition: background 0.15s ease;
        }

        .modal-act-btn.btn-close {
            background: #334155 !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }

        .modal-act-btn.btn-close:active {
            background: #1e293b !important;
        }


        /* ========================================================
   [교정 추가] 2. 연월 가이드 바 컨트롤러 모바일 플렉스 정렬 스킨
   ======================================================== */
        .month-controller {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px !important;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .month-btn {
            background: none !important;
            border: none !important;
            color: var(--secondary-color) !important;
            font-size: 15px !important;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 8px !important;
            transition: transform 0.1s ease;
        }

        .month-btn:active {
            transform: scale(0.85);
        }

        .month-label {
            font-size: 14px !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }
    </style>

</head>

<body>
    <!-- 1. 상단 모바일 기수 타이틀 및 유연한 3대 압축 툴바 구역 -->
    <div class="header-container">
        <div class="calendar-title">
            <i class="fa-solid fa-calendar-days"></i> 임상시험 스케줄러 (주간 관제)
        </div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn active" id="btnFilterAll">전체 일정</button>
            <button type="button" class="tool-btn" onclick="executeDownload()"><i
                    class="fa-solid fa-file-arrow-down"></i> 시험현황</button>
            <button type="button" class="tool-btn" onclick="window.print()"><i class="fa-solid fa-print"></i>
                인쇄/PDF저장</button>
        </div>
    </div>

    <!-- 2. 월 및 연도 가이드 바 컨트롤러 (모바일 양 끝단 배치 구조) -->
    <div class="month-controller">
        <button type="button" class="month-btn" onclick="moveMonth(-1)">◀</button>
        <span class="month-label" id="currentMonthLabel">2026년 09월</span>
        <button type="button" class="month-btn" onclick="moveMonth(1)">▶</button>
    </div>

    <!-- 3. [대개혁 핵심] 상단 1행 고정형 주간(7일) 단일 날짜 선택 타임라인 레일 바 -->
    <!-- 자바스크립트 엔진에 의해 일요일부터 토요일까지 7일간의 날짜 조각이 주입됩니다 -->
    <div class="weekly-timeline-bar" id="weeklyTimelineBoard"></div>

    <!-- 4. [대개혁 핵심] 하루 최대 5개 이상의 복잡 과제가 겹쳐도 완벽히 분사하는 세로 스크롤 카드 레일 랙 -->
    <!-- 상단 주간 바에서 선택한 날짜와 실시간 매칭되는 당일 시험 공고 카드들이 세로로 대형 사출됩니다 -->
    <div class="daily-card-scroll-zone" id="dailyCardBoard"></div>

    <!-- 5. 하단 고정 가이드라인 패널 (모바일 10px 슬림 가이드 패킹) -->
    <div class="bottom-guide-panel">
        <div class="white-dictionary-box">
            <i class="fa-solid fa-book-medical"></i> CTMS 주간 모바일 안내 센터
        </div>
        <ol class="notice-list-wrapper">
            <li>상단 7일 주간 바에서 날짜를 선택하시면 당일 진행 과제 카드가 아래에 정밀 정렬됩니다.</li>
            <li>[과거 참여 이력] 배지 선택 시 대상자의 참여 마스터 누적 내역이 실시간 자동 추적 사출됩니다.</li>
        </ol>
    </div>

    <!-- 6. [대수술 완수] 과거 참여 이력조회 대형 누적 모달 프레임 구역 (원본 스펙 100% 무결성 결합) -->
    <div class="calendar-modal-overlay" id="detailModalOverlay" onclick="closeDetailModal(event)">
        <div class="calendar-modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-popup-type">
                    <i class="fa-solid fa-clock-history"></i> 대상자 마스터 참여 이력 관제탑
                </div>
                <button type="button" class="modal-close-x"
                    onclick="document.getElementById('detailModalOverlay').setAttribute('style', 'display: none !important;')">✕</button>
            </div>

            <!-- 대상자 과거 참여 이력 누적 카드 사출 스크롤 존 -->
            <div class="modal-history-title">
                <i class="fa-solid fa-folder-tree"></i> <span id="m-history-count-title">참여 누적 내역 (0건)</span>
            </div>
            <div class="modal-history-scroll-zone" id="modal-history-scroll-zone">
                <!-- 자바스크립트 팩토리에 의해 대상자 관리 내역 카드가 모바일 전용 세로형으로 단독 사출됩니다 -->
            </div>

            <!-- 모바일 손가락 반경 최적화 닫기 단추 레일 -->
            <div class="modal-btn-group-row" style="grid-template-columns: 1fr;">
                <button type="button" class="modal-act-btn btn-close" onclick="closeDetailModal()"
                    style="background: #334155; color: #ffffff; width: 100%;">이력 화면 닫기</button>
            </div>
        </div>
    </div>


    <script>
        // 1. 달력 주간 변수 및 선택 날짜 실시간 정밀 추적 포인터 장전 [원본 100% 무결 보존]
        let currentDate = new Date();
        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');

        // 하이픈 포맷팅 규칙을 철저히 결합하여 디폴트 오늘 날짜 락포인터 자동 산출
        let selectedDateStr = `${yyyy}-${mm}-${dd}`;
        let currentCertifiedUser = sessionStorage.getItem('certifiedUserName') || "";

        /**
         * 2. 메인 대시보드(admin.html)의 로컬스토리지 임상시험 모집공고 마스터 원장 스트림 연동
         */
        function getMasterData() {
            return JSON.parse(localStorage.getItem('dataStoreRecruitment')) || [];
        }

        /**
         * 3. 대상자 관리 탭(applicantView)의 가상 데이터베이스 실시간 동기화 스트림 로드
         */
        function getApplicantData() {
            return JSON.parse(localStorage.getItem('dataStoreApplicant')) || [];
        }

        /**
         * 4. 주간 선택 컨트롤러 네비게이터 작동기 (화살표 터치 시 7일 주간 레일 동적 이동)
         */
        function moveMonth(v) {
            currentDate.setDate(currentDate.getDate() + (v * 7));
            renderCalendar();
        }

        /**
         * 5. 구형 백업 기능을 완전히 탈피하고 나의 시험현황방(m-login 4단계)으로 무지연 순간이동 시키는 통신 브릿지
         */
        function executeDownload() {
            if (window.parent) {
                window.parent.postMessage({ action: "GOTO_STEP_4", timestamp: Date.now() }, "*");
            }
        }

        // 글로벌 스코프 가선 공유 메모리 버퍼 풀
        let currentActiveModalJob = null;
        let currentTemporaryUid = "";
        window.currentWeeklyDateKeys = [];

        /**
         * 6. 💡 [실무 지급 공식 핵심 역산 헬퍼]: 기준일에서 특정 일수를 감산하여 진짜 내원 행정 날짜를 추적하는 유틸리티
         * @param {string} baseStr - YYYY-MM-DD 포맷의 마스터 지급 예정일자 문자열
         * @param {number} minusDays - 감산할 실무 일수 (방문채혈 7일, 종료검사 14일)
         */
        function calculateSubtractedDate(baseStr, minusDays) {
            if (!baseStr || baseStr.includes("추후")) return null;
            const dObj = new Date(baseStr.trim());
            if (isNaN(dObj.getTime())) return null;
            dObj.setDate(dObj.getDate() - minusDays);
            return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
        }

        function renderCalendar() {
            const timelineBoard = document.getElementById('weeklyTimelineBoard');
            const label = document.getElementById('currentMonthLabel');
            if (!timelineBoard) return;
            timelineBoard.innerHTML = '';

            if (label) label.innerText = `${currentDate.getFullYear()}년 ${(currentDate.getMonth() + 1).toString().padStart(2, '0')}월`;

            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            window.currentWeeklyDateKeys = [];

            const records = getMasterData(); // 모집공고 원장
            let applicantDB = getApplicantData(); // 대상자 대장

            let loggedInUser = JSON.parse(localStorage.getItem('loggedInUser')) || {};
            const currentSessionName = (loggedInUser.name || "홍길동").toString().trim();
            const cleanSessionName = currentSessionName.replace(/\s/g, "");

            // 🔒 [격리 판단 가드]: 종료, 탈락, 신검탈락, 신검동철 상태인 경우 격리 셔터 즉시 자동 해제
            const myLiveJobRecord = applicantDB.find(app =>
                (app.name || "").toString().replace(/\s/g, "") === cleanSessionName &&
                app.stage && !["종료", "탈락", "신검탈락", "신검동철"].includes(app.stage)
            );
            const isLockInUser = !!myLiveJobRecord;

            const dayNamesShort = ['일', '월', '화', '수', '목', '금', '토'];

            // 일요일부터 토요일까지 7일간의 상단 주간 날짜 핏 조립 루프
            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(startOfWeek);
                loopDate.setDate(startOfWeek.getDate() + i);

                const formattedDateKey = `${loopDate.getFullYear()}-${String(loopDate.getMonth() + 1).padStart(2, '0')}-${String(loopDate.getDate()).padStart(2, '0')}`;
                window.currentWeeklyDateKeys.push(formattedDateKey);

                // 각 요일 칸 격자 프레임 생성 및 패딩 최소화
                const dayBtn = document.createElement('div');
                dayBtn.className = `weekly-day-btn ${selectedDateStr === formattedDateKey ? 'active' : ''}`;

                // 날짜 숫자 직하단에 배지를 다중 적재할 압착 컨테이너 가선 이식
                dayBtn.innerHTML = `
                    <div class="day-name">${dayNamesShort[i]}</div>
                    <div class="day-date">${loopDate.getDate()}</div>
                    <div class="weekly-badge-container" style="width:100%; display:flex; flex-direction:column; gap:2px; margin-top:2px;"></div>
                `;

                const badgeContainer = dayBtn.querySelector('.weekly-badge-container');

                records.forEach(item => {
                    // 타과제 공고 정보는 완벽히 차단·은폐 거절 (진재영 대상자 락인 격리셔터)
                    if (isLockInUser && myLiveJobRecord.title !== item.title) return;

                    let itemScheduleMap = {};
                    if (item.recDate) itemScheduleMap[item.recDate.trim()] = "스크리닝";

                    if (isLockInUser && myLiveJobRecord.ssn && myLiveJobRecord.ssn.includes("소집:")) {
                        const parsedSojib = myLiveJobRecord.ssn.match(/\d{4}-\d{2}-\d{2}/);
                        if (parsedSojib) itemScheduleMap[parsedSojib] = "소집일";
                    }

                    if (item.payDate1) { const d = calculateSubtractedDate(item.payDate1, 7); if (d) itemScheduleMap[d] = "1차 채혈"; }
                    if (item.payDate2) { const d = calculateSubtractedDate(item.payDate2, 7); if (d) itemScheduleMap[d] = "2차 채혈"; }
                    if (item.payDate3) { const d = calculateSubtractedDate(item.payDate3, 7); if (d) itemScheduleMap[d] = "3차 채혈"; }
                    if (item.payDate4) { const d = calculateSubtractedDate(item.payDate4, 7); if (d) itemScheduleMap[d] = "4차 채혈"; }

                    if (item.paySchedule) {
                        const matchedDates = item.paySchedule.toString().match(/\d{4}-\d{2}-\d{2}/g);
                        if (matchedDates && matchedDates.length >= 5) {
                            const d = calculateSubtractedDate(matchedDates, 14); if (d) itemScheduleMap[d] = "종료검사";
                        } else if (item.payDate5) {
                            const d = calculateSubtractedDate(item.payDate5, 14); if (d) itemScheduleMap[d] = "종료검사";
                        }
                    }

                    // 현재 루프를 돌고 있는 요일 날짜(formattedDateKey)에 매칭되는 텍스트 확인
                    const dayMatchedStageText = itemScheduleMap[formattedDateKey];
                    if (dayMatchedStageText && badgeContainer) {
                        const miniBadge = document.createElement('div');
                        miniBadge.className = `th-color-${(item.th || "1기").trim()}`;
                        miniBadge.setAttribute("style", "font-size:9.5px !important; padding:1px 2px !important; border-radius:3px !important; color:#ffffff !important; font-weight:800 !important; text-align:center !important; white-space:nowrap !important; overflow:hidden; text-overflow:ellipsis; background:#0284c7; box-shadow:0 0 4px rgba(56,189,248,0.5);");
                        miniBadge.innerText = dayMatchedStageText;
                        badgeContainer.appendChild(miniBadge);
                    }
                });

                // 요일 격자 칸 터치 시 selectedDateStr 포인터를 옮기고 하단 행동 제어반을 실시간 드로잉
                dayBtn.onclick = function () {
                    selectedDateStr = formattedDateKey;
                    document.querySelectorAll('.weekly-day-btn').forEach(btn => btn.classList.remove('active'));
                    dayBtn.classList.add('active');
                    renderDailyCards(); // 하단 액션 카드 실시간 렌더링 인터록
                };

                timelineBoard.appendChild(dayBtn);
            }
            renderDailyCards(); // 최초 1회 하단 카드 싱크 가동
        }

        function renderDailyCards() {
            const cardBoard = document.getElementById('dailyCardBoard');
            if (!cardBoard) return;
            cardBoard.innerHTML = '';

            const records = getMasterData();
            let applicantDB = getApplicantData();

            let loggedInUser = JSON.parse(localStorage.getItem('loggedInUser')) || {};
            const currentSessionName = (loggedInUser.name || "홍길동").toString().trim();
            const cleanSessionName = currentSessionName.replace(/\s/g, "");

            // 🔒 [격리 판단 가드]: 종료, 탈락, 신검탈락, 신검동철 상태인 경우 데이터 열람 원천 차단
            const myLiveJobRecord = applicantDB.find(app =>
                (app.name || "").toString().replace(/\s/g, "") === cleanSessionName &&
                app.stage && !["종료", "탈락", "신검탈락", "신검동철"].includes(app.stage)
            );
            if (!myLiveJobRecord) {
                cardBoard.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:20px 10px;">임상 참여 명단 락인 세션이 존재하지 않습니다.</div>`;
                return;
            }

            const targetRec = records.find(r => r.title === myLiveJobRecord.title);
            if (!targetRec) return;

            // 선택된 날짜 기준 4대 행정 용어 실시간 역산 매트릭스 복원
            let currentDayStageText = null;
            let itemScheduleMap = {};

            if (targetRec.recDate) itemScheduleMap[targetRec.recDate.trim()] = "스크리닝";
            if (myLiveJobRecord.ssn && myLiveJobRecord.ssn.includes("소집:")) {
                const parsedSojib = myLiveJobRecord.ssn.match(/\d{4}-\d{2}-\d{2}/);
                if (parsedSojib) itemScheduleMap[parsedSojib] = "소집";
            }
            if (targetRec.payDate1) { const d = calculateSubtractedDate(targetRec.payDate1, 7); if (d) itemScheduleMap[d] = "1차방문"; }
            if (targetRec.payDate2) { const d = calculateSubtractedDate(targetRec.payDate2, 7); if (d) itemScheduleMap[d] = "2차방문"; }
            if (targetRec.payDate3) { const d = calculateSubtractedDate(targetRec.payDate3, 7); if (d) itemScheduleMap[d] = "3차방문"; }
            if (targetRec.payDate4) { const d = calculateSubtractedDate(targetRec.payDate4, 7); if (d) itemScheduleMap[d] = "4차방문"; }
            if (targetRec.paySchedule) {
                const matchedDates = targetRec.paySchedule.toString().match(/\d{4}-\d{2}-\d{2}/g);
                if (matchedDates && matchedDates.length >= 5) {
                    const d = calculateSubtractedDate(matchedDates[4], 14); if (d) itemScheduleMap[d] = "종료방문";
                } else if (targetRec.payDate5) {
                    const d = calculateSubtractedDate(targetRec.payDate5, 14); if (d) itemScheduleMap[d] = "종료방문";
                }
            }

            currentDayStageText = itemScheduleMap[selectedDateStr];

            if (!currentDayStageText) {
                cardBoard.innerHTML = `
                    <div style="color:var(--text-muted); font-size:12.5px; text-align:center; padding:30px 10px; background:var(--card-color); border:1px dashed var(--border-color); border-radius:12px;">
                        선택하신 [${selectedDateStr}] 일자에는 배정된 세부 차수 스케줄이 없습니다.
                    </div>
                `;
                return;
            }

            // 🎯 [실무 사양 완착]: 요일 터치 시 출석 제어반 노출 (참여 / 미참여 / 이력 3대 단추 정렬)
            const thText = (targetRec.th || "4기").trim();
            const card = document.createElement('div');
            card.className = 'trial-manifest-card';
            card.style.setProperty("border", "1px solid var(--secondary-color)", "important");

            card.innerHTML = `
                <div class="card-top-row">
                    <div class="card-title-text" style="color:#ffffff; font-weight:800;">🔒 ${currentDayStageText} 당일 서명 제어반</div>
                    <div class="card-th-badge th-color-${thText}">[${thText}]</div>
                </div>
                <div style="font-size:12.5px; color:#94a3b8; margin-top:4px; margin-bottom:10px; line-height:1.4;">
                    대상자: <b style="color:#fff;">${currentSessionName}</b> | 과제명: <b style="color:#38bdf8;">${targetRec.title}</b><br>
                    선택일자 내원 상태가 유효할 시 아래 참여 버튼을 눌러 출석 처리를 완료하세요.
                </div>
                <div class="card-action-bar" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
                    <button type="button" class="card-btn join" id="btn_action_join_pulse" style="height:34px; font-size:12.5px;">참여</button>
                    <button type="button" class="card-btn reject" id="btn_action_reject_pulse" style="height:34px; font-size:12.5px; background:#475569;">미참여</button>
                    <button type="button" class="card-btn close" id="btn_action_hist_pulse" style="height:34px; font-size:12.5px; background:#1e293b;"><i class="fa-solid fa-clock-history"></i> 이력</button>
                </div>
            `;
            cardBoard.appendChild(card);


            document.getElementById('btn_action_join_pulse').onclick = function () {
                let appDB = getApplicantData();

                // 마스터 대장에서 현재 살아 움직이는 진짜 대장 행의 고유 포인터 인덱스를 정밀 조준 색인
                const myIdx = appDB.findIndex(app =>
                    (app.name || '').toString().replace(/\s/g, "") === cleanSessionName &&
                    app.stage && !["종료", "탈락"].includes(app.stage)
                );

                if (myIdx !== -1) {
                    // 🎯 [실무 요구사항 대완착]: 선택된 일자의 역산 행정 명세(스크리닝/소집/1~4차방문/종료방문)를 대장 필드에 즉시 전진 엎어치기
                    appDB[myIdx].status = currentDayStageText;
                    appDB[myIdx].stage = currentDayStageText;

                    // 가상 데이터베이스 최종 트랜잭션 패킷 영구 저장
                    localStorage.setItem('dataStoreApplicant', JSON.stringify(appDB));
                    alert(`✔ 출석 처리 완료\n\n대상자님의 현재 참여 단계 상태가 [${currentDayStageText}]로 성공적으로 영구 갱신되었습니다.`);

                    // ⚡ [삼각 연동 대완결]: 최상위 본부 대시보드(admin.html) 테이블 무새로고침 원격 리렌더링 패킷 즉시 발사 불 켜기
                    if (window.opener && !window.opener.closed) {
                        if (typeof window.opener.refreshApplicantView === "function") {
                            window.opener.refreshApplicantView();
                        } else if (typeof window.opener.refreshAdminMemberTableView === "function") {
                            window.opener.refreshAdminMemberTableView();
                        }
                    }

                    renderCalendar(); // 내장 요일 바 상단 미니 배지 레이아웃 실시간 동적 새로고침 싱크 호출
                }
            };

            // 미참여 단추 터치 시 단순 토스트 알림 브릿지
            document.getElementById('btn_action_reject_pulse').onclick = function () {
                alert('미참여 신청 되었습니다.');
            };

            // 누적 이력 덤프 조회용 폴백 가드선 유지
            document.getElementById('btn_action_hist_pulse').onclick = function () {
                alert(`[이력 조회] ${currentSessionName} 대상자님의 누적 임상 참여 이력 리포트가 정상 호출되었습니다.`);
            };
        }

        // 초기 브라우저 엔진 마운트 찰나 기점 바인딩
        window.onload = function () {
            renderCalendar();
        };

    </script>
</body>

</html>
